<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Music — History</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --bg:#1a1a2e; --card:#16213e; --border:#0f3460;
    --green:#16c79a; --red:#e94560; --amber:#f0b429; --text:#eee; --dim:#8a97b1;
  }
  body { background:var(--bg); color:var(--text); font-family:'Courier New', monospace;
         padding:16px 14px 90px; max-width:640px; margin:0 auto; -webkit-text-size-adjust:100%; }
  header { display:flex; align-items:baseline; justify-content:space-between; margin-bottom:12px; }
  h1 { font-size:24px; color:var(--green); }
  .back { color:var(--dim); text-decoration:none; font-size:13px; }
  nav { display:flex; gap:8px; margin-bottom:18px; }
  nav a { flex:1; text-align:center; padding:9px; border:1px solid var(--border);
          border-radius:8px; text-decoration:none; color:var(--dim); font-size:13px; }
  nav a.active { background:var(--card); color:var(--green); border-color:var(--green); }

  .tiles { display:flex; gap:9px; margin-bottom:20px; }
  .tile { flex:1; background:var(--card); border:1px solid var(--border); border-radius:10px;
          padding:12px 10px; text-align:center; }
  .tile .n { font-size:24px; color:var(--green); line-height:1.1; }
  .tile .l { font-size:10px; color:var(--dim); margin-top:5px; line-height:1.3; }

  h2.sec { font-size:11px; letter-spacing:2px; color:var(--dim); margin:24px 0 10px;
           border-top:1px solid var(--border); padding-top:14px; }

  .grid { display:flex; gap:3px; overflow-x:auto; padding-bottom:4px; }
  .wk { display:flex; flex-direction:column; gap:3px; }
  .d { width:15px; height:15px; border-radius:3px; background:var(--card);
       border:1px solid var(--border); }
  .d.l1 { background:rgba(22,199,154,.30); border-color:rgba(22,199,154,.40); }
  .d.l2 { background:rgba(22,199,154,.55); border-color:rgba(22,199,154,.65); }
  .d.l3 { background:var(--green); border-color:var(--green); }
  .d.future { opacity:.25; }
  .legend { font-size:10px; color:var(--dim); margin-top:8px; display:flex; gap:6px;
            align-items:center; }
  .legend .d { width:11px; height:11px; }

  .day { display:flex; justify-content:space-between; align-items:baseline; gap:10px;
         border-top:1px solid var(--border); padding:10px 2px; font-size:13px; }
  .day .dt { color:var(--dim); }
  .day .ct { color:var(--green); white-space:nowrap; }
  .day .ti { font-size:11px; color:var(--dim); line-height:1.5; }
  .msg { text-align:center; color:var(--dim); font-size:12px; padding:24px 10px; line-height:1.6; }
  .msg.err { color:#f0a0a0; }
</style>
</head>
<body>

<header>
  <h1>History</h1>
  <a class="back" href="https://atlas-asittley.github.io/">&larr; hub</a>
</header>
<nav>
  <a href="index.html">Board</a>
  <a href="history.html" class="active">History</a>
</nav>

<div id="out"><div class="msg">Loading…</div></div>

<script>
const sb = window.supabase.createClient(
  'https://igaulapupbtdcqqjobhs.supabase.co',
  'sb_publishable_7yi3BNg-J-K5nralw5JSww_c71Pge6e');

const $ = id => document.getElementById(id);
const esc = s => (s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso = d => new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,10);
const todayLocal = () => iso(new Date());

(async function () {
  const { data, error } = await sb.from('music_sessions')
    .select('session_date, what').order('session_date', { ascending: false }).limit(2000);
  if (error) { $('out').innerHTML = '<div class="msg err">' + esc(error.message) + '</div>'; return; }

  // one row per thing finished, so counting rows per day = tickets done that day
  const byDay = new Map();
  data.forEach(r => {
    if (!byDay.has(r.session_date)) byDay.set(r.session_date, []);
    byDay.get(r.session_date).push(r.what);
  });

  const days = [...byDay.keys()].sort().reverse();
  const total = data.length;
  const month = todayLocal().slice(0,7);
  const thisMonth = data.filter(r => r.session_date.startsWith(month)).length;

  let streak = 0, cur = new Date(todayLocal() + 'T00:00:00');
  if (!byDay.has(todayLocal())) cur.setDate(cur.getDate() - 1);
  while (byDay.has(iso(cur))) { streak++; cur.setDate(cur.getDate() - 1); }

  // ---- heatmap: 14 weeks back, weeks as columns, Sunday at the top ----
  const end = new Date(todayLocal() + 'T00:00:00');
  end.setDate(end.getDate() + (6 - end.getDay()));        // end of this week
  const start = new Date(end); start.setDate(start.getDate() - (14*7 - 1));
  const weeks = [];
  for (let w = 0; w < 14; w++) {
    const col = [];
    for (let d = 0; d < 7; d++) {
      const day = new Date(start);
      day.setDate(day.getDate() + w*7 + d);
      const key = iso(day), n = (byDay.get(key) || []).length;
      const lvl = n === 0 ? '' : n === 1 ? ' l1' : n <= 3 ? ' l2' : ' l3';
      const future = key > todayLocal() ? ' future' : '';
      col.push('<div class="d' + lvl + future + '" title="' + key + ': ' + n + '"></div>');
    }
    weeks.push('<div class="wk">' + col.join('') + '</div>');
  }

  const dayRows = days.slice(0, 60).map(d => {
    const items = byDay.get(d);
    return '<div class="day"><div><div class="dt">' + esc(d) + '</div>' +
      '<div class="ti">' + items.slice(0,4).map(esc).join(' · ') +
      (items.length > 4 ? ' · +' + (items.length - 4) + ' more' : '') + '</div></div>' +
      '<div class="ct">' + items.length + '</div></div>';
  }).join('');

  $('out').innerHTML =
    '<div class="tiles">' +
      '<div class="tile"><div class="n">' + total + '</div><div class="l">things finished</div></div>' +
      '<div class="tile"><div class="n">' + thisMonth + '</div><div class="l">this month</div></div>' +
      '<div class="tile"><div class="n">' + days.length + '</div><div class="l">days worked</div></div>' +
      '<div class="tile"><div class="n">' + streak + '</div><div class="l">day streak</div></div>' +
    '</div>' +
    '<h2 class="sec">THE LAST 14 WEEKS</h2>' +
    '<div class="grid">' + weeks.join('') + '</div>' +
    '<div class="legend">none <span class="d"></span><span class="d l1"></span>' +
      '<span class="d l2"></span><span class="d l3"></span> four or more</div>' +
    '<h2 class="sec">DAY BY DAY</h2>' +
    (dayRows || '<div class="msg">Nothing yet. Check a ticket off on the board.</div>');
})();
</script>
</body>
</html>
