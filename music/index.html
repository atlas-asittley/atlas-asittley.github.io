<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Music Tracker</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --bg:#1a1a2e; --card:#16213e; --border:#0f3460;
    --green:#16c79a; --red:#e94560; --amber:#f0b429; --text:#eee; --dim:#8a97b1;
  }
  body {
    background:var(--bg); color:var(--text);
    font-family:'Courier New', monospace;
    padding:16px 14px 90px; max-width:640px; margin:0 auto;
    -webkit-text-size-adjust:100%;
  }
  header { display:flex; align-items:baseline; justify-content:space-between; margin-bottom:4px; }
  h1 { font-size:24px; color:var(--green); }
  .back { color:var(--dim); text-decoration:none; font-size:13px; }
  .streak { color:var(--dim); font-size:13px; margin-bottom:18px; line-height:1.5; }
  .streak b { color:var(--text); }

  /* ---------- song blocks ---------- */
  .song { border:1px solid var(--border); border-radius:12px; margin-bottom:18px;
          background:rgba(0,0,0,.18); overflow:hidden; }
  .song-h { background:var(--border); padding:12px 13px; display:flex;
            align-items:baseline; justify-content:space-between; gap:10px;
            cursor:pointer; user-select:none; -webkit-tap-highlight-color:transparent; }
  .song-h:active { filter:brightness(1.25); }
  .song-h .pos { color:var(--green); font-size:13px; margin-right:7px; }
  .song-h .nm  { font-size:16px; letter-spacing:1px; color:var(--text); }
  .song-h .ct  { font-size:11px; color:var(--dim); white-space:nowrap; }
  .song-h .car { display:inline-block; color:var(--dim); font-size:11px; transition:transform .12s; }
  .song.open .song-h .car { transform:rotate(90deg); }
  .song:not(.open) .song-body { display:none; }
  .song.nosong .song-h { background:transparent; border-bottom:1px dashed var(--border); }
  .song.nosong .song-h .nm { color:var(--dim); font-size:13px; }
  .song-note { font-size:11px; color:var(--dim); line-height:1.5; padding:11px 13px 0; }
  .song-body { padding:11px 11px 11px; }

  /* ---------- tickets ---------- */
  .ticket { background:var(--card); border:1px solid var(--border); border-radius:10px;
            padding:11px 12px; margin-bottom:9px; display:flex; gap:11px; align-items:flex-start; }
  .ticket.doing { border-color:var(--green); background:rgba(22,199,154,.09); }
  .ticket.any   { border-style:dashed; }
  .ticket.is-done { opacity:.5; }
  .ticket.is-done .t-title { text-decoration:line-through; }

  .box-chk { flex:0 0 auto; width:26px; height:26px; border:1px solid var(--dim);
             border-radius:7px; background:none; color:var(--green); font-size:15px;
             line-height:1; display:flex; align-items:center; justify-content:center;
             font-family:inherit; margin-top:1px; }
  .box-chk.on { border-color:var(--green); background:rgba(22,199,154,.18); }
  .box-chk.any { border-radius:50%; font-size:13px; color:var(--amber); border-color:var(--amber); }
  .t-main { flex:1 1 auto; min-width:0; }
  .chip { display:inline-block; font-size:10px; letter-spacing:1px; padding:2px 7px;
          border-radius:20px; border:1px solid var(--dim); color:var(--dim); margin-bottom:6px; }
  .chip.next  { border-color:var(--amber); color:var(--amber); }
  .chip.doing { border-color:var(--green); color:var(--green); }
  .t-title { font-size:15px; line-height:1.4; }
  .t-fin   { font-size:12px; color:var(--dim); margin-top:7px; line-height:1.45;
             border-left:2px solid var(--border); padding-left:8px; }
  .t-fin b { color:var(--green); font-weight:normal; }
  .t-fin.none { color:var(--red); border-left-color:var(--red); }
  .t-btns  { display:flex; gap:7px; margin-top:9px; flex-wrap:wrap; }
  .t-btns button { background:none; border:1px solid var(--border); color:var(--dim);
                   border-radius:7px; padding:6px 10px; font-family:inherit; font-size:12px; }
  .t-btns button.go { border-color:var(--green); color:var(--green); }
  .t-btns button.kill { border-color:transparent; color:var(--dim); margin-left:auto; }
  .t-btns button:active { background:var(--border); }
  .t-done-at { font-size:11px; color:var(--dim); margin-top:6px; }

  /* ---------- inline add ---------- */
  .addline { width:100%; background:none; border:1px dashed var(--border); color:var(--dim);
             border-radius:9px; padding:10px; font-family:inherit; font-size:13px; }
  .addline:active { background:var(--border); }
  .addform { border:1px dashed var(--border); border-radius:9px; padding:11px; }
  .addform input { width:100%; background:var(--bg); border:1px solid var(--border);
                   color:var(--text); border-radius:7px; padding:10px; font-family:inherit;
                   font-size:16px; margin-bottom:8px; }
  .addform input:focus { outline:none; border-color:var(--green); }
  .addform .hint { font-size:11px; color:var(--dim); line-height:1.5; margin-bottom:9px; }
  .addform .row { display:flex; gap:8px; }
  .addform .row button { flex:1; background:none; border:1px solid var(--green); color:var(--green);
                         border-radius:8px; padding:10px; font-family:inherit; font-size:13px; }
  .addform .row button.quiet { border-color:var(--border); color:var(--dim); }
  .hidden { display:none; }

  .donehead { font-size:11px; letter-spacing:1px; color:var(--dim); margin:14px 0 8px; }
  .empty { color:var(--dim); font-size:12px; padding:2px 0 8px; line-height:1.5; }
  .msg { text-align:center; color:var(--dim); font-size:12px; padding:10px; line-height:1.5; }
  .msg.err { color:#f0a0a0; }
  #addsong { margin-top:4px; }
</style>
</head>
<body>

<header>
  <h1>Music</h1>
  <a class="back" href="https://atlas-asittley.github.io/">&larr; hub</a>
</header>
<div class="streak" id="streak">&nbsp;</div>

<div id="board"><div class="msg">Loading…</div></div>

<div id="addsong">
  <button class="addline" data-act="songform">+ add a song</button>
  <div class="addform hidden" id="songform">
    <input type="text" id="song-name" placeholder="song name (a working title is fine)">
    <input type="text" id="song-pos" inputmode="numeric" placeholder="position in the set (blank = not in the set)">
    <div class="row">
      <button data-act="songsave">Add song</button>
      <button class="quiet" data-act="songcancel">Cancel</button>
    </div>
    <div class="msg" id="song-msg"></div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://igaulapupbtdcqqjobhs.supabase.co';
const SUPABASE_KEY = 'sb_publishable_7yi3BNg-J-K5nralw5JSww_c71Pge6e';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = id => document.getElementById(id);
const esc = s => (s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const todayLocal = () => new Date(Date.now() - new Date().getTimezoneOffset()*60000)
  .toISOString().slice(0,10);

let tickets = [], sessions = [], songs = [];

async function load() {
  const [t, s, g] = await Promise.all([
    sb.from('music_tickets').select('*').order('created_at', { ascending: true }),
    sb.from('music_sessions').select('*').order('session_date', { ascending: false }).limit(300),
    sb.from('music_songs').select('*')
  ]);
  const err = t.error || s.error || g.error;
  if (err) {
    $('board').innerHTML = '<div class="msg err">' + esc(err.message) + '</div>';
    return;
  }
  tickets = t.data; sessions = s.data; songs = g.data;
  renderStreak(); renderBoard();
}

function renderStreak() {
  const days = [...new Set(sessions.map(r => r.session_date))].sort().reverse();
  if (!days.length) { $('streak').textContent = 'Nothing logged yet. Check something off.'; return; }
  let streak = 0, cur = new Date(todayLocal() + 'T00:00:00');
  if (days[0] !== todayLocal()) cur.setDate(cur.getDate() - 1);
  while (days.includes(cur.toISOString().slice(0,10))) { streak++; cur.setDate(cur.getDate() - 1); }
  const month = todayLocal().slice(0,7);
  $('streak').innerHTML = '<b>' + days.length + '</b> days of music work · <b>' +
    days.filter(d => d.startsWith(month)).length + '</b> this month' +
    (streak > 1 ? ' · <b>' + streak + '</b> in a row' : '') + '<br>last: ' + esc(days[0]);
}

/* ---------------- open/closed state ---------------- */
function openSet() {
  try { return new Set(JSON.parse(localStorage.getItem('mt-open') || '[]')); }
  catch (e) { return new Set(); }
}
function saveOpen(set) {
  try { localStorage.setItem('mt-open', JSON.stringify([...set])); } catch (e) {}
}

/* ---------------- tickets ---------------- */
function ticketHTML(t) {
  const done = t.status === 'done';
  const cls = 'ticket' + (t.anytime ? ' any' : '') + (done ? ' is-done' : '');

  // anytime tickets never complete -- they log a session and stay on the board
  const chk = t.anytime
    ? '<button class="box-chk any" data-act="logit" data-id="' + t.id + '" title="did this">&#8635;</button>'
    : '<button class="box-chk' + (done ? ' on' : '') + '" data-act="' +
      (done ? 'undone' : 'done') + '" data-id="' + t.id + '">' + (done ? '&#10003;' : '') + '</button>';

  // No queue, no status. The board is a menu: pick a ticket and work on it.
  // ANYTIME is the one label left, because it explains why there's no checkbox.
  const chip = (!done && t.anytime) ? '<div class="chip">ANYTIME</div>' : '';

  const fin = done ? ''
    : (t.finish_line && t.finish_line.trim()
        ? '<div class="t-fin"><b>done when</b> ' + esc(t.finish_line) + '</div>'
        : '<div class="t-fin none">no finish line — what would make this done?</div>');

  let btns = '';
  if (done) {
    btns = t.done_at ? '<div class="t-done-at">done ' + esc(t.done_at.slice(0,10)) + '</div>' : '';
  } else {
    btns = '<div class="t-btns"><button class="kill" data-act="del" data-id="' +
           t.id + '">delete</button></div>';
  }

  return '<div class="' + cls + '">' + chk + '<div class="t-main">' + chip +
    '<div class="t-title">' + esc(t.title) + '</div>' + fin + btns + '</div></div>';
}

function songBlock(name, pos, note, live, done, isLoose) {
  const stored = localStorage.getItem('mt-open');
  const isOpen = stored !== null ? openSet().has(name) : true;
  const key = esc(name);
  return '<div class="song' + (isLoose ? ' nosong' : '') + (isOpen ? ' open' : '') +
    '" data-song="' + key + '">' +
    '<div class="song-h">' +
      '<span class="nm">' + (pos ? '<span class="pos">' + pos + '</span>' : '') + key + '</span>' +
      '<span class="ct">' + (!pos && !isLoose ? 'not in the set · ' : '') +
        live.length + (live.length === 1 ? ' thing' : ' things') +
        (done.length ? ' · ' + done.length + ' done' : '') +
        ' <span class="car">&rsaquo;</span></span>' +
    '</div>' +
    '<div class="song-body">' +
      (note ? '<div class="song-note">' + esc(note) + '</div>' : '') +
      (live.length ? live.map(ticketHTML).join('')
                   : '<div class="empty">Nothing listed for this one yet.</div>') +
      '<button class="addline" data-act="ticketform" data-song="' + key + '">+ add a ticket</button>' +
      '<div class="addform hidden" data-form="' + key + '">' +
        '<div class="hint">A finish line you can answer yes or no to — and that quality ' +
          'can&rsquo;t fail. &ldquo;One version exists&rdquo;, not &ldquo;a good one&rdquo;.</div>' +
        '<input type="text" class="f-title" placeholder="what needs doing">' +
        '<input type="text" class="f-fin" placeholder="done when…">' +
        '<div class="row">' +
          '<button data-act="ticketsave" data-song="' + key + '">Add</button>' +
          '<button class="quiet" data-act="ticketcancel" data-song="' + key + '">Cancel</button>' +
        '</div>' +
      '</div>' +
      (done.length ? '<div class="donehead">DONE</div>' + done.map(ticketHTML).join('') : '') +
    '</div></div>';
}

function renderBoard() {
  const byRank = (a,b) => (a.anytime === b.anytime) ? 0 : (a.anytime ? 1 : -1);
  const byDone = (a,b) => (b.done_at || '').localeCompare(a.done_at || '');
  const live = tickets.filter(t => t.status !== 'done');
  const fin  = tickets.filter(t => t.status === 'done');

  const ordered = songs.slice().sort((a,b) =>
    (a.set_position ?? 999) - (b.set_position ?? 999) || a.name.localeCompare(b.name));
  const known = new Set(ordered.map(s => s.name));
  const orphans = [...new Set(tickets.map(t => t.song).filter(n => n && !known.has(n)))].sort();

  const blocks = ordered.map(s => songBlock(s.name, s.set_position, s.notes,
    live.filter(t => t.song === s.name).sort(byRank),
    fin.filter(t => t.song === s.name).sort(byDone), false));

  orphans.forEach(n => blocks.push(songBlock(n, null, null,
    live.filter(t => t.song === n).sort(byRank),
    fin.filter(t => t.song === n).sort(byDone), false)));

  const looseLive = live.filter(t => !t.song), looseDone = fin.filter(t => !t.song);
  if (looseLive.length || looseDone.length)
    blocks.push(songBlock('NO SONG YET', null, 'Where new ones come from.',
      looseLive.sort(byRank), looseDone.sort(byDone), true));

  $('board').innerHTML = blocks.join('') || '<div class="empty">No songs yet.</div>';
}

/* ---------------- actions ---------------- */
async function logSession(what) {
  await sb.from('music_sessions').insert({ session_date: todayLocal(), what: what || 'music work' });
}

document.addEventListener('click', async e => {
  const b = e.target.closest('button[data-act]');

  // tapping a song header toggles it (but not when a button inside was hit)
  if (!b) {
    const h = e.target.closest('.song-h');
    if (!h) return;
    const block = h.parentElement, set = openSet();
    block.classList.toggle('open');
    if (block.classList.contains('open')) set.add(block.dataset.song);
    else set.delete(block.dataset.song);
    if (localStorage.getItem('mt-open') === null)
      document.querySelectorAll('.song.open').forEach(el => set.add(el.dataset.song));
    saveOpen(set);
    return;
  }

  const act = b.dataset.act, id = b.dataset.id, song = b.dataset.song;
  const formFor = n => [...document.querySelectorAll('.addform[data-form]')]
    .find(f => f.dataset.form === n);

  // --- inline forms ---
  if (act === 'ticketform' || act === 'ticketcancel') {
    const form = formFor(song);
    form.classList.toggle('hidden', act === 'ticketcancel');
    b.closest('.song-body').querySelector('.addline').classList
      .toggle('hidden', act === 'ticketform');
    if (act === 'ticketform') form.querySelector('.f-title').focus();
    return;
  }
  if (act === 'ticketsave') {
    const form = formFor(song);
    const title = form.querySelector('.f-title').value.trim();
    if (!title) return;
    b.disabled = true;
    await sb.from('music_tickets').insert({
      title, song, finish_line: form.querySelector('.f-fin').value.trim() || null, status: 'later'
    });
    await load();
    return;
  }
  if (act === 'songform' || act === 'songcancel') {
    $('songform').classList.toggle('hidden', act === 'songcancel');
    document.querySelector('[data-act="songform"]').classList.toggle('hidden', act === 'songform');
    return;
  }
  if (act === 'songsave') {
    const name = $('song-name').value.trim();
    if (!name) return;
    const posRaw = $('song-pos').value.trim();
    b.disabled = true;
    const { error } = await sb.from('music_songs')
      .insert({ name, set_position: posRaw ? parseInt(posRaw, 10) : null });
    b.disabled = false;
    if (error) { $('song-msg').textContent = error.message; $('song-msg').className = 'msg err'; return; }
    $('song-name').value = ''; $('song-pos').value = ''; $('song-msg').textContent = '';
    $('songform').classList.add('hidden');
    document.querySelector('[data-act="songform"]').classList.remove('hidden');
    await load();
    return;
  }

  // --- ticket actions ---
  if (!id) return;
  b.disabled = true;
  const t = tickets.find(x => x.id === id);
  if (act === 'del') {
    if (!confirm('Delete this ticket for good? Checking it off instead keeps it as a record.')) {
      b.disabled = false; return;
    }
    await sb.from('music_tickets').delete().eq('id', id);
  } else if (act === 'done') {
    await sb.from('music_tickets')
      .update({ status:'done', done_at:new Date().toISOString() }).eq('id', id);
    await logSession(t ? t.title : 'finished a ticket');
  } else if (act === 'undone') {
    await sb.from('music_tickets').update({ status:'later', done_at:null }).eq('id', id);
  } else if (act === 'logit') {
    await logSession(t ? t.title : 'music work');
  } else {
    await sb.from('music_tickets').update({ status: act }).eq('id', id);
  }
  await load();
});

load();
</script>
</body>
</html>
