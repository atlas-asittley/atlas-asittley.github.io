<!DOCTYPE html>
<!--
  ============================================================================
  MUSIC TRACKER  --  DESIGN INTENT.  READ BEFORE CHANGING THIS PAGE.

  Drew, 2026-10-18, in his own words:

    "I want this page to be sort of fun and express some excitement about the
     fact that I'm progressing. It's like at the end of a level in a phone game
     when you complete it -- there are things that make it seem congratulatory."

  So this page is NOT a neutral record. Finishing something here should feel
  like a small win: the meter animates, a toast fires, milestones get a bigger
  reaction. Keep that whenever this page is extended -- a new feature that
  merely displays data has missed the point of the page.

  WHY IT MATTERS (from the Reflection Space, 2026-10-16): his gym habit survives
  because the tracker shows accumulated progress he wants to keep going. Every
  music practice he has ever started has died. The visible, satisfying record is
  the mechanism being copied here, not a decoration on top of it.

  The set meter measures MINUTES he can play front to back, out of 60 -- never
  ticket counts. He writes the tickets, so their size is arbitrary and a
  ticket-based percentage would lie.
  ============================================================================
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Music Tracker</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --bg:#1a1a2e; --card:#16213e; --border:#0f3460;
    --green:#16c79a; --red:#e94560; --amber:#f0b429; --text:#eee; --dim:#8a97b1;
  }
  body {
    background:var(--bg); color:var(--text);
    font-family:'Courier New', monospace;
    padding:16px 14px 90px; max-width:640px; margin:0 auto;
    -webkit-text-size-adjust:100%;
  }
  header { display:flex; align-items:baseline; justify-content:space-between; margin-bottom:4px; }
  h1 { font-size:24px; color:var(--green); }
  .back { color:var(--dim); text-decoration:none; font-size:13px; }
  nav { display:flex; gap:8px; margin:12px 0 14px; }
  nav a { flex:1; text-align:center; padding:9px; border:1px solid var(--border);
          border-radius:8px; text-decoration:none; color:var(--dim); font-size:13px; }
  nav a.active { background:var(--card); color:var(--green); border-color:var(--green); }
  .streak { color:var(--dim); font-size:13px; margin-bottom:16px; line-height:1.5; }

  /* ---------- the set meter ---------- */
  .meter { background:var(--card); border:1px solid var(--border); border-radius:12px;
           padding:14px; margin-bottom:20px; }
  .meter .top { display:flex; align-items:baseline; justify-content:space-between; gap:10px; }
  .meter .mins { font-size:26px; color:var(--green); line-height:1.1; }
  .meter .of { font-size:12px; color:var(--dim); }
  .meter .goal { font-size:11px; color:var(--dim); text-align:right; line-height:1.5; }
  .bar { position:relative; height:16px; background:var(--bg); border:1px solid var(--border);
         border-radius:9px; margin:12px 0 9px; overflow:hidden; }
  .bar .fill { height:100%; width:0;
               background:linear-gradient(90deg, rgba(22,199,154,.55), var(--green));
               transition:width .9s cubic-bezier(.2,.8,.2,1); }
  .bar .tick { position:absolute; top:0; bottom:0; width:1px; background:var(--border); }
  .meter .sub { font-size:11px; color:var(--dim); line-height:1.5; }
  .meter.full { border-color:var(--green); box-shadow:0 0 22px rgba(22,199,154,.25); }

  /* ---------- per-song meta row ---------- */
  .song-meta { display:flex; gap:7px; flex-wrap:wrap; padding:11px 13px 0; }
  .song-meta button { background:none; border:1px solid var(--border); color:var(--dim);
                      border-radius:20px; padding:5px 11px; font-family:inherit; font-size:11px; }
  .song-meta button.on { border-color:var(--green); color:var(--green);
                         background:rgba(22,199,154,.12); }
  .song-meta button:active { background:var(--border); }
  .song-h .rdy { color:var(--green); font-size:12px; margin-left:7px; }

  /* ---------- congratulation ---------- */
  #toast { position:fixed; left:50%; bottom:22px; transform:translate(-50%, 140%);
           background:var(--card); border:1px solid var(--green); color:var(--text);
           border-radius:12px; padding:13px 17px; font-size:14px; line-height:1.45;
           max-width:90vw; text-align:center; z-index:50; pointer-events:none;
           box-shadow:0 8px 30px rgba(0,0,0,.45); transition:transform .4s cubic-bezier(.2,1.3,.4,1); }
  #toast.show { transform:translate(-50%, 0); }
  #toast .big { color:var(--green); font-size:16px; display:block; margin-bottom:3px; }
  .spark { position:fixed; width:8px; height:8px; border-radius:50%; z-index:49;
           pointer-events:none; animation:fly .9s ease-out forwards; }
  @keyframes fly {
    from { transform:translate(0,0) scale(1); opacity:1; }
    to   { transform:translate(var(--dx), var(--dy)) scale(.3); opacity:0; }
  }
  .streak b { color:var(--text); }

  /* ---------- song blocks ---------- */
  .song { border:1px solid var(--border); border-radius:12px; margin-bottom:18px;
          background:rgba(0,0,0,.18); overflow:hidden; }
  .song-h { background:var(--border); padding:12px 13px; display:flex;
            align-items:baseline; justify-content:space-between; gap:10px;
            cursor:pointer; user-select:none; -webkit-tap-highlight-color:transparent; }
  .song-h:active { filter:brightness(1.25); }
  .song-h .pos { color:var(--green); font-size:13px; margin-right:7px; }
  .song-h .nm  { font-size:16px; letter-spacing:1px; color:var(--text); }
  .song-h .ct  { font-size:11px; color:var(--dim); white-space:nowrap; }
  .song-h .car { display:inline-block; color:var(--dim); font-size:11px; transition:transform .12s; }
  .song.open .song-h .car { transform:rotate(90deg); }
  .song:not(.open) .song-body { display:none; }
  .song.nosong .song-h { background:transparent; border-bottom:1px dashed var(--border); }
  .song.nosong .song-h .nm { color:var(--dim); font-size:13px; }
  .song-note { font-size:11px; color:var(--dim); line-height:1.5; padding:11px 13px 0; }
  .song-body { padding:11px 11px 11px; }

  /* ---------- drag to reorder (grip = the only drag target) ---------- */
  /* The hit area has to be thumb-sized -- a 13px glyph is not grabbable on a phone. */
  .grip { touch-action:none; cursor:grab; color:var(--dim); font-size:15px;
          display:inline-flex; align-items:center; justify-content:center;
          min-width:40px; min-height:40px; margin:-12px 0; vertical-align:middle;
          -webkit-tap-highlight-color:transparent; }
  .grip:active { color:var(--green); }
  .song-h .nm .grip { margin-left:-12px; margin-right:1px; }
  .ticket > .grip { align-self:center; margin-left:auto; margin-right:-6px; }
  .song.dragging, .ticket.dragging {
    border-color:var(--green); position:relative; z-index:6;
    box-shadow:0 10px 26px rgba(0,0,0,.5); }
  .song.dragging .song-h { filter:brightness(1.35); }
  .song.dragging .grip, .ticket.dragging .grip { color:var(--green); }
  /* while dragging songs, collapse every body so the whole setlist fits on screen */
  body.drag-song .song-body { display:none; }
  body.drag-song, body.drag-ticket { user-select:none; -webkit-user-select:none; }

  /* ---------- tickets ---------- */
  .ticket { background:var(--card); border:1px solid var(--border); border-radius:10px;
            padding:11px 12px; margin-bottom:9px; display:flex; gap:11px; align-items:flex-start; }
  .ticket.doing { border-color:var(--green); background:rgba(22,199,154,.09); }
  .ticket.any   { border-style:dashed; }
  .ticket.is-done { opacity:.5; }
  .ticket.is-done .t-title { text-decoration:line-through; }

  .box-chk { flex:0 0 auto; width:26px; height:26px; border:1px solid var(--dim);
             border-radius:7px; background:none; color:var(--green); font-size:15px;
             line-height:1; display:flex; align-items:center; justify-content:center;
             font-family:inherit; margin-top:1px; }
  .box-chk.on { border-color:var(--green); background:rgba(22,199,154,.18); }
  .box-chk.any { border-radius:50%; font-size:13px; color:var(--amber); border-color:var(--amber); }
  .t-main { flex:1 1 auto; min-width:0; }
  .chip { display:inline-block; font-size:10px; letter-spacing:1px; padding:2px 7px;
          border-radius:20px; border:1px solid var(--dim); color:var(--dim); margin-bottom:6px; }
  .chip.next  { border-color:var(--amber); color:var(--amber); }
  .chip.doing { border-color:var(--green); color:var(--green); }
  .t-title { font-size:15px; line-height:1.4; }
  .t-fin   { font-size:12px; color:var(--dim); margin-top:7px; line-height:1.45;
             border-left:2px solid var(--border); padding-left:8px; }
  .t-fin b { color:var(--green); font-weight:normal; }
  .t-fin.none { color:var(--red); border-left-color:var(--red); }
  .t-btns  { display:flex; gap:7px; margin-top:9px; flex-wrap:wrap; }
  .t-btns button { background:none; border:1px solid var(--border); color:var(--dim);
                   border-radius:7px; padding:6px 10px; font-family:inherit; font-size:12px; }
  .t-btns button.go { border-color:var(--green); color:var(--green); }
  .t-btns button.kill { border-color:transparent; color:var(--dim); margin-left:auto; }
  .t-btns button:active { background:var(--border); }
  .t-done-at { font-size:11px; color:var(--dim); margin-top:6px; }

  /* ---------- inline add ---------- */
  .addline { width:100%; background:none; border:1px dashed var(--border); color:var(--dim);
             border-radius:9px; padding:10px; font-family:inherit; font-size:13px; }
  .addline:active { background:var(--border); }
  .addform { border:1px dashed var(--border); border-radius:9px; padding:11px; }
  .addform input { width:100%; background:var(--bg); border:1px solid var(--border);
                   color:var(--text); border-radius:7px; padding:10px; font-family:inherit;
                   font-size:16px; margin-bottom:8px; }
  .addform input:focus { outline:none; border-color:var(--green); }
  .addform .hint { font-size:11px; color:var(--dim); line-height:1.5; margin-bottom:9px; }
  .addform .row { display:flex; gap:8px; }
  .addform .row button { flex:1; background:none; border:1px solid var(--green); color:var(--green);
                         border-radius:8px; padding:10px; font-family:inherit; font-size:13px; }
  .addform .row button.quiet { border-color:var(--border); color:var(--dim); }
  .hidden { display:none; }

  .donehead { font-size:11px; letter-spacing:1px; color:var(--dim); margin:14px 0 8px; }
  .empty { color:var(--dim); font-size:12px; padding:2px 0 8px; line-height:1.5; }
  .msg { text-align:center; color:var(--dim); font-size:12px; padding:10px; line-height:1.5; }
  .msg.err { color:#f0a0a0; }
  #addsong { margin-top:4px; }
</style>
</head>
<body>

<header>
  <h1>Music</h1>
  <a class="back" href="https://atlas-asittley.github.io/">&larr; hub</a>
</header>
<nav>
  <a href="index.html" class="active">Board</a>
  <a href="history.html">History</a>
</nav>
<div class="streak" id="streak">&nbsp;</div>

<div id="meter"></div>

<div id="board"><div class="msg">Loading…</div></div>

<div id="addsong">
  <button class="addline" data-act="songform">+ add a song</button>
  <div class="addform hidden" id="songform">
    <input type="text" id="song-name" placeholder="song name (a working title is fine)">
    <input type="text" id="song-pos" inputmode="numeric" placeholder="position in the set (blank = not in the set)">
    <div class="row">
      <button data-act="songsave">Add song</button>
      <button class="quiet" data-act="songcancel">Cancel</button>
    </div>
    <div class="msg" id="song-msg"></div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://igaulapupbtdcqqjobhs.supabase.co';
const SUPABASE_KEY = 'sb_publishable_7yi3BNg-J-K5nralw5JSww_c71Pge6e';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = id => document.getElementById(id);
const esc = s => (s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const todayLocal = () => new Date(Date.now() - new Date().getTimezoneOffset()*60000)
  .toISOString().slice(0,10);

let tickets = [], sessions = [], songs = [];

async function load() {
  const [t, s, g] = await Promise.all([
    sb.from('music_tickets').select('*')
      .order('sort_order', { ascending: true, nullsFirst: false })
      .order('created_at', { ascending: true }),
    sb.from('music_sessions').select('*').order('session_date', { ascending: false }).limit(300),
    sb.from('music_songs').select('*')
  ]);
  const err = t.error || s.error || g.error;
  if (err) {
    $('board').innerHTML = '<div class="msg err">' + esc(err.message) + '</div>';
    return;
  }
  tickets = t.data; sessions = s.data; songs = g.data;
  renderStreak(); renderMeter(); renderBoard();
}

const SET_GOAL = 60;   // minutes. The hour-long solo set.

function readyMinutes() {
  return songs.filter(s => s.performable)
              .reduce((n, s) => n + (Number(s.length_minutes) || 0), 0);
}

function renderMeter(animateFrom) {
  const mins = readyMinutes();
  const ready = songs.filter(s => s.performable).length;
  const pct = Math.min(100, (mins / SET_GOAL) * 100);
  const noLen = songs.filter(s => s.performable && !s.length_minutes).length;
  const ticks = [25,50,75].map(p => '<div class="tick" style="left:' + p + '%"></div>').join('');
  $('meter').innerHTML =
    '<div class="meter' + (mins >= SET_GOAL ? ' full' : '') + '">' +
      '<div class="top"><div><span class="mins">' + (Math.round(mins*10)/10) +
        '</span> <span class="of">of ' + SET_GOAL + ' minutes ready</span></div>' +
        '<div class="goal">' + ready + (ready === 1 ? ' song' : ' songs') +
        '<br>you can play front to back</div></div>' +
      '<div class="bar">' + ticks + '<div class="fill" id="fill"></div></div>' +
      '<div class="sub">' +
        (mins >= SET_GOAL ? 'That is the whole hour. Go book something.'
         : noLen ? 'Add a length to ' + noLen + ' song' + (noLen === 1 ? '' : 's') +
                   ' so they count toward the hour.'
         : mins === 0 ? 'Mark a song "can play it" once you can get through it without stopping.'
         : (Math.round((SET_GOAL - mins)*10)/10) + ' minutes to go.') +
      '</div></div>';
  // animate from the old value so growth is visible rather than just present
  const fill = $('fill');
  const from = animateFrom == null ? pct : Math.min(100, (animateFrom / SET_GOAL) * 100);
  fill.style.width = from + '%';
  requestAnimationFrame(() => requestAnimationFrame(() => { fill.style.width = pct + '%'; }));
}

/* ---------- congratulation ----------------------------------------------
   Deliberate. See the design-intent comment at the top of this file: finishing
   something here is supposed to feel like finishing a level, not like saving a
   row to a database. ---------------------------------------------------- */
const CHEERS = ['Nice.','Got one.','That is done.','Chalk it up.','Good.','Another one down.',
                'Done and dusted.','In the bank.'];
let toastTimer = null;

function celebrate(line, big, el) {
  const t = $('toast');
  t.innerHTML = (big ? '<span class="big">' + big + '</span>' : '') + line;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), big ? 4200 : 2600);
  sparks(el, big ? 22 : 10);
}

function sparks(el, n) {
  const r = el && el.getBoundingClientRect
    ? el.getBoundingClientRect()
    : { left: innerWidth/2, top: innerHeight/2, width: 0, height: 0 };
  const x = r.left + r.width/2, y = r.top + r.height/2;
  const cols = ['#16c79a','#f0b429','#eee'];
  for (let i = 0; i < n; i++) {
    const d = document.createElement('div');
    d.className = 'spark';
    const a = Math.random() * Math.PI * 2, dist = 40 + Math.random() * 70;
    d.style.cssText = 'left:' + x + 'px; top:' + y + 'px; background:' +
      cols[i % cols.length] + '; --dx:' + (Math.cos(a)*dist).toFixed(0) + 'px; --dy:' +
      (Math.sin(a)*dist - 20).toFixed(0) + 'px;';
    document.body.appendChild(d);
    setTimeout(() => d.remove(), 950);
  }
}

const MILESTONES = [15, 30, 45, 60];
function milestoneCrossed(before, after) {
  return MILESTONES.filter(m => before < m && after >= m).pop();
}

function renderStreak() {
  const days = [...new Set(sessions.map(r => r.session_date))].sort().reverse();
  if (!days.length) { $('streak').textContent = 'Nothing logged yet. Check something off.'; return; }
  let streak = 0, cur = new Date(todayLocal() + 'T00:00:00');
  if (days[0] !== todayLocal()) cur.setDate(cur.getDate() - 1);
  while (days.includes(cur.toISOString().slice(0,10))) { streak++; cur.setDate(cur.getDate() - 1); }
  const month = todayLocal().slice(0,7);
  $('streak').innerHTML = '<b>' + days.length + '</b> days of music work · <b>' +
    days.filter(d => d.startsWith(month)).length + '</b> this month' +
    (streak > 1 ? ' · <b>' + streak + '</b> in a row' : '') + '<br>last: ' + esc(days[0]);
}

/* ---------------- open/closed state ---------------- */
function openSet() {
  try { return new Set(JSON.parse(localStorage.getItem('mt-open') || '[]')); }
  catch (e) { return new Set(); }
}
function saveOpen(set) {
  try { localStorage.setItem('mt-open', JSON.stringify([...set])); } catch (e) {}
}

/* ---------------- tickets ---------------- */
function ticketHTML(t) {
  const done = t.status === 'done';
  const cls = 'ticket' + (t.anytime ? ' any' : '') + (done ? ' is-done' : '');

  // anytime tickets never complete -- they log a session and stay on the board
  const chk = t.anytime
    ? '<button class="box-chk any" data-act="logit" data-id="' + t.id + '" title="did this">&#8635;</button>'
    : '<button class="box-chk' + (done ? ' on' : '') + '" data-act="' +
      (done ? 'undone' : 'done') + '" data-id="' + t.id + '">' + (done ? '&#10003;' : '') + '</button>';

  // No queue, no status. The board is a menu: pick a ticket and work on it.
  // ANYTIME is the one label left, because it explains why there's no checkbox.
  const chip = (!done && t.anytime) ? '<div class="chip">ANYTIME</div>' : '';

  const fin = done ? ''
    : (t.finish_line && t.finish_line.trim()
        ? '<div class="t-fin"><b>done when</b> ' + esc(t.finish_line) + '</div>'
        : '<div class="t-fin none">no finish line — what would make this done?</div>');

  let btns = '';
  if (done) {
    btns = t.done_at ? '<div class="t-done-at">done ' + esc(t.done_at.slice(0,10)) + '</div>' : '';
  } else {
    btns = '<div class="t-btns"><button class="kill" data-act="del" data-id="' +
           t.id + '">delete</button></div>';
  }

  const grip = done ? ''
    : '<span class="grip" data-grip="ticket" title="drag to reorder">&#9776;</span>';

  return '<div class="' + cls + '" data-id="' + t.id + '">' + chk +
    '<div class="t-main">' + chip +
    '<div class="t-title">' + esc(t.title) + '</div>' + fin + btns + '</div>' +
    grip + '</div>';
}

function songBlock(name, pos, note, live, done, isLoose, meta) {
  const stored = localStorage.getItem('mt-open');
  const isOpen = stored !== null ? openSet().has(name) : true;
  const key = esc(name);
  return '<div class="song' + (isLoose ? ' nosong' : '') + (isOpen ? ' open' : '') +
    '" data-song="' + key + '"' + (meta ? ' data-id="' + meta.id + '"' : '') + '>' +
    '<div class="song-h">' +
      '<span class="nm">' +
        (meta ? '<span class="grip" data-grip="song" title="drag to reorder">&#9776;</span>' : '') +
        (pos ? '<span class="pos">' + pos + '</span>' : '') + key +
        (meta && meta.performable ? '<span class="rdy">&#9654;</span>' : '') + '</span>' +
      '<span class="ct">' + (!pos && !isLoose ? 'not in the set · ' : '') +
        live.length + (live.length === 1 ? ' thing' : ' things') +
        (done.length ? ' · ' + done.length + ' done' : '') +
        ' <span class="car">&rsaquo;</span></span>' +
    '</div>' +
    '<div class="song-body">' +
      (meta ? '<div class="song-meta">' +
          '<button class="' + (meta.performable ? 'on' : '') + '" data-act="playable" ' +
            'data-id="' + meta.id + '">' +
            (meta.performable ? '&#9654; can play it front to back' : 'can&rsquo;t play it yet') +
          '</button>' +
          '<button data-act="setlen" data-id="' + meta.id + '">' +
            (meta.length_minutes ? esc(String(meta.length_minutes)) + ' min' : 'set a length') +
          '</button>' +
        '</div>' : '') +
      (note ? '<div class="song-note">' + esc(note) + '</div>' : '') +
      (live.length ? '<div class="tlist">' + live.map(ticketHTML).join('') + '</div>'
                   : '<div class="empty">Nothing listed for this one yet.</div>') +
      '<button class="addline" data-act="ticketform" data-song="' + key + '">+ add a ticket</button>' +
      '<div class="addform hidden" data-form="' + key + '">' +
        '<div class="hint">A finish line you can answer yes or no to — and that quality ' +
          'can&rsquo;t fail. &ldquo;One version exists&rdquo;, not &ldquo;a good one&rdquo;.</div>' +
        '<input type="text" class="f-title" placeholder="what needs doing">' +
        '<input type="text" class="f-fin" placeholder="done when…">' +
        '<div class="row">' +
          '<button data-act="ticketsave" data-song="' + key + '">Add</button>' +
          '<button class="quiet" data-act="ticketcancel" data-song="' + key + '">Cancel</button>' +
        '</div>' +
      '</div>' +
      (done.length ? '<div class="donehead">DONE</div>' + done.map(ticketHTML).join('') : '') +
    '</div></div>';
}

function renderBoard() {
  // live tickets sit in the order HE dragged them into; new ones fall to the bottom
  const bySort = (a,b) => (a.sort_order ?? 9999) - (b.sort_order ?? 9999) ||
                          (a.created_at || '').localeCompare(b.created_at || '');
  const byDone = (a,b) => (b.done_at || '').localeCompare(a.done_at || '');
  const live = tickets.filter(t => t.status !== 'done');
  const fin  = tickets.filter(t => t.status === 'done');

  const ordered = songs.slice().sort((a,b) =>
    (a.set_position ?? 999) - (b.set_position ?? 999) || a.name.localeCompare(b.name));
  const known = new Set(ordered.map(s => s.name));
  const orphans = [...new Set(tickets.map(t => t.song).filter(n => n && !known.has(n)))].sort();

  const blocks = ordered.map(s => songBlock(s.name, s.set_position, s.notes,
    live.filter(t => t.song === s.name).sort(bySort),
    fin.filter(t => t.song === s.name).sort(byDone), false, s));

  orphans.forEach(n => blocks.push(songBlock(n, null, null,
    live.filter(t => t.song === n).sort(bySort),
    fin.filter(t => t.song === n).sort(byDone), false, null)));

  const looseLive = live.filter(t => !t.song), looseDone = fin.filter(t => !t.song);
  if (looseLive.length || looseDone.length)
    blocks.push(songBlock('NO SONG YET', null, 'Where new ones come from.',
      looseLive.sort(bySort), looseDone.sort(byDone), true, null));

  $('board').innerHTML = blocks.join('') || '<div class="empty">No songs yet.</div>';
}

/* ---------------- actions ---------------- */
async function logSession(what) {
  await sb.from('music_sessions').insert({ session_date: todayLocal(), what: what || 'music work' });
}

/* ---------------- drag to reorder ----------------
   Pointer events, not HTML5 drag-and-drop: HTML5 dnd does not fire on touch,
   and this page lives on his phone. The grip is the only drag target so that
   tapping a song header still collapses it. */
let dragState = null, suppressClick = false;

document.addEventListener('pointerdown', e => {
  const grip = e.target.closest('.grip');
  if (!grip) return;
  const isSong = grip.dataset.grip === 'song';
  const item = grip.closest(isSong ? '.song' : '.ticket');
  const container = isSong ? $('board') : (item && item.closest('.tlist'));
  if (!item || !container) return;
  e.preventDefault();
  try { grip.setPointerCapture(e.pointerId); } catch (err) {}
  dragState = { item, container, isSong, moved: false, anchorY: e.clientY };
  item.classList.add('dragging');
  document.body.classList.add(isSong ? 'drag-song' : 'drag-ticket');
  try { navigator.vibrate && navigator.vibrate(8); } catch (err) {}
}, { passive: false });

document.addEventListener('pointermove', e => {
  if (!dragState) return;
  e.preventDefault();
  const st = dragState;
  const { item, container, isSong } = st;
  const sel = isSong ? '.song' : '.ticket';

  // the item tracks the finger, so holding it is visible even before anything swaps
  item.style.transform = 'translateY(' + (e.clientY - st.anchorY) + 'px)';

  const sibs = [...container.children].filter(el => el !== item && el.matches(sel));
  let swapped = false, before = null;
  for (const other of sibs) {
    const r = other.getBoundingClientRect();
    if (e.clientY < r.top + r.height / 2) { before = other; break; }
  }
  if (before) {
    if (item.nextSibling !== before) { container.insertBefore(item, before); swapped = true; }
  } else {
    const last = sibs[sibs.length - 1];
    if (last && last.nextSibling !== item) { container.insertBefore(item, last.nextSibling); swapped = true; }
  }
  if (swapped) {
    // it just jumped to a new slot, so zero the offset out from here
    st.moved = true; st.anchorY = e.clientY;
    item.style.transform = '';
  }
}, { passive: false });

async function endDrag() {
  if (!dragState) return;
  const st = dragState; dragState = null;
  st.item.classList.remove('dragging');
  st.item.style.transform = '';
  document.body.classList.remove('drag-song', 'drag-ticket');
  if (!st.moved) return;
  suppressClick = true;
  setTimeout(() => { suppressClick = false; }, 500);

  const ids = [...st.container.children]
    .filter(el => el.dataset && el.dataset.id).map(el => el.dataset.id);
  const table = st.isSong ? 'music_songs' : 'music_tickets';
  const col   = st.isSong ? 'set_position' : 'sort_order';
  await Promise.all(ids.map((id, i) =>
    sb.from(table).update({ [col]: i + 1 }).eq('id', id)));
  await load();
}
document.addEventListener('pointerup', endDrag);
document.addEventListener('pointercancel', endDrag);

document.addEventListener('click', async e => {
  if (e.target.closest('.grip')) return;
  if (suppressClick) { suppressClick = false; return; }
  const b = e.target.closest('button[data-act]');

  // tapping a song header toggles it (but not when a button inside was hit)
  if (!b) {
    const h = e.target.closest('.song-h');
    if (!h) return;
    const block = h.parentElement, set = openSet();
    block.classList.toggle('open');
    if (block.classList.contains('open')) set.add(block.dataset.song);
    else set.delete(block.dataset.song);
    if (localStorage.getItem('mt-open') === null)
      document.querySelectorAll('.song.open').forEach(el => set.add(el.dataset.song));
    saveOpen(set);
    return;
  }

  const act = b.dataset.act, id = b.dataset.id, song = b.dataset.song;
  const formFor = n => [...document.querySelectorAll('.addform[data-form]')]
    .find(f => f.dataset.form === n);

  // --- inline forms ---
  if (act === 'ticketform' || act === 'ticketcancel') {
    const form = formFor(song);
    form.classList.toggle('hidden', act === 'ticketcancel');
    b.closest('.song-body').querySelector('.addline').classList
      .toggle('hidden', act === 'ticketform');
    if (act === 'ticketform') form.querySelector('.f-title').focus();
    return;
  }
  if (act === 'ticketsave') {
    const form = formFor(song);
    const title = form.querySelector('.f-title').value.trim();
    if (!title) return;
    b.disabled = true;
    await sb.from('music_tickets').insert({
      title, song, finish_line: form.querySelector('.f-fin').value.trim() || null, status: 'later'
    });
    await load();
    return;
  }
  if (act === 'songform' || act === 'songcancel') {
    $('songform').classList.toggle('hidden', act === 'songcancel');
    document.querySelector('[data-act="songform"]').classList.toggle('hidden', act === 'songform');
    return;
  }
  if (act === 'songsave') {
    const name = $('song-name').value.trim();
    if (!name) return;
    const posRaw = $('song-pos').value.trim();
    b.disabled = true;
    const { error } = await sb.from('music_songs')
      .insert({ name, set_position: posRaw ? parseInt(posRaw, 10) : null });
    b.disabled = false;
    if (error) { $('song-msg').textContent = error.message; $('song-msg').className = 'msg err'; return; }
    $('song-name').value = ''; $('song-pos').value = ''; $('song-msg').textContent = '';
    $('songform').classList.add('hidden');
    document.querySelector('[data-act="songform"]').classList.remove('hidden');
    await load();
    return;
  }

  // --- song meta: can-play toggle and length ---
  if (act === 'playable' || act === 'setlen') {
    const song = songs.find(x => x.id === id);
    if (!song) return;
    const before = readyMinutes();
    if (act === 'playable') {
      await sb.from('music_songs').update({ performable: !song.performable }).eq('id', id);
    } else {
      const v = prompt('About how many minutes is "' + song.name + '" when you play it?',
                       song.length_minutes ?? '');
      if (v === null) return;
      const n = parseFloat(v);
      await sb.from('music_songs')
        .update({ length_minutes: isNaN(n) || n <= 0 ? null : n }).eq('id', id);
    }
    await load();
    const after = readyMinutes();
    if (after > before) {
      const ms = milestoneCrossed(before, after);
      const gained = Math.round((after - before) * 10) / 10;
      if (ms) celebrate('Your set just passed ' + ms + ' minutes.', ms === 60 ? 'THE WHOLE HOUR.'
                        : ms + ' MINUTES', b);
      else celebrate('+' + gained + ' min &mdash; ' +
                     (Math.round((60 - after) * 10) / 10) + ' to go.', 'SET GREW', b);
    }
    renderMeter(before);
    return;
  }

  // --- ticket actions ---
  if (!id) return;
  b.disabled = true;
  const t = tickets.find(x => x.id === id);
  if (act === 'del') {
    if (!confirm('Delete this ticket for good? Checking it off instead keeps it as a record.')) {
      b.disabled = false; return;
    }
    await sb.from('music_tickets').delete().eq('id', id);
  } else if (act === 'done') {
    await sb.from('music_tickets')
      .update({ status:'done', done_at:new Date().toISOString() }).eq('id', id);
    await logSession(t ? t.title : 'finished a ticket');
    const todayCount = sessions.filter(r => r.session_date === todayLocal()).length + 1;
    celebrate(todayCount === 1 ? 'First one today.'
              : todayCount + ' done today.',
              CHEERS[Math.floor(Math.random() * CHEERS.length)], b);
  } else if (act === 'logit') {
    await logSession(t ? t.title : 'music work');
    celebrate('Logged. That counts.', 'NICE', b);
  } else if (act === 'undone') {
    await sb.from('music_tickets').update({ status:'later', done_at:null }).eq('id', id);
  } else {
    await sb.from('music_tickets').update({ status: act }).eq('id', id);
  }
  await load();
});

load();
</script>
<div id="toast"></div>
</body>
