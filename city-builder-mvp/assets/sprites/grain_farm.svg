<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Shed wall gradient -->
    <linearGradient id="shed-w" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a7a4a"/>
      <stop offset="1" stop-color="#6a5030"/>
    </linearGradient>
    <!-- Shed roof gradient -->
    <linearGradient id="shed-r" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a7040"/>
      <stop offset="1" stop-color="#6a5528"/>
    </linearGradient>
    <!-- Ground gradient -->
    <linearGradient id="gnd" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a7030"/>
      <stop offset=".6" stop-color="#6a5422"/>
      <stop offset="1" stop-color="#5a4418"/>
    </linearGradient>
    <!-- Wheat head gradient -->
    <linearGradient id="wh" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dab840"/>
      <stop offset="1" stop-color="#c49a28"/>
    </linearGradient>
  </defs>

  <!-- Ground / dirt patch -->
  <ellipse cx="32" cy="56" rx="30" ry="10" fill="url(#gnd)" opacity=".7"/>
  <ellipse cx="32" cy="57" rx="26" ry="7" fill="#5a4418" opacity=".3"/>

  <!-- Wheat field - dense rows of stalks -->
  <!-- Row 1 (back) -->
  <g stroke="#b8962e" stroke-width=".6" fill="none" opacity=".6">
    <line x1="6" y1="34" x2="6" y2="26"/>
    <line x1="9" y1="33" x2="9" y2="24"/>
    <line x1="12" y1="34" x2="12" y2="25"/>
    <line x1="15" y1="33" x2="15" y2="23"/>
    <line x1="18" y1="34" x2="18" y2="26"/>
    <line x1="21" y1="33" x2="21" y2="24"/>
    <line x1="24" y1="34" x2="24" y2="25"/>
    <line x1="27" y1="33" x2="27" y2="23"/>
    <line x1="30" y1="34" x2="30" y2="26"/>
    <line x1="33" y1="33" x2="33" y2="24"/>
  </g>
  <!-- Row 1 grain heads -->
  <g fill="#d4a830" opacity=".7">
    <ellipse cx="6" cy="25" rx="1.2" ry="2.5"/>
    <ellipse cx="9" cy="23" rx="1.2" ry="2.8"/>
    <ellipse cx="12" cy="24" rx="1.2" ry="2.5"/>
    <ellipse cx="15" cy="22" rx="1.2" ry="2.8"/>
    <ellipse cx="18" cy="25" rx="1.2" ry="2.5"/>
    <ellipse cx="21" cy="23" rx="1.2" ry="2.8"/>
    <ellipse cx="24" cy="24" rx="1.2" ry="2.5"/>
    <ellipse cx="27" cy="22" rx="1.2" ry="2.8"/>
    <ellipse cx="30" cy="25" rx="1.2" ry="2.5"/>
    <ellipse cx="33" cy="23" rx="1.2" ry="2.8"/>
  </g>

  <!-- Row 2 (mid) -->
  <g stroke="#c8a430" stroke-width=".7" fill="none" opacity=".8">
    <line x1="5" y1="42" x2="5" y2="30"/>
    <line x1="8" y1="41" x2="8" y2="28"/>
    <line x1="11" y1="42" x2="11" y2="29"/>
    <line x1="14" y1="41" x2="14" y2="27"/>
    <line x1="17" y1="42" x2="17" y2="30"/>
    <line x1="20" y1="41" x2="20" y2="28"/>
    <line x1="23" y1="42" x2="23" y2="29"/>
    <line x1="26" y1="41" x2="26" y2="27"/>
    <line x1="29" y1="42" x2="29" y2="30"/>
    <line x1="32" y1="41" x2="32" y2="28"/>
  </g>
  <!-- Row 2 grain heads -->
  <g fill="url(#wh)">
    <ellipse cx="5" cy="29" rx="1.4" ry="3"/>
    <ellipse cx="8" cy="27" rx="1.4" ry="3.2"/>
    <ellipse cx="11" cy="28" rx="1.4" ry="3"/>
    <ellipse cx="14" cy="26" rx="1.4" ry="3.2"/>
    <ellipse cx="17" cy="29" rx="1.4" ry="3"/>
    <ellipse cx="20" cy="27" rx="1.4" ry="3.2"/>
    <ellipse cx="23" cy="28" rx="1.4" ry="3"/>
    <ellipse cx="26" cy="26" rx="1.4" ry="3.2"/>
    <ellipse cx="29" cy="29" rx="1.4" ry="3"/>
    <ellipse cx="32" cy="27" rx="1.4" ry="3.2"/>
  </g>

  <!-- Row 3 (front, tallest) -->
  <g stroke="#c09828" stroke-width=".8" fill="none" opacity=".9">
    <line x1="4" y1="52" x2="4" y2="34"/>
    <line x1="7" y1="51" x2="7" y2="32"/>
    <line x1="10" y1="52" x2="10" y2="33"/>
    <line x1="13" y1="51" x2="13" y2="31"/>
    <line x1="16" y1="52" x2="16" y2="34"/>
    <line x1="19" y1="51" x2="19" y2="32"/>
    <line x1="22" y1="52" x2="22" y2="33"/>
    <line x1="25" y1="51" x2="25" y2="31"/>
    <line x1="28" y1="52" x2="28" y2="34"/>
    <line x1="31" y1="51" x2="31" y2="32"/>
  </g>
  <!-- Row 3 grain heads -->
  <g fill="#dab840">
    <ellipse cx="4" cy="33" rx="1.6" ry="3.4"/>
    <ellipse cx="7" cy="31" rx="1.6" ry="3.6"/>
    <ellipse cx="10" cy="32" rx="1.6" ry="3.4"/>
    <ellipse cx="13" cy="30" rx="1.6" ry="3.6"/>
    <ellipse cx="16" cy="33" rx="1.6" ry="3.4"/>
    <ellipse cx="19" cy="31" rx="1.6" ry="3.6"/>
    <ellipse cx="22" cy="32" rx="1.6" ry="3.4"/>
    <ellipse cx="25" cy="30" rx="1.6" ry="3.6"/>
    <ellipse cx="28" cy="33" rx="1.6" ry="3.4"/>
    <ellipse cx="31" cy="31" rx="1.6" ry="3.6"/>
  </g>

  <!-- Grain head whisker details (awns) -->
  <g stroke="#c4a030" stroke-width=".3" fill="none" opacity=".5">
    <path d="M7 29 L5 27 M7 30 L5 28 M7 31 L5 29"/>
    <path d="M13 28 L11 26 M13 29 L11 27 M13 30 L11 28"/>
    <path d="M19 29 L17 27 M19 30 L17 28 M19 31 L17 29"/>
    <path d="M25 28 L23 26 M25 29 L23 27 M25 30 L23 28"/>
  </g>

  <!-- Bundled sheaves (foreground left) -->
  <g transform="translate(6,46)">
    <!-- Sheaf 1 -->
    <path d="M0 8 L2 -2 L4 8Z" fill="#c4a030" opacity=".8"/>
    <path d="M1 8 L2 0 L3 8Z" fill="#dab840" opacity=".6"/>
    <ellipse cx="2" cy="-2" rx="2" ry="1.5" fill="#d4a828"/>
    <!-- Binding -->
    <rect x="0.5" y="4" width="3" height="1" rx=".3" fill="#8a6a20" opacity=".7"/>
  </g>
  <g transform="translate(12,48)">
    <!-- Sheaf 2 -->
    <path d="M0 6 L1.5 -2 L3 6Z" fill="#b89828" opacity=".8"/>
    <ellipse cx="1.5" cy="-2" rx="1.8" ry="1.3" fill="#c8a030"/>
    <rect x="0.3" y="3" width="2.4" height=".8" rx=".3" fill="#8a6a20" opacity=".7"/>
  </g>

  <!-- Shed (back-right corner, isometric-ish) -->
  <!-- Shed back wall -->
  <rect x="40" y="26" width="18" height="16" rx="1" fill="url(#shed-w)"/>
  <!-- Shed wood plank lines -->
  <g stroke="#5a4020" stroke-width=".4" opacity=".4">
    <line x1="40" y1="30" x2="58" y2="30"/>
    <line x1="40" y1="34" x2="58" y2="34"/>
    <line x1="40" y1="38" x2="58" y2="38"/>
  </g>
  <!-- Shed side wall (perspective) -->
  <polygon points="40,26 36,30 36,46 40,42" fill="#7a5a30" opacity=".6"/>
  <!-- Shed roof -->
  <polygon points="35,28 49,18 60,28 40,26" fill="url(#shed-r)"/>
  <!-- Roof thatch texture -->
  <g stroke="#7a6030" stroke-width=".5" opacity=".3">
    <line x1="38" y1="27" x2="49" y2="19"/>
    <line x1="42" y1="27" x2="51" y2="20"/>
    <line x1="46" y1="27" x2="53" y2="21"/>
    <line x1="50" y1="27" x2="55" y2="23"/>
    <line x1="54" y1="27" x2="57" y2="25"/>
  </g>
  <!-- Shed overhang shadow -->
  <rect x="40" y="26" width="18" height="2" fill="#5a4020" opacity=".25"/>
  <!-- Shed door -->
  <rect x="45" y="32" width="6" height="10" rx=".5" fill="#503820"/>
  <rect x="45.5" y="32.5" width="5" height="9" rx=".3" fill="#604828" opacity=".6"/>
  <!-- Door handle -->
  <circle cx="50" cy="37" r=".5" fill="#a08848"/>

  <!-- Scythe leaning on shed -->
  <g transform="translate(38,25)">
    <!-- Handle -->
    <line x1="1" y1="18" x2="3" y2="0" stroke="#7a5a30" stroke-width="1" stroke-linecap="round"/>
    <!-- Blade -->
    <path d="M3 0 Q7 -1 8 2 Q6 1 3 1Z" fill="#a0a0a0" opacity=".7"/>
    <path d="M3 0 Q7 -1 8 2" stroke="#808080" stroke-width=".4" fill="none"/>
  </g>

  <!-- Ground debris / scattered grain -->
  <g fill="#c4a030" opacity=".4">
    <circle cx="35" cy="50" r=".8"/>
    <circle cx="38" cy="52" r=".6"/>
    <circle cx="33" cy="53" r=".5"/>
    <circle cx="42" cy="54" r=".7"/>
  </g>

  <!-- Small rocks near shed -->
  <g fill="#8a8070" opacity=".4">
    <ellipse cx="55" cy="48" rx="1.5" ry="1"/>
    <ellipse cx="58" cy="50" rx="1" ry=".7"/>
    <ellipse cx="53" cy="50" rx="1.2" ry=".8"/>
  </g>
</svg>
