<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Rich tilled soil -->
    <linearGradient id="soil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a7a30"/>
      <stop offset=".5" stop-color="#4a6828"/>
      <stop offset="1" stop-color="#3a5420"/>
    </linearGradient>
    <!-- Wheat head gold -->
    <linearGradient id="wh" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0c830"/>
      <stop offset="1" stop-color="#d4a020"/>
    </linearGradient>
  </defs>

  <!-- Ground: green field base filling most of tile -->
  <rect x="4" y="20" width="56" height="38" rx="3" fill="url(#soil)" opacity=".85"/>
  <!-- Darker furrow lines across field -->
  <g stroke="#2e4818" stroke-width=".8" opacity=".4">
    <line x1="6" y1="28" x2="58" y2="28"/>
    <line x1="6" y1="34" x2="58" y2="34"/>
    <line x1="6" y1="40" x2="58" y2="40"/>
    <line x1="6" y1="46" x2="58" y2="46"/>
    <line x1="6" y1="52" x2="58" y2="52"/>
  </g>

  <!-- Fence posts around field -->
  <g fill="#8a6830">
    <rect x="3" y="18" width="2" height="8" rx=".4"/>
    <rect x="15" y="18" width="2" height="8" rx=".4"/>
    <rect x="27" y="18" width="2" height="8" rx=".4"/>
    <rect x="39" y="18" width="2" height="8" rx=".4"/>
    <rect x="51" y="18" width="2" height="8" rx=".4"/>
    <rect x="59" y="18" width="2" height="8" rx=".4"/>
  </g>
  <!-- Fence rails -->
  <g stroke="#9a7838" stroke-width="1" stroke-linecap="round">
    <line x1="4" y1="20" x2="60" y2="20"/>
    <line x1="4" y1="24" x2="60" y2="24"/>
  </g>

  <!-- Wheat row 1 (back, short) -->
  <g stroke="#b89828" stroke-width=".7" fill="none" opacity=".65">
    <line x1="8" y1="32" x2="8" y2="26"/>
    <line x1="12" y1="32" x2="12" y2="25"/>
    <line x1="16" y1="32" x2="16" y2="26"/>
    <line x1="20" y1="32" x2="20" y2="25"/>
    <line x1="24" y1="32" x2="24" y2="26"/>
    <line x1="28" y1="32" x2="28" y2="25"/>
    <line x1="32" y1="32" x2="32" y2="26"/>
    <line x1="36" y1="32" x2="36" y2="25"/>
    <line x1="40" y1="32" x2="40" y2="26"/>
    <line x1="44" y1="32" x2="44" y2="25"/>
    <line x1="48" y1="32" x2="48" y2="26"/>
    <line x1="52" y1="32" x2="52" y2="25"/>
    <line x1="56" y1="32" x2="56" y2="26"/>
  </g>
  <g fill="url(#wh)" opacity=".7">
    <ellipse cx="8" cy="25" rx="1.3" ry="2.4"/>
    <ellipse cx="12" cy="24" rx="1.3" ry="2.6"/>
    <ellipse cx="16" cy="25" rx="1.3" ry="2.4"/>
    <ellipse cx="20" cy="24" rx="1.3" ry="2.6"/>
    <ellipse cx="24" cy="25" rx="1.3" ry="2.4"/>
    <ellipse cx="28" cy="24" rx="1.3" ry="2.6"/>
    <ellipse cx="32" cy="25" rx="1.3" ry="2.4"/>
    <ellipse cx="36" cy="24" rx="1.3" ry="2.6"/>
    <ellipse cx="40" cy="25" rx="1.3" ry="2.4"/>
    <ellipse cx="44" cy="24" rx="1.3" ry="2.6"/>
    <ellipse cx="48" cy="25" rx="1.3" ry="2.4"/>
    <ellipse cx="52" cy="24" rx="1.3" ry="2.6"/>
    <ellipse cx="56" cy="25" rx="1.3" ry="2.4"/>
  </g>

  <!-- Wheat row 2 (mid, taller) -->
  <g stroke="#c8a430" stroke-width=".8" fill="none" opacity=".8">
    <line x1="7" y1="40" x2="7" y2="30"/>
    <line x1="11" y1="40" x2="11" y2="29"/>
    <line x1="15" y1="40" x2="15" y2="30"/>
    <line x1="19" y1="40" x2="19" y2="29"/>
    <line x1="23" y1="40" x2="23" y2="30"/>
    <line x1="27" y1="40" x2="27" y2="29"/>
    <line x1="31" y1="40" x2="31" y2="30"/>
    <line x1="35" y1="40" x2="35" y2="29"/>
    <line x1="39" y1="40" x2="39" y2="30"/>
    <line x1="43" y1="40" x2="43" y2="29"/>
    <line x1="47" y1="40" x2="47" y2="30"/>
    <line x1="51" y1="40" x2="51" y2="29"/>
    <line x1="55" y1="40" x2="55" y2="30"/>
  </g>
  <g fill="#e8b830" opacity=".85">
    <ellipse cx="7" cy="29" rx="1.5" ry="2.8"/>
    <ellipse cx="11" cy="28" rx="1.5" ry="3"/>
    <ellipse cx="15" cy="29" rx="1.5" ry="2.8"/>
    <ellipse cx="19" cy="28" rx="1.5" ry="3"/>
    <ellipse cx="23" cy="29" rx="1.5" ry="2.8"/>
    <ellipse cx="27" cy="28" rx="1.5" ry="3"/>
    <ellipse cx="31" cy="29" rx="1.5" ry="2.8"/>
    <ellipse cx="35" cy="28" rx="1.5" ry="3"/>
    <ellipse cx="39" cy="29" rx="1.5" ry="2.8"/>
    <ellipse cx="43" cy="28" rx="1.5" ry="3"/>
    <ellipse cx="47" cy="29" rx="1.5" ry="2.8"/>
    <ellipse cx="51" cy="28" rx="1.5" ry="3"/>
    <ellipse cx="55" cy="29" rx="1.5" ry="2.8"/>
  </g>

  <!-- Wheat row 3 (front, tallest, brightest) -->
  <g stroke="#c09828" stroke-width=".9" fill="none" opacity=".9">
    <line x1="6" y1="50" x2="6" y2="36"/>
    <line x1="10" y1="50" x2="10" y2="35"/>
    <line x1="14" y1="50" x2="14" y2="36"/>
    <line x1="18" y1="50" x2="18" y2="35"/>
    <line x1="22" y1="50" x2="22" y2="36"/>
    <line x1="26" y1="50" x2="26" y2="35"/>
    <line x1="30" y1="50" x2="30" y2="36"/>
    <line x1="34" y1="50" x2="34" y2="35"/>
    <line x1="38" y1="50" x2="38" y2="36"/>
    <line x1="42" y1="50" x2="42" y2="35"/>
    <line x1="46" y1="50" x2="46" y2="36"/>
    <line x1="50" y1="50" x2="50" y2="35"/>
    <line x1="54" y1="50" x2="54" y2="36"/>
  </g>
  <g fill="#f0c830">
    <ellipse cx="6" cy="35" rx="1.6" ry="3.2"/>
    <ellipse cx="10" cy="34" rx="1.6" ry="3.4"/>
    <ellipse cx="14" cy="35" rx="1.6" ry="3.2"/>
    <ellipse cx="18" cy="34" rx="1.6" ry="3.4"/>
    <ellipse cx="22" cy="35" rx="1.6" ry="3.2"/>
    <ellipse cx="26" cy="34" rx="1.6" ry="3.4"/>
    <ellipse cx="30" cy="35" rx="1.6" ry="3.2"/>
    <ellipse cx="34" cy="34" rx="1.6" ry="3.4"/>
    <ellipse cx="38" cy="35" rx="1.6" ry="3.2"/>
    <ellipse cx="42" cy="34" rx="1.6" ry="3.4"/>
    <ellipse cx="46" cy="35" rx="1.6" ry="3.2"/>
    <ellipse cx="50" cy="34" rx="1.6" ry="3.4"/>
    <ellipse cx="54" cy="35" rx="1.6" ry="3.2"/>
  </g>

  <!-- Awn whiskers on front row -->
  <g stroke="#d4a830" stroke-width=".3" fill="none" opacity=".5">
    <path d="M10 33 L8 31 M10 34 L8 32"/>
    <path d="M18 33 L16 31 M18 34 L16 32"/>
    <path d="M26 33 L24 31 M26 34 L24 32"/>
    <path d="M34 33 L32 31 M34 34 L32 32"/>
    <path d="M42 33 L40 31 M42 34 L40 32"/>
    <path d="M50 33 L48 31 M50 34 L48 32"/>
  </g>

  <!-- Dirt path at bottom edge -->
  <rect x="4" y="54" width="56" height="4" rx="1" fill="#8a7030" opacity=".5"/>
</svg>
