<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="sw" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a09480"/>
      <stop offset=".5" stop-color="#887860"/>
      <stop offset="1" stop-color="#685840"/>
    </linearGradient>
    <linearGradient id="rf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a6838"/>
      <stop offset="1" stop-color="#6a4c28"/>
    </linearGradient>
    <linearGradient id="rs" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a5830"/>
      <stop offset="1" stop-color="#5a3c20"/>
    </linearGradient>
    <linearGradient id="gd" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a6838"/>
      <stop offset="1" stop-color="#5a4a28"/>
    </linearGradient>
  </defs>

  <!-- Ground shadow/dirt -->
  <ellipse cx="30" cy="58" rx="28" ry="8" fill="url(#gd)" opacity=".5"/>

  <!-- Main stone building body -->
  <rect x="14" y="30" width="26" height="24" rx="1" fill="url(#sw)"/>
  <!-- Stone block texture -->
  <g stroke="#6a5a40" stroke-width=".4" fill="none" opacity=".35">
    <line x1="14" y1="34" x2="40" y2="34"/>
    <line x1="14" y1="38" x2="40" y2="38"/>
    <line x1="14" y1="42" x2="40" y2="42"/>
    <line x1="14" y1="46" x2="40" y2="46"/>
    <line x1="14" y1="50" x2="40" y2="50"/>
    <line x1="20" y1="30" x2="20" y2="34"/>
    <line x1="27" y1="30" x2="27" y2="34"/>
    <line x1="34" y1="30" x2="34" y2="34"/>
    <line x1="17" y1="34" x2="17" y2="38"/>
    <line x1="24" y1="34" x2="24" y2="38"/>
    <line x1="31" y1="34" x2="31" y2="38"/>
    <line x1="38" y1="34" x2="38" y2="38"/>
    <line x1="20" y1="38" x2="20" y2="42"/>
    <line x1="27" y1="38" x2="27" y2="42"/>
    <line x1="34" y1="38" x2="34" y2="42"/>
    <line x1="17" y1="42" x2="17" y2="46"/>
    <line x1="24" y1="42" x2="24" y2="46"/>
    <line x1="31" y1="42" x2="31" y2="46"/>
    <line x1="38" y1="42" x2="38" y2="46"/>
    <line x1="20" y1="46" x2="20" y2="50"/>
    <line x1="27" y1="46" x2="27" y2="50"/>
    <line x1="34" y1="46" x2="34" y2="50"/>
  </g>
  <rect x="14" y="30" width="26" height="1.5" fill="#b0a080" opacity=".3"/>

  <!-- Side wall -->
  <polygon points="14,30 8,34 8,58 14,54" fill="#786840" opacity=".5"/>
  <g stroke="#5a4a30" stroke-width=".3" fill="none" opacity=".25">
    <line x1="8" y1="38" x2="14" y2="34"/>
    <line x1="8" y1="42" x2="14" y2="38"/>
    <line x1="8" y1="46" x2="14" y2="42"/>
    <line x1="8" y1="50" x2="14" y2="46"/>
    <line x1="8" y1="54" x2="14" y2="50"/>
  </g>

  <!-- Roof -->
  <polygon points="12,30 27,18 42,30" fill="url(#rf)"/>
  <polygon points="12,30 8,34 22,22 27,18" fill="url(#rs)"/>
  <line x1="27" y1="18" x2="22" y2="22" stroke="#9a7a40" stroke-width=".6" opacity=".4"/>
  <g stroke="#5a4020" stroke-width=".4" opacity=".25">
    <line x1="15" y1="29" x2="27" y2="19"/>
    <line x1="20" y1="29" x2="30" y2="21"/>
    <line x1="25" y1="29" x2="33" y2="23"/>
    <line x1="30" y1="29" x2="36" y2="25"/>
    <line x1="35" y1="29" x2="39" y2="27"/>
  </g>

  <!-- Sail hub only (no sail arms — those spin via CSS overlay) -->
  <circle cx="27" cy="24" r="2.2" fill="#806848"/>
  <circle cx="27" cy="24" r="1.4" fill="#6a5838"/>

  <!-- Door -->
  <rect x="22" y="44" width="8" height="10" rx=".8" fill="#403020"/>
  <rect x="22.5" y="44.5" width="7" height="9" rx=".5" fill="#503828" opacity=".7"/>
  <path d="M22 44 Q26 40 30 44" fill="#503828" stroke="#403020" stroke-width=".5"/>
  <circle cx="29" cy="49" r=".6" fill="#b09850"/>

  <!-- Window -->
  <rect x="33" y="36" width="4" height="4" rx=".5" fill="#302818"/>
  <rect x="33.3" y="36.3" width="3.4" height="3.4" rx=".3" fill="#c8d8f0" opacity=".3"/>
  <line x1="35" y1="36" x2="35" y2="40" stroke="#504030" stroke-width=".4"/>
  <line x1="33" y1="38" x2="37" y2="38" stroke="#504030" stroke-width=".4"/>

  <!-- Grain sacks (input) -->
  <g transform="translate(4,46)">
    <path d="M0 10 Q0 4 3 3 Q6 4 6 10Z" fill="#c4a868"/>
    <path d="M1 6 Q3 5 5 6" stroke="#a08848" stroke-width=".5" fill="none"/>
    <ellipse cx="3" cy="3" rx="2" ry="1" fill="#b49858"/>
    <circle cx="2" cy="2.5" r=".4" fill="#d4b848" opacity=".6"/>
    <circle cx="4" cy="2.8" r=".3" fill="#d4b848" opacity=".5"/>
  </g>
  <g transform="translate(7,48)">
    <path d="M0 8 Q0 3 2.5 2 Q5 3 5 8Z" fill="#b89848"/>
    <ellipse cx="2.5" cy="2" rx="1.5" ry=".8" fill="#a88838"/>
  </g>

  <!-- Flour sacks (output) -->
  <g transform="translate(42,48)">
    <path d="M0 8 Q0 3 2.5 2 Q5 3 5 8Z" fill="#e8dcc0"/>
    <ellipse cx="2.5" cy="2" rx="1.5" ry=".8" fill="#d8ccb0"/>
    <circle cx="1" cy="6" r=".5" fill="#f0e8d0" opacity=".4"/>
  </g>
  <g transform="translate(45,50)">
    <path d="M0 6 Q0 2 2 1.5 Q4 2 4 6Z" fill="#dcd0b8"/>
    <ellipse cx="2" cy="1.5" rx="1.2" ry=".6" fill="#ccc0a8"/>
  </g>

  <!-- Flour dust -->
  <g fill="#e8dcc0" opacity=".25">
    <circle cx="20" cy="54" r="1.5"/>
    <circle cx="32" cy="55" r="1.2"/>
    <circle cx="25" cy="56" r="1.8"/>
  </g>

  <!-- Rocks -->
  <g fill="#8a8070" opacity=".35">
    <ellipse cx="10" cy="56" rx="1.2" ry=".7"/>
    <ellipse cx="44" cy="57" rx="1" ry=".6"/>
    <ellipse cx="48" cy="55" rx=".8" ry=".5"/>
  </g>
</svg>
