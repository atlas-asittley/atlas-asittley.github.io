<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="sw" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b0a8a0"/>
      <stop offset=".5" stop-color="#908880"/>
      <stop offset="1" stop-color="#706860"/>
    </linearGradient>
    <linearGradient id="ts" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#686060"/>
      <stop offset="1" stop-color="#908880"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#505058"/>
      <stop offset="1" stop-color="#383840"/>
    </linearGradient>
    <linearGradient id="gd" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a7268"/>
      <stop offset="1" stop-color="#5a5248"/>
    </linearGradient>
  </defs>

  <!-- Ground shadow -->
  <ellipse cx="32" cy="60" rx="22" ry="6" fill="url(#gd)" opacity=".4"/>

  <!-- Tower body -->
  <ellipse cx="32" cy="38" rx="14" ry="22" fill="#686060" opacity=".2"/>
  <path d="M20,58 L22,22 Q32,20 42,22 L44,58 Q32,60 20,58Z" fill="url(#sw)"/>
  <path d="M20,58 L22,22 Q18,24 20,58Z" fill="url(#ts)" opacity=".5"/>
  <!-- Stone texture -->
  <g stroke="#605850" stroke-width=".4" fill="none" opacity=".3">
    <path d="M21,28 Q32,26 43,28"/>
    <path d="M21,34 Q32,32 43,34"/>
    <path d="M20,40 Q32,38 44,40"/>
    <path d="M20,46 Q32,44 44,46"/>
    <path d="M20,52 Q32,50 44,52"/>
    <line x1="27" y1="22" x2="26" y2="28"/>
    <line x1="37" y1="22" x2="38" y2="28"/>
    <line x1="24" y1="28" x2="23" y2="34"/>
    <line x1="32" y1="27" x2="32" y2="34"/>
    <line x1="40" y1="28" x2="41" y2="34"/>
    <line x1="27" y1="34" x2="26" y2="40"/>
    <line x1="37" y1="34" x2="38" y2="40"/>
    <line x1="24" y1="40" x2="23" y2="46"/>
    <line x1="32" y1="39" x2="32" y2="46"/>
    <line x1="40" y1="40" x2="41" y2="46"/>
  </g>
  <path d="M38,22 Q44,22 44,58 Q42,58 38,22Z" fill="#c0b8b0" opacity=".15"/>

  <!-- Conical cap -->
  <polygon points="32,6 18,22 46,22" fill="url(#cap)"/>
  <line x1="32" y1="6" x2="46" y2="22" stroke="#60606a" stroke-width=".6" opacity=".4"/>

  <!-- Hub only (sails spin via CSS) -->
  <circle cx="32" cy="18" r="2.8" fill="#706868"/>
  <circle cx="32" cy="18" r="1.8" fill="#585050"/>

  <!-- Door -->
  <path d="M28,58 L28,48 Q32,44 36,48 L36,58Z" fill="#302828"/>
  <path d="M28.5,57 L28.5,48.5 Q32,45 35.5,48.5 L35.5,57Z" fill="#403838" opacity=".7"/>
  <circle cx="35" cy="53" r=".6" fill="#b0a080"/>

  <!-- Window -->
  <rect x="34" y="36" width="4" height="4" rx=".5" fill="#282428"/>
  <rect x="34.3" y="36.3" width="3.4" height="3.4" rx=".3" fill="#a0b8d0" opacity=".35"/>
  <line x1="36" y1="36" x2="36" y2="40" stroke="#404040" stroke-width=".4"/>
  <line x1="34" y1="38" x2="38" y2="38" stroke="#404040" stroke-width=".4"/>

  <!-- Grain sacks (input) -->
  <g transform="translate(6,50)">
    <path d="M0 8 Q0 3 2.5 2 Q5 3 5 8Z" fill="#c4a868"/>
    <ellipse cx="2.5" cy="2" rx="1.5" ry=".8" fill="#b49858"/>
  </g>

  <!-- Flour sacks (output) -->
  <g transform="translate(46,52)">
    <path d="M0 6 Q0 2 2 1.5 Q4 2 4 6Z" fill="#e8e0d0"/>
    <ellipse cx="2" cy="1.5" rx="1.2" ry=".6" fill="#d8d0c0"/>
  </g>

  <!-- Cobblestones -->
  <g fill="#808078" opacity=".3">
    <ellipse cx="18" cy="58" rx="2" ry="1"/>
    <ellipse cx="46" cy="58" rx="1.8" ry=".9"/>
    <ellipse cx="24" cy="60" rx="1.5" ry=".8"/>
    <ellipse cx="40" cy="60" rx="1.5" ry=".8"/>
  </g>
</svg>
