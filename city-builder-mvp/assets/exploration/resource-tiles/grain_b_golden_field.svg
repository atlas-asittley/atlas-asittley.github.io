<svg xmlns="http://www.w3.org/2000/svg" width="34" height="34" viewBox="0 0 34 34">
  <!-- Grain B: Golden field - wavy golden grain with wind movement feel -->
  <rect width="34" height="34" fill="#2e2a1a"/>
  <filter id="gn"><feTurbulence type="fractalNoise" baseFrequency="0.55" numOctaves="2" seed="28"/></filter>
  <rect width="34" height="34" filter="url(#gn)" opacity="0.18"/>
  <!-- Golden base wash -->
  <rect width="34" height="34" fill="#806020" opacity="0.12"/>
  <!-- Wavy grain lines suggesting wind -->
  <g stroke="#907830" stroke-width="0.7" fill="none" opacity="0.4">
    <path d="M0,8 Q8,6 17,8 Q26,10 34,8"/>
    <path d="M0,15 Q8,13 17,15 Q26,17 34,15"/>
    <path d="M0,22 Q8,20 17,22 Q26,24 34,22"/>
    <path d="M0,29 Q8,27 17,29 Q26,31 34,29"/>
  </g>
  <!-- Grain head clusters -->
  <g fill="#c4a035" opacity="0.4">
    <ellipse cx="5" cy="6" rx="1.5" ry="1"/>
    <ellipse cx="14" cy="7" rx="1.5" ry="1"/>
    <ellipse cx="24" cy="9" rx="1.5" ry="1"/>
    <ellipse cx="8" cy="14" rx="1.5" ry="1"/>
    <ellipse cx="20" cy="14" rx="1.5" ry="1"/>
    <ellipse cx="30" cy="15" rx="1.5" ry="1"/>
    <ellipse cx="4" cy="21" rx="1.5" ry="1"/>
    <ellipse cx="17" cy="21" rx="1.5" ry="1"/>
    <ellipse cx="28" cy="23" rx="1.5" ry="1"/>
  </g>
</svg>
