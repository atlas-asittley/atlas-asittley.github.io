<svg xmlns="http://www.w3.org/2000/svg" width="34" height="34" viewBox="0 0 34 34">
  <!-- Grain D: Harvest ready - dense tall grain, golden amber tones -->
  <rect width="34" height="34" fill="#302a18"/>
  <filter id="gn"><feTurbulence type="fractalNoise" baseFrequency="0.5" numOctaves="2" seed="40"/></filter>
  <rect width="34" height="34" filter="url(#gn)" opacity="0.15"/>
  <!-- Dense golden wash -->
  <rect width="34" height="34" fill="#907020" opacity="0.15"/>
  <!-- Dense vertical stalks -->
  <g stroke="#807020" stroke-width="0.5" opacity="0.5">
    <line x1="2" y1="34" x2="3" y2="6"/>
    <line x1="5" y1="34" x2="5" y2="4"/>
    <line x1="8" y1="34" x2="7" y2="5"/>
    <line x1="11" y1="34" x2="12" y2="6"/>
    <line x1="14" y1="34" x2="14" y2="3"/>
    <line x1="17" y1="34" x2="16" y2="5"/>
    <line x1="20" y1="34" x2="21" y2="4"/>
    <line x1="23" y1="34" x2="23" y2="6"/>
    <line x1="26" y1="34" x2="25" y2="3"/>
    <line x1="29" y1="34" x2="30" y2="5"/>
    <line x1="32" y1="34" x2="32" y2="4"/>
  </g>
  <!-- Heavy drooping grain heads -->
  <g fill="#c4a035" opacity="0.5">
    <ellipse cx="3" cy="5" rx="2" ry="1.5"/>
    <ellipse cx="5" cy="3" rx="2" ry="1.3"/>
    <ellipse cx="7" cy="4" rx="2" ry="1.5"/>
    <ellipse cx="12" cy="5" rx="2" ry="1.3"/>
    <ellipse cx="14" cy="2" rx="2" ry="1.5"/>
    <ellipse cx="16" cy="4" rx="2" ry="1.3"/>
    <ellipse cx="21" cy="3" rx="2" ry="1.5"/>
    <ellipse cx="23" cy="5" rx="2" ry="1.3"/>
    <ellipse cx="25" cy="2" rx="2" ry="1.5"/>
    <ellipse cx="30" cy="4" rx="2" ry="1.3"/>
    <ellipse cx="32" cy="3" rx="2" ry="1.5"/>
  </g>
</svg>
