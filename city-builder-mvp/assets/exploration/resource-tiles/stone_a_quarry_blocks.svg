<svg xmlns="http://www.w3.org/2000/svg" width="34" height="34" viewBox="0 0 34 34">
  <!-- Stone A: Quarry blocks - visible cut stone faces and ledges -->
  <rect width="34" height="34" fill="#252530"/>
  <filter id="sn"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="13"/></filter>
  <rect width="34" height="34" filter="url(#sn)" opacity="0.25"/>
  <!-- Exposed rock faces / block ledges -->
  <rect x="2" y="18" width="12" height="6" rx="1" fill="#3a3a50" opacity="0.45"/>
  <rect x="4" y="20" width="10" height="4" rx="1" fill="#444460" opacity="0.35"/>
  <rect x="16" y="6" width="14" height="5" rx="1" fill="#3a3a50" opacity="0.4"/>
  <rect x="18" y="8" width="10" height="3" rx="1" fill="#444460" opacity="0.3"/>
  <rect x="20" y="22" width="10" height="8" rx="1" fill="#3a3a50" opacity="0.45"/>
  <rect x="22" y="24" width="8" height="5" rx="1" fill="#484868" opacity="0.3"/>
  <!-- Loose rubble -->
  <rect x="8" y="10" width="3" height="2" rx="0.5" fill="#444460" opacity="0.3"/>
  <rect x="14" y="28" width="4" height="2" rx="0.5" fill="#3a3a50" opacity="0.25"/>
  <!-- Crack lines -->
  <line x1="0" y1="16" x2="14" y2="18" stroke="#1a1a24" stroke-width="0.5" opacity="0.4"/>
  <line x1="16" y1="12" x2="34" y2="14" stroke="#1a1a24" stroke-width="0.5" opacity="0.35"/>
</svg>
