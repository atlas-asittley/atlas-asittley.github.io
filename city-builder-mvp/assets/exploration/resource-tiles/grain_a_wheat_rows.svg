<svg xmlns="http://www.w3.org/2000/svg" width="34" height="34" viewBox="0 0 34 34">
  <!-- Grain A: Wheat rows - parallel rows of grain stalks -->
  <rect width="34" height="34" fill="#2e2a1a"/>
  <filter id="gn"><feTurbulence type="fractalNoise" baseFrequency="0.6" numOctaves="2" seed="21"/></filter>
  <rect width="34" height="34" filter="url(#gn)" opacity="0.2"/>
  <!-- Furrow rows -->
  <g stroke="#3a3018" stroke-width="0.4" opacity="0.3">
    <line x1="0" y1="5" x2="34" y2="5"/>
    <line x1="0" y1="12" x2="34" y2="12"/>
    <line x1="0" y1="19" x2="34" y2="19"/>
    <line x1="0" y1="26" x2="34" y2="26"/>
  </g>
  <!-- Wheat stalks -->
  <g stroke="#907830" stroke-width="0.6" opacity="0.45">
    <line x1="4" y1="12" x2="4" y2="4"/>
    <line x1="10" y1="12" x2="10" y2="3"/>
    <line x1="16" y1="12" x2="16" y2="4"/>
    <line x1="22" y1="12" x2="22" y2="3"/>
    <line x1="28" y1="12" x2="28" y2="4"/>
    <line x1="7" y1="26" x2="7" y2="18"/>
    <line x1="13" y1="26" x2="13" y2="17"/>
    <line x1="19" y1="26" x2="19" y2="18"/>
    <line x1="25" y1="26" x2="25" y2="17"/>
    <line x1="31" y1="26" x2="31" y2="18"/>
  </g>
  <!-- Wheat heads (small ovals at top of stalks) -->
  <g fill="#b09040" opacity="0.5">
    <ellipse cx="4" cy="3" rx="1.2" ry="2"/>
    <ellipse cx="10" cy="2" rx="1.2" ry="2"/>
    <ellipse cx="16" cy="3" rx="1.2" ry="2"/>
    <ellipse cx="22" cy="2" rx="1.2" ry="2"/>
    <ellipse cx="28" cy="3" rx="1.2" ry="2"/>
    <ellipse cx="7" cy="17" rx="1.2" ry="2"/>
    <ellipse cx="13" cy="16" rx="1.2" ry="2"/>
    <ellipse cx="19" cy="17" rx="1.2" ry="2"/>
    <ellipse cx="25" cy="16" rx="1.2" ry="2"/>
    <ellipse cx="31" cy="17" rx="1.2" ry="2"/>
  </g>
</svg>
