<svg xmlns="http://www.w3.org/2000/svg" width="34" height="34" viewBox="0 0 34 34">
  <!-- Clay D: Dig site - excavated clay pit with tool marks and piled clay -->
  <rect width="34" height="34" fill="#28201a"/>
  <filter id="cn"><feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="2" seed="50"/></filter>
  <rect width="34" height="34" filter="url(#cn)" opacity="0.2"/>
  <!-- Excavated pit (darker depression) -->
  <ellipse cx="17" cy="18" rx="11" ry="9" fill="#1e1410" opacity="0.35"/>
  <!-- Clay walls of pit -->
  <path d="M6,10 Q17,8 28,10" stroke="#704838" stroke-width="1.2" fill="none" opacity="0.4"/>
  <path d="M8,26 Q17,28 26,26" stroke="#5a3828" stroke-width="0.8" fill="none" opacity="0.3"/>
  <!-- Piled clay at edges -->
  <ellipse cx="6" cy="6" rx="5" ry="3" fill="#604030" opacity="0.35"/>
  <ellipse cx="28" cy="6" rx="4" ry="2.5" fill="#583828" opacity="0.3"/>
  <ellipse cx="28" cy="30" rx="5" ry="3" fill="#604030" opacity="0.3"/>
  <!-- Tool marks in pit -->
  <g stroke="#3a2818" stroke-width="0.4" opacity="0.3">
    <line x1="12" y1="14" x2="14" y2="18"/>
    <line x1="16" y1="13" x2="17" y2="17"/>
    <line x1="20" y1="14" x2="21" y2="18"/>
    <line x1="14" y1="20" x2="16" y2="23"/>
    <line x1="19" y1="19" x2="20" y2="23"/>
  </g>
  <!-- Wet clay gleam -->
  <ellipse cx="17" cy="18" rx="4" ry="2" fill="#5a4030" opacity="0.2"/>
</svg>
