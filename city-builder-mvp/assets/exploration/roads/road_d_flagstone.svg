<svg xmlns="http://www.w3.org/2000/svg" width="34" height="34" viewBox="0 0 34 34">
  <!-- Road D: Flagstone - large flat stones laid in irregular pattern -->
  <rect width="34" height="34" fill="#383428"/>
  <filter id="rn"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="70"/></filter>
  <rect width="34" height="34" filter="url(#rn)" opacity="0.15"/>
  <!-- Flagstone slabs (irregular polygons with gaps) -->
  <g fill="#484438" stroke="#2a2820" stroke-width="0.5" opacity="0.6">
    <polygon points="1,1 14,0 15,8 10,10 0,9"/>
    <polygon points="16,0 34,1 33,9 18,8"/>
    <polygon points="1,11 9,10 12,18 2,19"/>
    <polygon points="11,10 16,9 20,12 18,19 13,18"/>
    <polygon points="18,9 32,10 33,17 20,18 19,12"/>
    <polygon points="0,21 10,19 12,28 1,30"/>
    <polygon points="12,19 19,20 20,27 13,29"/>
    <polygon points="20,19 33,18 34,28 22,27"/>
    <polygon points="0,32 12,30 14,34 0,34"/>
    <polygon points="14,30 21,28 24,34 15,34"/>
    <polygon points="23,28 34,29 34,34 25,34"/>
  </g>
  <!-- Stone surface variation -->
  <g fill="#524e40" opacity="0.15">
    <polygon points="2,2 12,1 13,7 8,9 1,8"/>
    <polygon points="20,20 32,19 33,26 21,26"/>
  </g>
</svg>
