<svg xmlns="http://www.w3.org/2000/svg" width="34" height="34" viewBox="0 0 34 34">
  <!-- Road B: Cobblestone - irregular fitted stones, ancient Mediterranean -->
  <rect width="34" height="34" fill="#3a3830"/>
  <filter id="rn"><feTurbulence type="fractalNoise" baseFrequency="1.0" numOctaves="2" seed="60"/></filter>
  <rect width="34" height="34" filter="url(#rn)" opacity="0.15"/>
  <!-- Cobblestone pattern (irregular rounded rects) -->
  <g fill="#4a4840" stroke="#2a2820" stroke-width="0.4" opacity="0.6">
    <rect x="1" y="1" width="6" height="5" rx="1.5"/>
    <rect x="8" y="0" width="7" height="5" rx="1.5"/>
    <rect x="16" y="1" width="6" height="4.5" rx="1.5"/>
    <rect x="23" y="0" width="7" height="5" rx="1.5"/>
    <rect x="3" y="7" width="7" height="5.5" rx="1.5"/>
    <rect x="11" y="6.5" width="6" height="5" rx="1.5"/>
    <rect x="18" y="7" width="7" height="5.5" rx="1.5"/>
    <rect x="26" y="6" width="7" height="5" rx="1.5"/>
    <rect x="0" y="13.5" width="6" height="5" rx="1.5"/>
    <rect x="7" y="13" width="7" height="5.5" rx="1.5"/>
    <rect x="15" y="14" width="6" height="5" rx="1.5"/>
    <rect x="22" y="13" width="7" height="5.5" rx="1.5"/>
    <rect x="30" y="14" width="4" height="5" rx="1"/>
    <rect x="2" y="20" width="7" height="5" rx="1.5"/>
    <rect x="10" y="19.5" width="6" height="5.5" rx="1.5"/>
    <rect x="17" y="20" width="7" height="5" rx="1.5"/>
    <rect x="25" y="19" width="6" height="5.5" rx="1.5"/>
    <rect x="0" y="26" width="6" height="5" rx="1.5"/>
    <rect x="7" y="26.5" width="7" height="5" rx="1.5"/>
    <rect x="15" y="26" width="6.5" height="5.5" rx="1.5"/>
    <rect x="22" y="27" width="7" height="5" rx="1.5"/>
    <rect x="30" y="26" width="4" height="5.5" rx="1"/>
  </g>
  <!-- Mortar highlights -->
  <g fill="#5a5848" opacity="0.2">
    <rect x="3" y="2" width="3" height="2" rx="1"/>
    <rect x="12" y="8" width="3" height="2" rx="1"/>
    <rect x="20" y="15" width="3" height="2" rx="1"/>
    <rect x="8" y="21" width="3" height="2" rx="1"/>
