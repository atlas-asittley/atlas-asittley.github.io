<svg xmlns="http://www.w3.org/2000/svg" width="34" height="34" viewBox="0 0 34 34">
  <!-- Road C: Packed gravel - compacted gravel/crushed stone path -->
  <rect width="34" height="34" fill="#3e3a32"/>
  <filter id="rn"><feTurbulence type="fractalNoise" baseFrequency="1.8" numOctaves="3" seed="65"/></filter>
  <rect width="34" height="34" filter="url(#rn)" opacity="0.2"/>
  <!-- Gravel texture (many small circles) -->
  <g fill="#4a4638" opacity="0.5">
    <circle cx="3" cy="3" r="1.2"/>
    <circle cx="8" cy="5" r="1"/>
    <circle cx="14" cy="2" r="1.3"/>
    <circle cx="20" cy="4" r="1.1"/>
    <circle cx="27" cy="3" r="1.2"/>
    <circle cx="5" cy="10" r="1.1"/>
    <circle cx="12" cy="9" r="1.3"/>
    <circle cx="18" cy="11" r="1"/>
    <circle cx="24" cy="10" r="1.2"/>
    <circle cx="31" cy="9" r="1"/>
    <circle cx="2" cy="16" r="1.2"/>
    <circle cx="9" cy="15" r="1.1"/>
    <circle cx="16" cy="17" r="1.3"/>
    <circle cx="22" cy="16" r="1"/>
    <circle cx="29" cy="17" r="1.2"/>
    <circle cx="6" cy="22" r="1"/>
    <circle cx="13" cy="23" r="1.2"/>
    <circle cx="19" cy="21" r="1.1"/>
    <circle cx="26" cy="23" r="1.3"/>
    <circle cx="33" cy="22" r="0.9"/>
    <circle cx="3" cy="28" r="1.1"/>
    <circle cx="10" cy="29" r="1.2"/>
    <circle cx="17" cy="28" r="1"/>
    <circle cx="23" cy="30" r="1.2"/>
    <circle cx="30" cy="28" r="1.1"/>
  </g>
  <!-- Larger stones -->
  <g fill="#5a5648" opacity="0.35">
    <ellipse cx="7" cy="13" rx="2" ry="1.5"/>
    <ellipse cx="25" cy="19" rx="1.8" ry="1.3"/>
    <ellipse cx="15" cy="26" rx="2" ry="1.4"/>
  </g>
  <!-- Wheel rut suggestion (darker lines) -->
  <line x1="11" y1="0" x2="11" y2="34" stroke="#2e2a22" stroke-width="0.8" opacity="0.2"/>
  <line x1="23" y1="0" x2="23" y2="34" stroke="#2e2a22" stroke-width="0.8" opacity="0.2"/>
</svg>
