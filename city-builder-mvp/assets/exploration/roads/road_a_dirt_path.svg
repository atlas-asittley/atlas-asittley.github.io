<svg xmlns="http://www.w3.org/2000/svg" width="34" height="34" viewBox="0 0 34 34">
  <!-- Road A: Dirt path - worn earth path with grass edges -->
  <rect width="34" height="34" fill="#223322"/>
  <!-- Worn dirt surface -->
  <rect x="8" y="0" width="18" height="34" fill="#4a4030" opacity="0.7"/>
  <!-- Soft grass-to-dirt transition -->
  <rect x="6" y="0" width="3" height="34" fill="#3a3828" opacity="0.4"/>
  <rect x="25" y="0" width="3" height="34" fill="#3a3828" opacity="0.4"/>
  <!-- Foot-worn center (lighter) -->
  <rect x="12" y="0" width="10" height="34" fill="#5a5040" opacity="0.3"/>
  <!-- Dirt texture -->
  <filter id="dn"><feTurbulence type="fractalNoise" baseFrequency="1.2" numOctaves="2" seed="55"/></filter>
  <rect width="34" height="34" filter="url(#dn)" opacity="0.15"/>
  <!-- Small stones/pebbles -->
  <circle cx="14" cy="8" r="0.8" fill="#6a6050" opacity="0.4"/>
  <circle cx="20" cy="16" r="0.6" fill="#6a6050" opacity="0.35"/>
  <circle cx="16" cy="24" r="0.7" fill="#6a6050" opacity="0.4"/>
  <circle cx="22" cy="30" r="0.5" fill="#6a6050" opacity="0.3"/>
  <!-- Grass tufts at edges -->
  <g stroke="#2a4a28" stroke-width="0.5" opacity="0.4">
    <line x1="5" y1="6" x2="4" y2="2"/>
    <line x1="6" y1="6" x2="7" y2="3"/>
    <line x1="28" y1="14" x2="29" y2="10"/>
    <line x1="27" y1="14" x2="26" y2="11"/>
    <line x1="5" y1="22" x2="4" y2="18"/>
    <line x1="29" y1="28" x2="30" y2="24"/>
  </g>
</svg>
