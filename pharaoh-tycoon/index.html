<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pharaoh Tycoon</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Top HUD Bar (hidden on menu screen) -->
  <div id="hud-bar" class="hidden">
    <div class="hud-group">
      <span class="hud-icon">&#9775;</span>
      <span class="hud-label">Gold</span>
      <span class="hud-value" id="hud-gold">1000</span>
      <span class="hud-sub">(<span class="hud-value green" id="hud-income">+0</span> / <span class="hud-value red" id="hud-expenses">-0</span>)</span>
    </div>

    <div class="hud-divider"></div>

    <div class="hud-group">
      <span class="hud-icon">&#9823;</span>
      <span class="hud-label">Pop</span>
      <span class="hud-value" id="hud-population">0</span>
      <span class="hud-sub">/ <span id="hud-pop-capacity">0</span></span>
      <span class="hud-sub">(working: <span class="hud-value blue" id="hud-employed">0</span>)</span>
    </div>

    <div class="hud-divider"></div>

    <div class="hud-group">
      <span class="hud-icon">&#127806;</span>
      <span class="hud-label">Food</span>
      <span class="hud-value green" id="hud-food">0</span>
      <span class="hud-sub">/ <span id="hud-food-capacity">0</span></span>
    </div>

    <div class="hud-divider"></div>

    <div class="hud-group">
      <span class="hud-time">Year <span id="hud-year">1</span>, Month <span id="hud-month">1</span></span>
    </div>

    <div class="speed-controls">
      <button class="speed-btn" id="speed-pause">&#10074;&#10074;</button>
      <button class="speed-btn active" id="speed-1">&gt;</button>
      <button class="speed-btn" id="speed-2">&gt;&gt;</button>
      <button class="speed-btn" id="speed-3">&gt;&gt;&gt;</button>
    </div>

    <div class="hud-divider"></div>

    <div class="save-controls">
      <button class="save-btn" id="btn-save" title="Save game (Ctrl+S)">Save</button>
      <button class="save-btn" id="btn-load" title="Load saved game">Load</button>
      <button class="save-btn save-btn-menu" id="btn-menu" title="Return to main menu">Menu</button>
    </div>
  </div>

  <!-- Game Canvas -->
  <canvas id="game-canvas"></canvas>

  <!-- Game overlay UI (hidden on menu screen) -->
  <div id="game-ui-overlay" class="hidden">
    <!-- Build Menu (populated by JS) -->
    <div id="build-menu"></div>

    <!-- Info Panel -->
    <div id="info-panel" class="hidden"></div>

    <!-- Objectives Panel -->
    <div id="objectives-panel" class="hidden"></div>

    <!-- Overlay indicator -->
    <div id="overlay-indicator" class="hidden"></div>

    <!-- Help Bar -->
    <div id="help-bar">
      <kbd>WASD</kbd> scroll &nbsp;|&nbsp;
      <kbd>Right-click</kbd> drag pan &nbsp;|&nbsp;
      <kbd>1-3</kbd> speed &nbsp;|&nbsp;
      <kbd>Space</kbd> pause &nbsp;|&nbsp;
      <kbd>G</kbd> grid &nbsp;|&nbsp;
      <kbd>V</kbd> overlays &nbsp;|&nbsp;
      <kbd>Esc</kbd> deselect &nbsp;|&nbsp;
      <kbd>Del</kbd> demolish &nbsp;|&nbsp;
      <kbd>Ctrl+S</kbd> save
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
