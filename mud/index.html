<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Krovithus</title>
<meta name="description" content="Live status of Drew's Alter Aeon character, read from the game log.">
<style>
  :root { --bg:#10131a; --card:#171c26; --text:#e6e9f0; --muted:#8b93a7; --hp:#e0564f; --mana:#4f8ee0; --mv:#5fbf7a; --line:#262c3a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; padding:14px 16px 40px; }
  h1 { font-size:22px; margin:0 0 2px; }
  .sub { color:var(--muted); font-size:13px; margin-bottom:12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:10px; }
  .bar { position:relative; height:26px; background:#0b0e14; border-radius:7px; overflow:hidden; margin:6px 0; }
  .bar span { position:absolute; left:0; top:0; bottom:0; width:0; transition:width .4s; }
  .bar b { position:absolute; inset:0; display:flex; align-items:center; justify-content:space-between; padding:0 10px; font-size:14px; font-weight:600; }
  .hp span{background:var(--hp)} .mana span{background:var(--mana)} .mv span{background:var(--mv)}
  .row { display:flex; flex-wrap:wrap; gap:8px 16px; font-size:14px; }
  .row div b { color:var(--muted); font-weight:500; margin-right:4px; }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:0 0 6px; }
  ul { margin:0; padding-left:18px; font-size:14px; }
  li { margin:2px 0; }
  .slot { color:var(--muted); display:inline-block; min-width:86px; }
  .stale { color:#e0b14f; }
  .dead { color:var(--hp); }
  #updated { font-size:12px; color:var(--muted); margin-top:6px; }
</style>
</head>
<body>
<h1>Krovithus</h1>
<div class="sub" id="where">loading…</div>

<div class="card">
  <div class="bar hp"><span id="hpbar"></span><b><i>HP</i><i id="hp">–</i></b></div>
  <div class="bar mana"><span id="mabar"></span><b><i>Mana</i><i id="ma">–</i></b></div>
  <div class="bar mv"><span id="mvbar"></span><b><i>Moves</i><i id="mv">–</i></b></div>
  <div id="updated"></div>
</div>

<div class="card"><h2>Character</h2><div class="row" id="char"></div></div>
<div class="card"><h2>Stats</h2><div class="row" id="stats"></div></div>
<div class="card"><h2>Last fight</h2><div id="fight" style="font-size:14px">–</div></div>
<div class="card"><h2>Equipment</h2><ul id="eq"></ul></div>
<div class="card"><h2>Inventory</h2><ul id="inv"></ul></div>

<script>
const URL_ = "https://igaulapupbtdcqqjobhs.supabase.co/rest/v1/mud_status?id=eq.1&select=updated_at,data";
const KEY = "sb_publishable_7yi3BNg-J-K5nralw5JSww_c71Pge6e";
const $ = id => document.getElementById(id);
function bar(id, cur, max){ const p = max ? Math.max(0, Math.min(100, 100*cur/max)) : 0; $(id+"bar").style.width = p+"%"; }
function render(row){
  const d = row.data || {};
  $("hp").textContent = d.hp != null ? `${d.hp} / ${d.hp_max}` : "–";
  $("ma").textContent = d.mana != null ? `${d.mana} / ${d.mana_max}` : "–";
  $("mv").textContent = d.mv != null ? `${d.mv} / ${d.mv_max}` : "–";
  bar("hp", d.hp, d.hp_max); bar("ma", d.mana, d.mana_max); bar("mv", d.mv, d.mv_max);
  const conn = d.connected === false ? " · offline" : d.connected ? " · online" : "";
  $("where").textContent = (d.room || "location unknown") + conn;
  const s = d.score || {};
  const pairs = [["Level", s.total_level], ["Classes", s.levels], ["XP", s.xp], ["Gold", s.gold], ["Practices", s.practices],
                 ["Hit/Dam", s.hitroll != null ? `${s.hitroll} / ${s.damroll}` : null], ["Armor", s.armor], ["Alignment", s.alignment],
                 ["Carrying", s.carry], ["Quests", s.quests], ["Last level", s.last_levelup]];
  $("char").innerHTML = pairs.filter(p => p[1] != null && p[1] !== "").map(p => `<div><b>${p[0]}</b>${p[1]}</div>`).join("") || "<div>run 'score' in game to fill this in</div>";
  const st = s.stats || {};
  $("stats").innerHTML = ["str","int","wis","dex","con","chr"].filter(k => st[k] != null).map(k => `<div><b>${k.toUpperCase()}</b>${st[k]}</div>`).join("") || "<div>–</div>";
  const f = d.last_fight;
  $("fight").innerHTML = f ? `Killed <b>${f.killed}</b>${f.xp ? ` for ${f.xp} xp` : ""} <span style="color:var(--muted)">at ${f.time}</span>` : "none yet";
  $("eq").innerHTML = (d.equipment || []).map(e => `<li><span class="slot">${e.slot}</span>${e.item}</li>`).join("") || "<li>–</li>";
  $("inv").innerHTML = (d.inventory || []).map(i => `<li>${i}</li>`).join("") || "<li>empty</li>";
  const age = (Date.now() - new Date(row.updated_at).getTime())/1000;
  $("updated").textContent = `stats from ${d.stats_time || "?"} (game clock) · synced ${age < 60 ? Math.round(age)+"s" : Math.round(age/60)+" min"} ago`;
  $("updated").className = age > 300 ? "stale" : "";
}
async function poll(){
  try {
    const r = await fetch(URL_, {headers:{apikey: KEY, Authorization: "Bearer "+KEY}, cache:"no-store"});
    const rows = await r.json();
    if (rows && rows[0]) render(rows[0]);
  } catch (e) { $("updated").textContent = "fetch failed: " + e; }
}
poll(); setInterval(poll, 3000);
</script>
</body>
</html>
