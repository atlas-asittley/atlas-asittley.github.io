<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Docket</title>
<meta name="robots" content="noindex">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #1b1a17; color: #ece7dc; font-family: 'Courier New', monospace; min-height: 100vh; padding: 24px 16px 60px; }
.wrap { max-width: 640px; margin: 0 auto; }
h1.site { font-size: 28px; color: #e8a33d; margin-bottom: 6px; }
.subtitle { color: #8f8878; font-size: 13px; margin-bottom: 22px; }
#gate { max-width: 340px; margin: 40px auto 0; }
#gate label { display: block; font-size: 12px; color: #8f8878; margin: 14px 0 5px; }
input[type=email], input[type=password], input[type=text], select { width: 100%; background: #26241f; border: 1px solid #3d392f; color: #ece7dc; font-family: inherit; font-size: 16px; padding: 11px 12px; border-radius: 6px; }
input:focus, select:focus { outline: none; border-color: #e8a33d; }
.btn { background: #e8a33d; border: 0; color: #1b1a17; font-family: inherit; font-size: 16px; font-weight: bold; padding: 12px 16px; border-radius: 6px; cursor: pointer; }
.btn:disabled { opacity: .55; }
#gate .btn { width: 100%; margin-top: 20px; }
.msg { margin-top: 12px; font-size: 13px; color: #e06c5b; min-height: 18px; }
#add { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
#add input { flex: 1 1 100%; min-width: 0; }
#add select { flex: 1 1 140px; width: auto; }
#add .btn { flex: 0 0 auto; }
.proj { margin-top: 28px; }
.proj > h2 { font-size: 17px; color: #e8a33d; line-height: 1.35; display: flex; align-items: flex-start; gap: 8px; padding-bottom: 8px; border-bottom: 1px solid #3d392f; }
.proj > h2 .ptxt { flex: 1; }
.proj > h2 .pdet { display: block; font-size: 13px; color: #b3ab99; font-weight: normal; margin-top: 4px; line-height: 1.4; }
.proj > h2 .del { margin-top: -2px; }
ul { list-style: none; }
li { display: flex; align-items: flex-start; gap: 8px; padding: 12px 4px 12px 0; border-bottom: 1px solid #2c2a24; }
.grip { flex: none; width: 30px; min-height: 30px; margin-left: -6px; display: inline-flex; align-items: center; justify-content: center; color: #5a5548; font-size: 17px; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
.grip:hover { color: #e8a33d; }
.dragging { background: #26241f; outline: 1px solid #e8a33d; border-radius: 6px; position: relative; z-index: 6; box-shadow: 0 10px 26px rgba(0,0,0,.5); }
.dragging .grip { color: #e8a33d; cursor: grabbing; }
body.dragging-item { user-select: none; -webkit-user-select: none; }
li .chk { flex: none; width: 26px; height: 26px; margin-top: 1px; border: 2px solid #e8a33d; border-radius: 5px; background: none; cursor: pointer; color: #1b1a17; font-size: 16px; font-weight: bold; line-height: 1; }
li.done .chk { background: #e8a33d; }
li .txt { flex: 1; font-size: 16px; line-height: 1.4; word-break: break-word; }
li.done .txt { color: #7a7466; text-decoration: line-through; }
li .tag { display: inline-block; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; padding: 2px 6px; border-radius: 3px; margin-right: 8px; vertical-align: 2px; background: #3d392f; color: #c9c1ae; }
li .tag.today { background: #e8a33d; color: #1b1a17; }
li .tag.waiting { background: #5b6b8a; color: #ece7dc; }
li .tag.revisit { background: #5f7a5a; color: #ece7dc; }
li .det { display: block; font-size: 14px; color: #b3ab99; margin-top: 4px; line-height: 1.4; text-decoration: none; }
li .who { display: block; font-size: 11px; color: #6f6959; margin-top: 4px; text-decoration: none; }
.del { flex: none; background: none; border: 0; color: #5a5548; font-size: 20px; cursor: pointer; padding: 2px 8px; }
.del:hover, .del:focus-visible { color: #e06c5b; }
button:focus-visible { outline: 2px solid #e8a33d; outline-offset: 2px; }
.empty { color: #7a7466; font-size: 14px; padding: 12px 4px 12px 10px; }
details { margin-top: 26px; }
summary { color: #8f8878; font-size: 13px; cursor: pointer; padding: 6px 0; }
#done li .tag { display: none; }
#done li { padding-left: 10px; }
footer { margin-top: 46px; padding-top: 16px; border-top: 1px solid #3d392f; color: #6f6959; font-size: 12px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
footer a, footer button.link { color: #e8a33d; background: none; border: 0; font-family: inherit; font-size: 12px; cursor: pointer; padding: 0; }
.hidden { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <h1 class="site">Docket</h1>
  <p class="subtitle" id="sub">Private. Sign in to see the docket.</p>

  <div id="gate">
    <label for="em">Email</label>
    <input id="em" type="email" autocomplete="username" inputmode="email">
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password">
    <button class="btn" id="go">Sign in</button>
    <div class="msg" id="msg"></div>
  </div>

  <div id="app" class="hidden">
    <form id="add">
      <input id="newtxt" type="text" placeholder="Add an item" autocomplete="off" aria-label="New item">
      <select id="newproj" aria-label="Project"></select>
      <select id="newsec" aria-label="When">
        <option value="today">Today</option>
        <option value="next">Next</option>
        <option value="waiting">Waiting on</option>
        <option value="revisit">Revisit</option>
      </select>
      <button class="btn" type="submit">Add</button>
    </form>
    <div class="msg" id="err"></div>
    <div id="projects"></div>
    <details id="donebox">
      <summary id="donesum">Done</summary>
      <ul id="done"></ul>
    </details>
    <footer>
      <span id="stamp"></span>
      <span><a href="https://atlas-asittley.github.io/">Atlas</a> &nbsp;·&nbsp; <button class="link" id="out">Sign out</button></span>
    </footer>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const sb = window.supabase.createClient('https://igaulapupbtdcqqjobhs.supabase.co', 'sb_publishable_7yi3BNg-J-K5nralw5JSww_c71Pge6e');
const $ = id => document.getElementById(id);
const ORDER = ['today', 'next', 'waiting', 'revisit'];
const LABEL = { today: 'Today', next: 'Next', waiting: 'Waiting on', revisit: 'Revisit' };
let items = [];

function fmt(ts) { return new Date(ts).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }); }
const kidsOf = id => items.filter(k => k.parent_id === id);
// Hand-set order wins (sort_order, written by dragging); untouched items fall back to when-tag, then age.
const byOrder = (a, b) => (a.sort_order || 0) - (b.sort_order || 0) || ORDER.indexOf(a.section) - ORDER.indexOf(b.section) || a.created_at.localeCompare(b.created_at);
const short = p => p.text.split(':')[0];

function delBtn(it) {
  const del = document.createElement('button');
  del.className = 'del'; del.textContent = '×'; del.setAttribute('aria-label', 'Delete');
  del.onclick = () => remove(it);
  return del;
}
function grip() {
  const g = document.createElement('span');
  g.className = 'grip'; g.title = 'drag to move'; g.innerHTML = '&#9776;'; g.setAttribute('aria-hidden', 'true');
  return g;
}

function row(it) {
  const li = document.createElement('li');
  li.dataset.id = it.id;
  if (it.done) li.className = 'done';
  const chk = document.createElement('button');
  chk.className = 'chk'; chk.textContent = it.done ? '✓' : '';
  chk.setAttribute('aria-label', it.done ? 'Mark not done' : 'Mark done');
  chk.onclick = () => toggle(it);
  const txt = document.createElement('span');
  txt.className = 'txt';
  const tag = document.createElement('span');
  tag.className = 'tag ' + it.section; tag.textContent = LABEL[it.section] || it.section;
  txt.append(tag, document.createTextNode(it.text));
  if (it.detail) {
    const det = document.createElement('span');
    det.className = 'det'; det.textContent = it.detail;
    txt.appendChild(det);
  }
  const who = document.createElement('span');
  who.className = 'who';
  const proj = it.done && it.parent_id ? items.find(p => p.id === it.parent_id) : null;
  who.textContent = (it.added_by === 'drew' ? 'added ' : 'added by ' + it.added_by + ' ') + fmt(it.created_at)
    + (it.updated_at && it.updated_at.slice(0, 10) !== it.created_at.slice(0, 10) ? ' · updated ' + fmt(it.updated_at) : '')
    + (it.done && it.done_at ? ' · done ' + fmt(it.done_at) : '')
    + (proj ? ' · ' + short(proj) : '');
  txt.appendChild(who);
  if (!it.done) li.append(grip());
  li.append(chk, txt, delBtn(it));
  return li;
}

function projectBlock(p, kids) {
  const sec = document.createElement('section'); sec.className = 'proj';
  if (p) sec.dataset.id = p.id;
  const h = document.createElement('h2');
  const t = document.createElement('span'); t.className = 'ptxt'; t.textContent = p ? p.text : 'Other';
  if (p && p.detail) { const d = document.createElement('span'); d.className = 'pdet'; d.textContent = p.detail; t.appendChild(d); }
  if (p) h.append(grip());
  h.append(t);
  if (p) h.append(delBtn(p));
  const ul = document.createElement('ul');
  if (kids.length) ul.replaceChildren(...kids.sort(byOrder).map(row));
  else ul.innerHTML = '<li class="empty">Nothing under this yet.</li>';
  sec.append(h, ul);
  return sec;
}

function render() {
  const projects = items.filter(i => i.is_project && !i.done).sort(byOrder);
  const frag = document.createDocumentFragment();
  for (const p of projects) frag.append(projectBlock(p, kidsOf(p.id).filter(k => !k.done)));
  const loose = items.filter(i => !i.done && !i.is_project && !i.parent_id);
  if (loose.length) frag.append(projectBlock(null, loose));
  $('projects').replaceChildren(frag);

  const done = items.filter(i => i.done);
  $('done').replaceChildren(...done.map(row));
  $('donebox').classList.toggle('hidden', !done.length);
  $('donesum').textContent = 'Done (' + done.length + ')';

  const open = items.filter(i => !i.done && !i.is_project);
  $('sub').textContent = projects.length + ' projects · ' + open.length + ' open · ' + open.filter(i => i.section === 'today').length + ' for today';

  const sel = $('newproj'), cur = sel.value;
  sel.replaceChildren(...projects.map(p => { const o = document.createElement('option'); o.value = p.id; o.textContent = short(p); return o; }));
  const none = document.createElement('option'); none.value = ''; none.textContent = 'No project'; sel.append(none);
  const np = document.createElement('option'); np.value = 'new'; np.textContent = '+ New project'; sel.append(np);
  if ([...sel.options].some(o => o.value === cur)) sel.value = cur;
}

async function load() {
  $('gate').classList.add('hidden'); $('app').classList.remove('hidden');
  const { data, error } = await sb.from('docket_items').select('*').order('created_at');
  if (error) { $('err').textContent = error.message; return; }
  $('err').textContent = '';
  items = data; render();
  $('stamp').textContent = 'Loaded ' + new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
}

async function toggle(it) {
  const done = !it.done;
  const { error } = await sb.from('docket_items').update({ done, done_at: done ? new Date().toISOString() : null }).eq('id', it.id);
  if (error) { $('err').textContent = error.message; return; }
  load();
}

async function remove(it) {
  const n = kidsOf(it.id).length;
  if (!confirm('Delete "' + it.text + '"' + (n ? ' and the ' + n + ' item' + (n > 1 ? 's' : '') + ' under it' : '') + '?')) return;
  const { error } = await sb.from('docket_items').delete().eq('id', it.id);
  if (error) { $('err').textContent = error.message; return; }
  load();
}

$('add').onsubmit = async e => {
  e.preventDefault();
  const text = $('newtxt').value.trim();
  if (!text) return;
  const pv = $('newproj').value;
  const rec = pv === 'new'
    ? { text, is_project: true, sort_order: 1 + Math.max(0, ...items.filter(i => i.is_project).map(i => i.sort_order || 0)) }
    : { text, section: $('newsec').value, parent_id: pv ? Number(pv) : null };
  const { error } = await sb.from('docket_items').insert(rec);
  if (error) { $('err').textContent = error.message; return; }
  $('newtxt').value = '';
  load();
};
$('newproj').onchange = () => { $('newsec').classList.toggle('hidden', $('newproj').value === 'new'); };

/* Drag the ☰ to reorder: to-dos within their project, projects among projects. Pointer events, not HTML5
   drag-and-drop (which doesn't fire on touch) -- same approach as the hub page. On drop, the page asks
   before saving (Drew, 10-30: "double checks with me that I wanted to move those"); cancel puts it back. */
let st = null;
const dragUnit = el => el.closest('li:not(.done)') || el.closest('.proj');
document.addEventListener('pointerdown', e => {
  const g = e.target.closest('.grip'); if (!g) return;
  const item = dragUnit(g); if (!item || !item.dataset.id) return;
  e.preventDefault();
  try { g.setPointerCapture(e.pointerId); } catch (_) {}
  const parent = item.parentElement;
  st = { item, parent, from: [...parent.children].indexOf(item), ax: e.clientX, ay: e.clientY, moved: false };
  item.classList.add('dragging');
  document.body.classList.add('dragging-item');
  try { navigator.vibrate && navigator.vibrate(8); } catch (_) {}
}, { passive: false });

document.addEventListener('pointermove', e => {
  if (!st) return;
  e.preventDefault();
  const { item, parent } = st;
  item.style.transform = 'translateY(' + (e.clientY - st.ay) + 'px)';
  const el = document.elementFromPoint(e.clientX, e.clientY);
  const over = el && (item.tagName === 'LI' ? el.closest('li') : el.closest('.proj'));
  if (!over || over === item || over.parentElement !== parent || !over.dataset.id) return;
  const sibs = [...parent.children];
  parent.insertBefore(item, sibs.indexOf(over) > sibs.indexOf(item) ? over.nextSibling : over);
  st.moved = true; st.ay = e.clientY;
  item.style.transform = '';
}, { passive: false });

async function endDrag() {
  if (!st) return;
  const { item, parent, from, moved } = st; st = null;
  item.classList.remove('dragging'); item.style.transform = '';
  document.body.classList.remove('dragging-item');
  if (!moved) return;
  const sibs = [...parent.children].filter(c => c.dataset.id);
  const to = sibs.indexOf(item);
  if (to === from) return;
  const it = items.find(i => i.id === Number(item.dataset.id));
  const what = it.is_project ? 'the project "' + short(it) + '"' : '"' + it.text + '"';
  if (!confirm('Move ' + what + ' ' + (to < from ? 'up' : 'down') + ' to spot ' + (to + 1) + ' of ' + sibs.length + '?')) { render(); return; }
  const results = await Promise.all(sibs.map((c, i) => sb.from('docket_items').update({ sort_order: i + 1 }).eq('id', Number(c.dataset.id))));
  const bad = results.find(r => r.error);
  if (bad) { $('err').textContent = 'Could not save the order: ' + bad.error.message; }
  load();
}
document.addEventListener('pointerup', endDrag);
document.addEventListener('pointercancel', endDrag);

$('go').onclick = async () => {
  const btn = $('go'), m = $('msg');
  m.textContent = '';
  const email = $('em').value.trim().toLowerCase(), password = $('pw').value;
  if (!email || !password) { m.textContent = 'Email and password, please.'; return; }
  btn.disabled = true; btn.textContent = 'Signing in…';
  const { error } = await sb.auth.signInWithPassword({ email, password });
  btn.disabled = false; btn.textContent = 'Sign in';
  if (error) { m.textContent = error.message; return; }
  try { localStorage.setItem('songbook:email', email); } catch (_) {}
  load();
};
$('pw').addEventListener('keydown', e => { if (e.key === 'Enter') $('go').click(); });
$('out').onclick = async () => { await sb.auth.signOut(); location.reload(); };
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState !== 'visible') return;
  const { data } = await sb.auth.getSession();
  if (data && data.session) load();
});

(async () => {
  try { $('em').value = localStorage.getItem('songbook:email') || ''; } catch (_) {}
  const { data } = await sb.auth.getSession();
  if (data && data.session) load();
})();
</script>
</body>
</html>
