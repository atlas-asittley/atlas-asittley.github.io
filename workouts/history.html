<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>History</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root { --bg:#1a1a2e; --card:#16213e; --border:#0f3460; --green:#16c79a; --red:#e94560; --text:#eee; --dim:#8a97b1; }
  body { background:var(--bg); color:var(--text); font-family:'Courier New',monospace; padding:16px 14px 60px; max-width:640px; margin:0 auto; -webkit-text-size-adjust:100%; }
  header { display:flex; align-items:baseline; justify-content:space-between; margin-bottom:12px; }
  h1 { font-size:24px; color:var(--green); }
  .back { color:var(--dim); text-decoration:none; font-size:13px; }
  .back:hover { color:var(--green); }
  nav { display:flex; gap:8px; margin-bottom:18px; }
  nav a { flex:1; text-align:center; padding:9px; border:1px solid var(--border); border-radius:8px; text-decoration:none; color:var(--dim); font-size:13px; }
  nav a.active { background:var(--card); color:var(--green); border-color:var(--green); }

  .msg { padding:30px 12px; text-align:center; color:var(--dim); line-height:1.6; }
  .day { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:14px; margin-bottom:14px; }
  .day-head { display:flex; justify-content:space-between; align-items:baseline; cursor:pointer; }
  .day-date { font-size:16px; color:var(--green); }
  .day-type { font-size:12px; color:var(--red); text-transform:uppercase; letter-spacing:.5px; }
  .day-sub { font-size:11px; color:var(--dim); margin-top:2px; }
  .ex { margin-top:10px; font-size:13px; }
  .ex-name { color:var(--text); }
  .ex-sets { color:var(--dim); }
  .toggle { color:var(--dim); font-size:12px; }

  .card { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:14px; margin-bottom:14px; }
  .bw-title { font-size:16px; color:var(--red); margin-bottom:10px; }
  .bw-now { font-size:34px; color:var(--green); font-weight:bold; }
  .bw-sub { font-size:12px; color:var(--dim); }
  .bw-avg { font-size:12px; color:var(--dim); margin-top:6px; }
  .bw-list { margin-top:10px; font-size:12px; color:var(--dim); }
  .bw-list div { display:flex; justify-content:space-between; padding:3px 0; border-top:1px solid var(--border); }
  .bw-tag { color:var(--red); font-size:10px; text-transform:uppercase; letter-spacing:.5px; margin-left:6px; }
</style>
</head>
<body>

<header>
  <h1>📖 History</h1>
  <a class="back" href="https://atlas-asittley.github.io/">← Atlas</a>
</header>

<nav>
  <a href="./">Workout</a>
  <a href="./diet.html">Diet</a>
  <a class="active" href="./history.html">History</a>
  <a href="./hip.html">Hip</a>
</nav>

<div class="card">
  <div class="bw-title">⚖️ Bodyweight <span class="bw-sub" style="font-weight:normal">— trend only, not the whole story</span></div>
  <div id="bw"><span class="bw-sub">loading…</span></div>
</div>

<div class="card">
  <div class="bw-title">📏 Measurements <span class="bw-sub" style="font-weight:normal">— the real recomp gauge</span></div>
  <div id="meas"><span class="bw-sub">loading…</span></div>
</div>

<div id="content"><div class="msg">Loading your history…</div></div>

<script>
(function () {
  var URL = 'https://igaulapupbtdcqqjobhs.supabase.co';
  var KEY = 'sb_publishable_7yi3BNg-J-K5nralw5JSww_c71Pge6e';
  var el = document.getElementById('bw');
  if (!window.supabase) { if (el) el.innerHTML = '<span class="bw-sub">—</span>'; return; }
  var sb = window.supabase.createClient(URL, KEY, { auth: { persistSession: false, autoRefreshToken: false } });
  sb.from('workout_bodyweight').select('log_date,weight,note').order('log_date', { ascending: false }).limit(21)
    .then(function (res) {
      if (res.error || !res.data || !res.data.length) { el.innerHTML = '<span class="bw-sub">No weigh-ins logged yet.</span>'; return; }
      var rows = res.data, latest = rows[0];
      function isEve(r) { return r.note && /evening|before bed/i.test(r.note); }
      var h = '<span class="bw-now">' + latest.weight + ' lb</span> <span class="bw-sub">as of ' + latest.log_date + '</span>';
      // 7-day average of morning-fasted readings only (ignores the old evening/daytime reads)
      var mornings = rows.filter(function (r) { return !isEve(r); }).slice(0, 7);
      if (mornings.length) {
        var avg = mornings.reduce(function (a, r) { return a + Number(r.weight); }, 0) / mornings.length;
        h += '<div class="bw-avg">7-day morning avg: <span style="color:var(--green)">' + avg.toFixed(1) + ' lb</span> <span class="bw-sub">(' + mornings.length + ' reads)</span></div>';
      }
      h += '<div class="bw-list">';
      rows.forEach(function (r) {
        h += '<div><span>' + r.log_date + (isEve(r) ? '<span class="bw-tag">eve</span>' : '') + '</span><span>' + r.weight + ' lb</span></div>';
      });
      h += '</div>';
      el.innerHTML = h;
    });
})();
</script>

<script>
(function () {
  var URL = 'https://igaulapupbtdcqqjobhs.supabase.co';
  var KEY = 'sb_publishable_7yi3BNg-J-K5nralw5JSww_c71Pge6e';
  var el = document.getElementById('meas');
  if (!el) return;
  if (!window.supabase) { el.innerHTML = '<span class="bw-sub">—</span>'; return; }
  var sb = window.supabase.createClient(URL, KEY, { auth: { persistSession: false, autoRefreshToken: false } });
  // shoulders/chest/arm/thigh up = good (green); waist up = bad (red)
  var FIELDS = [['shoulders', 'Shoulders'], ['chest', 'Chest'], ['arm', 'Arm'], ['thigh', 'Thigh'], ['waist', 'Waist']];
  sb.from('workout_measurements').select('log_date,waist,shoulders,chest,arm,thigh,note').order('log_date', { ascending: false }).limit(24)
    .then(function (res) {
      if (res.error) { el.innerHTML = '<span class="bw-sub">—</span>'; return; }
      var rows = res.data || [];
      if (!rows.length) {
        el.innerHTML = '<span class="bw-sub">No measurements yet. Tell your coach your <b>waist</b>, <b>shoulders</b>, and <b>arm</b> (inches) and they\'ll log the first set — then we track the recomp here instead of guessing from the scale.</span>';
        return;
      }
      var latest = rows[0], oldest = rows[rows.length - 1];
      var h = '<div class="bw-sub">Latest: ' + latest.log_date + (rows.length > 1 ? ' · change vs first (' + oldest.log_date + ')' : '') + '</div><div class="bw-list">';
      FIELDS.forEach(function (f) {
        var k = f[0], v = latest[k];
        if (v == null) return;
        var d = '';
        if (rows.length > 1 && oldest[k] != null) {
          var diff = Number(v) - Number(oldest[k]);
          if (Math.abs(diff) >= 0.05) {
            var good = (k === 'waist') ? (diff < 0) : (diff > 0);
            d = ' <span style="color:' + (good ? 'var(--green)' : 'var(--red)') + '">(' + (diff > 0 ? '+' : '') + diff.toFixed(1) + '")</span>';
          } else { d = ' <span class="bw-sub">(no change)</span>'; }
        }
        h += '<div><span>' + f[1] + '</span><span>' + v + '"' + d + '</span></div>';
      });
      h += '</div>';
      if (latest.note) h += '<div class="bw-sub" style="margin-top:8px">' + latest.note + '</div>';
      el.innerHTML = h;
    });
})();
</script>

<script>
(function () {
  var URL = 'https://igaulapupbtdcqqjobhs.supabase.co';
  var KEY = 'sb_publishable_7yi3BNg-J-K5nralw5JSww_c71Pge6e';
  var c = document.getElementById('content');
  if (!window.supabase) { c.innerHTML = '<div class="msg">Failed to load.</div>'; return; }
  var sb = window.supabase.createClient(URL, KEY, { auth: { persistSession: false, autoRefreshToken: false } });

  function fmtDur(min) { if (min < 60) return min + ' min'; var h = Math.floor(min / 60), m = min % 60; return h + 'h' + (m ? ' ' + m + 'm' : ''); }
  function fmtSet(s) {
    if (s.actual_reps == null) return null;
    var w = (s.actual_weight === 0 || s.actual_weight == null) ? '' : ('×' + s.actual_weight);
    return s.actual_reps + w;
  }

  async function load() {
    try {
      var ses = await sb.from('workout_sessions')
        .select('id,session_date,day_type,equipment,bodyweight,created_at,completed_at,started_at')
        .eq('status', 'completed').order('completed_at', { ascending: false });
      if (ses.error) throw ses.error;
      if (!ses.data.length) { c.innerHTML = '<div class="msg">No completed workouts yet.</div>'; return; }

      var ids = ses.data.map(function (s) { return s.id; });
      var st = await sb.from('workout_sets')
        .select('session_id,exercise,exercise_order,set_index,actual_reps,actual_weight')
        .in('session_id', ids);
      if (st.error) throw st.error;

      var sMeta = {};
      ses.data.forEach(function (s) { sMeta[s.id] = s; });

      // group sessions by date + day_type (merges same-day split sessions)
      var groups = {}, order = [];
      ses.data.forEach(function (s) {
        var k = s.session_date + '|' + s.day_type;
        if (!groups[k]) { groups[k] = { date: s.session_date, type: s.day_type, equipment: s.equipment, bw: s.bodyweight, durSec: 0, sets: [] }; order.push(k); }
        if (s.bodyweight != null && groups[k].bw == null) groups[k].bw = s.bodyweight;
        // sum each session's own start→save time (avoids counting the gap between split same-day sessions)
        if (s.started_at && s.completed_at) groups[k].durSec += Math.max(0, (new Date(s.completed_at) - new Date(s.started_at)) / 1000);
      });
      st.data.forEach(function (row) {
        var m = sMeta[row.session_id]; if (!m) return;
        var k = m.session_date + '|' + m.day_type;
        if (!groups[k]) return;
        row._ord = m.created_at + '|' + String(row.exercise_order).padStart(3, '0') + '|' + String(row.set_index).padStart(3, '0');
        groups[k].sets.push(row);
      });

      c.innerHTML = '';
      order.forEach(function (k, idx) {
        var g = groups[k];
        g.sets.sort(function (a, b) { return a._ord < b._ord ? -1 : a._ord > b._ord ? 1 : 0; });
        // group sets by exercise, preserving order
        var exOrder = [], exMap = {};
        g.sets.forEach(function (s) {
          var f = fmtSet(s); if (f == null) return;
          if (!exMap[s.exercise]) { exMap[s.exercise] = []; exOrder.push(s.exercise); }
          exMap[s.exercise].push(f);
        });

        var box = document.createElement('div'); box.className = 'day';
        var body = exOrder.map(function (name) {
          return '<div class="ex"><span class="ex-name">' + name + '</span> — <span class="ex-sets">' + exMap[name].join(', ') + '</span></div>';
        }).join('');
        var d = new Date(g.date + 'T00:00:00');
        var pretty = d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
        var dur = g.durSec ? fmtDur(Math.round(g.durSec / 60)) : '';
        var sub = [g.equipment, (g.bw != null ? g.bw + ' lb' : ''), (dur ? '⏱ ' + dur : '')].filter(Boolean).join(' · ');
        var open = idx < 3; // most recent 3 expanded
        box.innerHTML =
          '<div class="day-head"><div><div class="day-date">' + pretty + '</div>' +
          (sub ? '<div class="day-sub">' + sub + '</div>' : '') + '</div>' +
          '<div style="text-align:right"><div class="day-type">' + g.type + '</div>' +
          '<div class="toggle">' + (open ? '▼' : '▶') + '</div></div></div>' +
          '<div class="day-body" style="' + (open ? '' : 'display:none') + '">' + body + '</div>';
        var head = box.querySelector('.day-head'), bodyEl = box.querySelector('.day-body'), tog = box.querySelector('.toggle');
        head.addEventListener('click', function () {
          var show = bodyEl.style.display === 'none';
          bodyEl.style.display = show ? 'block' : 'none';
          tog.textContent = show ? '▼' : '▶';
        });
        c.appendChild(box);
      });
    } catch (e) {
      c.innerHTML = '<div class="msg">Error loading history:<br>' + (e.message || e) + '</div>';
    }
  }
  load();
})();
</script>
</body>
</html>
