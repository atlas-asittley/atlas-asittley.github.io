<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Workout Tracker</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #1a1a2e; --card: #16213e; --border: #0f3460;
    --green: #16c79a; --red: #e94560; --text: #eee; --dim: #8a97b1;
  }
  body {
    background: var(--bg); color: var(--text);
    font-family: 'Courier New', monospace;
    padding: 16px 14px 120px; max-width: 640px; margin: 0 auto;
    -webkit-text-size-adjust: 100%;
  }
  header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 6px; }
  h1 { font-size: 24px; color: var(--green); }
  .back { color: var(--dim); text-decoration: none; font-size: 13px; }
  .back:hover { color: var(--green); }
  nav { display: flex; gap: 8px; margin-bottom: 16px; }
  nav a { flex: 1; text-align: center; padding: 9px; border: 1px solid var(--border); border-radius: 8px; text-decoration: none; color: var(--dim); font-size: 13px; }
  nav a.active { background: var(--card); color: var(--green); border-color: var(--green); }
  #session-head { color: var(--dim); font-size: 13px; margin-bottom: 18px; line-height: 1.5; }

  #today-banner:not(:empty) { margin-bottom: 16px; }
  .today { border-radius: 10px; padding: 12px 14px; border: 1px solid var(--border); background: var(--card); }
  .today.tb-train { border-color: var(--green); background: rgba(22,199,154,.09); }
  .today.tb-done  { border-color: var(--dim); }
  .tb-main { font-size: 15px; color: var(--text); line-height: 1.4; }
  .tb-sub  { font-size: 12px; color: var(--dim); margin-top: 4px; line-height: 1.4; }
  .tb-hip  { font-size: 11px; color: var(--dim); margin-top: 9px; border-top: 1px solid var(--border); padding-top: 8px; }
  .tb-link { color: var(--green); text-decoration: none; }
  #session-head b { color: var(--text); }

  .msg { padding: 40px 12px; text-align: center; color: var(--dim); line-height: 1.6; }
  .msg.err { color: #f0a0a0; }

  .exercise { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-bottom: 14px; }
  .exercise h2 { font-size: 17px; color: var(--red); margin-bottom: 4px; }
  .ex-meta { font-size: 12px; color: var(--dim); margin-bottom: 4px; }
  .ex-note { font-size: 12px; color: var(--green); margin-bottom: 4px; line-height: 1.4; }
  .ex-last { font-size: 12px; color: var(--dim); margin-bottom: 10px; }
  .ex-last b { color: var(--text); }

  .set-row { display: grid; grid-template-columns: 44px 1fr 1fr auto; gap: 8px; align-items: center; margin-bottom: 8px; }
  .set-lbl { font-size: 13px; color: var(--dim); }
  .field { display: flex; flex-direction: column; }
  .field span { font-size: 10px; color: var(--dim); margin-bottom: 2px; text-transform: uppercase; letter-spacing: .5px; }
  input[type=number], input[type=text], textarea {
    background: var(--bg); border: 1px solid var(--border); color: var(--text);
    border-radius: 6px; padding: 9px 8px; font-family: inherit; font-size: 16px; width: 100%;
  }
  input:focus, textarea:focus { outline: none; border-color: var(--green); }
  .rest-btn {
    background: var(--border); color: var(--text); border: none; border-radius: 6px;
    padding: 9px 10px; font-family: inherit; font-size: 12px; cursor: pointer; white-space: nowrap; align-self: end;
  }
  .rest-btn:active { background: var(--green); color: var(--bg); }

  .how { background: none; border: 1px solid var(--border); color: var(--dim); border-radius: 6px; padding: 6px 10px; font-family: inherit; font-size: 12px; cursor: pointer; margin-bottom: 10px; }
  .how:active { color: var(--green); border-color: var(--green); }
  .demo { margin-bottom: 12px; }
  .demo img { width: 100%; max-width: 300px; border-radius: 8px; border: 1px solid var(--border); background: #fff; display: block; }
  .demo-cap { font-size: 10px; color: var(--dim); margin-top: 4px; }
  .demo-how { font-size: 12px; color: var(--text); line-height: 1.5; margin-top: 6px; }

  .section-h { font-size: 17px; color: var(--green); margin: 26px 2px 4px; padding-top: 18px; border-top: 1px solid var(--border); }
  .group-h { font-size: 12px; color: var(--dim); text-transform: uppercase; letter-spacing: .6px; margin: 16px 2px 8px; }
  .hip-note { font-size: 12px; margin: 2px 2px 10px; line-height: 1.4; }
  .hip-note a { color: var(--green); text-decoration: none; }
  .ex-inputs { display: flex; gap: 10px; align-items: flex-end; }
  .ex-inputs .field { flex: 1; }
  .save-hip { width: 100%; margin-top: 8px; background: var(--green); color: #04231b; border: none; border-radius: 8px; padding: 12px; font-size: 15px; font-weight: bold; font-family: inherit; }
  .save-hip:disabled { opacity: .6; }
  .saved-hip { text-align: center; font-size: 13px; margin: 10px 0 20px; }
  .vid { color: var(--dim); font-size: 12px; text-decoration: none; margin-left: 8px; white-space: nowrap; }
  .vid:active { color: var(--green); }

  .session-extras { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-bottom: 14px; }
  .session-extras label { display: block; font-size: 12px; color: var(--dim); margin-bottom: 6px; }
  .session-extras input, .session-extras textarea { margin-bottom: 12px; }
  textarea { min-height: 60px; resize: vertical; }

  #submit {
    position: fixed; left: 0; right: 0; bottom: 0; width: 100%;
    background: var(--green); color: var(--bg); border: none; padding: 18px;
    font-family: inherit; font-size: 17px; font-weight: bold; cursor: pointer; letter-spacing: .5px;
  }
  #submit:disabled { background: var(--border); color: var(--dim); }

  #rest-bar {
    position: fixed; left: 0; right: 0; top: 0; background: var(--red); color: #fff;
    text-align: center; padding: 12px; font-size: 20px; font-weight: bold; display: none; z-index: 10;
  }
  #rest-bar.done { background: var(--green); color: var(--bg); }
  #rest-bar small { display: block; font-size: 11px; font-weight: normal; opacity: .85; }
  #rest-bar .stop { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); font-size: 13px; text-decoration: underline; cursor: pointer; }
</style>
</head>
<body>

<div id="rest-bar"><span id="rest-txt"></span><small>rest timer</small><span class="stop" onclick="stopRest()">stop</span></div>

<header>
  <h1>💪 Workout</h1>
  <a class="back" href="https://atlas-asittley.github.io/">← Atlas</a>
</header>
<nav>
  <a class="active" href="./">Workout</a>
  <a href="./diet.html">Diet</a>
  <a href="./history.html">History</a>
  <a href="./hip.html">Hip</a>
</nav>
<div id="today-banner"></div>

<div id="session-head"></div>

<div id="content"><div class="msg">Loading today's workout…</div></div>

<div id="extras-slot"></div>

<button id="submit" style="display:none" onclick="submitSession()">Save workout</button>

<div id="hip-section"></div>

<script>
(function () {
  var SUPABASE_URL = 'https://igaulapupbtdcqqjobhs.supabase.co';
  var SUPABASE_ANON_KEY = 'sb_publishable_7yi3BNg-J-K5nralw5JSww_c71Pge6e';

  if (!window.supabase || typeof window.supabase.createClient !== 'function') {
    document.getElementById('content').innerHTML =
      '<div class="msg err">Failed to load Supabase library.<br>Check your connection and reload.</div>';
    return;
  }
  // persistSession:false so this app never inherits a login from another app on
  // the same origin (which would change our DB role and hide anon data).
  var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: false, autoRefreshToken: false } });

  var session = null;      // the prescribed session row
  var sets = [];           // its sets (with a ._el reference after render)

  // ---------- helpers ----------
  function fmtSet(s) {
    var w = (s.actual_weight === 0 || s.actual_weight) ? s.actual_weight : '';
    return s.actual_reps + (w !== '' ? '×' + w : '');
  }
  function num(v) { if (v === '' || v === null || v === undefined) return null; var n = Number(v); return isNaN(n) ? null : n; }
  function todayISO() { var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
  function daysBetween(a, b) { return Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 86400000); }

  // ---------- "what's on today" banner ----------
  // Uses a queued session if one exists; otherwise infers rest/train + upper/lower
  // from the last completed workout and the usual every-other-day alternation.
  async function renderTodayBanner() {
    var el = document.getElementById('today-banner');
    if (!el) return;
    try {
      var presQ = await sb.from('workout_sessions').select('day_type')
        .eq('status', 'prescribed').order('created_at', { ascending: false }).limit(1);
      var lastQ = await sb.from('workout_sessions').select('session_date,day_type')
        .eq('status', 'completed').order('completed_at', { ascending: false }).limit(1);
      var pres = presQ.data && presQ.data[0];
      var last = lastQ.data && lastQ.data[0];
      function opp(t) { return t === 'lower' ? 'Upper' : 'Lower / legs'; }
      function isLegs(label) { return label.indexOf('Lower') === 0; }

      var main, sub = '', cls = 'today';
      if (pres) {
        var pl = (pres.day_type === 'lower' ? 'Lower / legs' : 'Upper') + ' lift';
        main = '🏋️ Today: <b>' + pl + '</b> — it’s queued below 👇';
        if (pres.day_type === 'lower') sub = 'Glute-med warm-up first (see Hip), depth-capped squats.';
        cls += ' tb-train';
      } else if (!last) {
        main = '🏋️ Start with an <b>Upper</b> lift.'; sub = 'Tell your coach which gym to get it queued.'; cls += ' tb-train';
      } else {
        var next = opp(last.day_type), days = daysBetween(last.session_date, todayISO());
        if (days <= 0) {
          main = '✅ <b>Trained today</b> (' + (last.day_type === 'lower' ? 'lower' : 'upper') + ').';
          sub = 'Tomorrow: rest + hip mobility. Then: ' + next + ' lift.'; cls += ' tb-done';
        } else if (days === 1) {
          main = '🧘 <b>Rest day.</b>';
          sub = 'Do your ~5-min hip mobility. Next up: <b>' + next + '</b> lift — tell your coach the gym.';
        } else {
          main = '🏋️ <b>' + next + ' lift</b> is due today.';
          sub = 'Tell your coach which gym to queue it' + (isLegs(next) ? ' — Park West (barbell) is best for legs; glute-med warm-up first.' : '.');
          cls += ' tb-train';
        }
      }
      var hip = '<div class="tb-hip">🦵 Daily: ~5-min hip mobility (90/90 + airplanes). <a class="tb-link" href="./hip.html">Hip ›</a></div>';
      el.className = cls;
      el.innerHTML = '<div class="tb-main">' + main + '</div>' + (sub ? '<div class="tb-sub">' + sub + '</div>' : '') + hip;
    } catch (e) { el.innerHTML = ''; }
  }

  // exercise name -> local demo folder (public-domain free-exercise-db image pairs)
  var DEMOS = {
    'db bench press': 'Dumbbell_Bench_Press',
    'one-arm db row': 'One-Arm_Dumbbell_Row',
    'db shoulder press': 'Dumbbell_Shoulder_Press',
    'db lateral raise': 'Side_Lateral_Raise',
    'cable lateral raise': 'Side_Lateral_Raise',
    'db pullover': 'Straight-Arm_Dumbbell_Pullover',
    'db shrugs': 'Dumbbell_Shrug',
    'db curls': 'Dumbbell_Bicep_Curl',
    'overhead db triceps ext': 'Standing_Dumbbell_Triceps_Extension',
    'db squat': 'Dumbbell_Squat',
    'goblet squat': 'Dumbbell_Squat',
    'goblet or db squat': 'Dumbbell_Squat',
    'barbell back squat': 'Barbell_Full_Squat',
    'barbell squat': 'Barbell_Full_Squat',
    'db romanian deadlift': 'Stiff-Legged_Dumbbell_Deadlift',
    'barbell romanian deadlift': 'Romanian_Deadlift',
    'barbell rdl': 'Romanian_Deadlift',
    'walking lunges': 'Dumbbell_Lunges',
    'bulgarian split squat': 'Split_Squat_with_Dumbbells',
    'db calf raise': 'Standing_Dumbbell_Calf_Raise',
    'db calf raises': 'Standing_Dumbbell_Calf_Raise'
  };
  function wireDemo(box, slug) {
    var btn = box.querySelector('.how'), demo = box.querySelector('.demo'), img = demo.querySelector('img');
    var base = 'exercises/' + slug + '/', frame = 0, timer = null;
    img.src = base + '0.jpg';
    btn.addEventListener('click', function () {
      var open = demo.style.display === 'none';
      demo.style.display = open ? 'block' : 'none';
      btn.textContent = open ? '▼ Hide demo' : '▶ How to do it';
      if (open && !timer) { timer = setInterval(function () { frame ^= 1; img.src = base + frame + '.jpg'; }, 900); }
      else if (!open && timer) { clearInterval(timer); timer = null; }
    });
  }

  // ---------- rest timer ----------
  var restInt = null;
  window.stopRest = function () { if (restInt) clearInterval(restInt); restInt = null; document.getElementById('rest-bar').style.display = 'none'; };
  function beep() {
    try {
      var ctx = new (window.AudioContext || window.webkitAudioContext)();
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination); o.frequency.value = 880; o.type = 'sine';
      g.gain.setValueAtTime(0.4, ctx.currentTime); o.start();
      o.stop(ctx.currentTime + 0.35); g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
    } catch (e) {}
    if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
  }
  function startRest(seconds) {
    if (!seconds || seconds < 1) seconds = 90;
    if (restInt) clearInterval(restInt);
    var bar = document.getElementById('rest-bar'), txt = document.getElementById('rest-txt');
    bar.className = ''; bar.style.display = 'block';
    var left = seconds;
    function paint() {
      var m = Math.floor(left / 60), s = left % 60;
      txt.textContent = m + ':' + String(s).padStart(2, '0');
    }
    paint();
    restInt = setInterval(function () {
      left--;
      if (left <= 0) { clearInterval(restInt); restInt = null; txt.textContent = 'Go! 💪'; bar.className = 'done'; beep(); return; }
      paint();
    }, 1000);
  }

  // ---------- load ----------
  // ---------- hip routine (consolidated onto this page) ----------
  var HIP = [
    { g:'Daily mobility (~5 min)', n:'90/90 hip switches', t:'8–10 / side', u:'reps',
      how:'Sit with both knees bent 90° — one shin in front, one out to the side. Rotate both knees to the other side under control, chest tall. Add a gentle lift-off of the back knee for active internal rotation. Slow. Out of any groin pinch.' },
    { g:'Daily mobility (~5 min)', n:'Hip airplanes (supported)', t:'5 / side', u:'reps',
      how:'Stand on one leg, hold something for balance. Hinge forward and rotate your pelvis open, then back closed, over the planted foot. Slow and controlled — trains internal-rotation control under load.' },
    { g:'Daily mobility (~5 min)', n:'Couch stretch', t:'30–60s / side', u:'sec',
      how:'Kneel with your rear foot up a wall/couch, torso tall. Gentle hip-flexor stretch. Keep it, but ease off if it ever refers into the groin pinch.' },
    { g:'Glute-med warm-up (do before your lift)', n:'Side-lying hip abduction', t:'2–3 × 12–15 / side', u:'reps',
      how:'Lie on your side. Raise the top leg with it slightly BEHIND your body — not straight up (straight up recruits the TFL we\'re quieting). Slow up, slow down. Both sides.' },
    { g:'Glute-med warm-up (do before your lift)', n:'Banded lateral walks', t:'2–3 × 10 steps ea. way', u:'steps',
      how:'Band above the knees, drop into a low athletic stance. Step sideways staying low, no torso sway, tension on the band the whole set.' },
    { g:'Glute-med warm-up (do before your lift)', n:'Step-downs', t:'3 × 8 / side', u:'reps', demo:'Dumbbell_Step_Ups',
      how:'Stand on a low box on one leg. Slowly lower the OTHER heel to tap the floor, then drive back up. Don\'t let the standing knee cave in. (Demo shows a step-up — do it as the slow lowering.)' },
    { g:'Anti-QL core + single-leg', n:'Suitcase carry', t:'3 × 30–40 steps', u:'steps',
      how:'Hold one heavy DB at your side, walk tall, do NOT let it pull you sideways. Load the LEFT hand to force the RIGHT side to stabilize; alternate to train both.' },
    { g:'Anti-QL core + single-leg', n:'Side plank', t:'2–3 × 20–40s / side', u:'sec', demo:'Side_Bridge',
      how:'From knees or feet, stack your body in one straight line and lift the hips. Hold. Both sides — note if one is weaker.' },
    { g:'Anti-QL core + single-leg', n:'Pallof press', t:'2–3 × 10 / side', u:'reps', demo:'Pallof_Press',
      how:'Band/cable at chest height from your side. Press straight out and resist the twist — that anti-rotation is the point. Both sides.' },
    { g:'Anti-QL core + single-leg', n:'Single-leg RDL', t:'3 × 8 / side', u:'reps', demo:'Kettlebell_One-Legged_Deadlift',
      how:'Light. Balance on one leg, hinge at the hip, back leg extends behind, neutral spine. Hip stability + posterior chain. Stop before any pinch.' }
  ];
  var HG_MOB = 'Daily mobility (~5 min)', HG_WARM = 'Glute-med warm-up (do before your lift)', HG_CORE = 'Anti-QL core + single-leg';

  // dayType: 'lower' → mobility + warm-up ; 'upper' → mobility + core ; null (rest) → mobility only
  function renderHipToday(dayType) {
    var host = document.getElementById('hip-section');
    var groups = [HG_MOB];
    if (dayType === 'lower') groups.push(HG_WARM);
    else if (dayType === 'upper') groups.push(HG_CORE);

    host.innerHTML = '<h2 class="section-h">🦵 Hip routine — today</h2>';
    if (dayType === 'lower') host.innerHTML += '<div class="hip-note" style="color:var(--green)">Do the glute-med warm-up BEFORE you lift — it pre-fires the glutes so your back doesn’t compensate.</div>';
    host.innerHTML += '<div class="hip-note" style="color:var(--dim)">Mobility is daily; the strengthening follows your training day. <a href="./hip.html">Details &amp; progress ›</a></div>';

    var lastG = '';
    HIP.filter(function (ex) { return groups.indexOf(ex.g) !== -1; }).forEach(function (ex) {
      if (ex.g !== lastG) { var gh = document.createElement('div'); gh.className = 'group-h'; gh.textContent = ex.g; host.appendChild(gh); lastG = ex.g; }
      var box = document.createElement('div'); box.className = 'exercise';
      var amt = ex.u === 'sec' ? 'seconds' : ex.u === 'steps' ? 'steps' : 'reps';
      var demoImg = ex.demo ? '<img alt="' + ex.n + ' demo"><div class="demo-cap">Public-domain demo · free-exercise-db</div>' : '';
      var yt = 'https://www.youtube.com/results?search_query=' + encodeURIComponent(ex.n + ' exercise how to');
      box.innerHTML =
        '<h2 style="font-size:15px">' + ex.n + '</h2>' +
        '<div class="ex-meta">target ' + ex.t + '</div>' +
        '<button class="how" type="button">▶ How to do it</button>' +
        '<a class="vid" href="' + yt + '" target="_blank" rel="noopener">▶ video ↗</a>' +
        '<div class="demo" style="display:none">' + demoImg + '<div class="demo-how">' + ex.how + '</div></div>' +
        '<div class="ex-inputs">' +
          '<div class="field"><span>sets</span><input type="number" inputmode="numeric" data-hip="' + ex.n + '" data-k="sets"></div>' +
          '<div class="field"><span>' + amt + ' / side</span><input type="number" inputmode="numeric" data-hip="' + ex.n + '" data-k="amount" data-unit="' + ex.u + '"></div>' +
        '</div>';
      (function () {
        var btn = box.querySelector('.how'), demo = box.querySelector('.demo'), img = demo.querySelector('img');
        var base = ex.demo ? 'exercises/' + ex.demo + '/' : null, frame = 0, timer = null;
        if (img) img.src = base + '0.jpg';
        btn.addEventListener('click', function () {
          var open = demo.style.display === 'none';
          demo.style.display = open ? 'block' : 'none';
          btn.textContent = open ? '▼ Hide' : '▶ How to do it';
          if (img) { if (open && !timer) timer = setInterval(function () { frame ^= 1; img.src = base + frame + '.jpg'; }, 900); else if (!open && timer) { clearInterval(timer); timer = null; } }
        });
      })();
      host.appendChild(box);
    });

    var btn = document.createElement('button'); btn.className = 'save-hip'; btn.type = 'button'; btn.textContent = 'Save hip routine';
    var msg = document.createElement('div'); msg.className = 'saved-hip'; msg.style.display = 'none';
    host.appendChild(btn); host.appendChild(msg);
    btn.addEventListener('click', function () { saveHip(btn, msg); });
  }

  async function saveHip(btn, msg) {
    var byEx = {};
    document.querySelectorAll('#hip-section input[data-hip]').forEach(function (el) {
      var name = el.getAttribute('data-hip'), k = el.getAttribute('data-k'), v = el.value.trim();
      if (v === '') return;
      byEx[name] = byEx[name] || { exercise: name, log_date: todayISO(), sets: null, amount: null, unit: null };
      if (k === 'sets') byEx[name].sets = num(v);
      else { byEx[name].amount = num(v); byEx[name].unit = el.getAttribute('data-unit'); }
    });
    var rows = Object.keys(byEx).map(function (k) { return byEx[k]; });
    if (!rows.length) { msg.style.display = 'block'; msg.style.color = '#f0a500'; msg.textContent = 'Enter at least one exercise.'; return; }
    btn.disabled = true; btn.textContent = 'Saving…';
    var r = await sb.from('workout_hip_routine_log').insert(rows);
    if (r.error) { btn.disabled = false; btn.textContent = 'Save hip routine'; msg.style.display = 'block'; msg.style.color = 'var(--red)'; msg.textContent = 'Save failed: ' + r.error.message; return; }
    msg.style.display = 'block'; msg.style.color = 'var(--green)'; msg.textContent = '✅ Logged ' + rows.length + ' hip exercise' + (rows.length > 1 ? 's' : '') + ' for ' + todayISO();
    document.querySelectorAll('#hip-section input[data-hip]').forEach(function (el) { el.value = ''; });
    btn.disabled = false; btn.textContent = 'Save hip routine';
  }

  async function load() {
    try {
      renderTodayBanner();
      var sess = await sb.from('workout_sessions').select('*')
        .eq('status', 'prescribed').order('created_at', { ascending: false }).limit(1);
      if (sess.error) throw sess.error;
      if (!sess.data.length) { session = null; renderEmpty(); renderHipToday(null); return; }
      session = sess.data[0];

      var st = await sb.from('workout_sets').select('*')
        .eq('session_id', session.id).order('exercise_order').order('set_index');
      if (st.error) throw st.error;
      sets = st.data;

      var names = sets.map(function (s) { return s.exercise; }).filter(function (v, i, a) { return a.indexOf(v) === i; });
      var lastByExercise = await loadLast(names);
      render(lastByExercise);
      renderHipToday(session.day_type);
    } catch (e) {
      document.getElementById('content').innerHTML = '<div class="msg err">Error loading workout:<br>' + (e.message || e) + '</div>';
    }
  }

  async function loadLast(names) {
    var out = {};
    if (!names.length) return out;
    var res = await sb.from('workout_sets')
      .select('exercise,set_index,actual_reps,actual_weight,session_id,workout_sessions!inner(completed_at,status)')
      .in('exercise', names).eq('workout_sessions.status', 'completed');
    if (res.error || !res.data) return out;
    var rows = res.data.filter(function (r) { return r.session_id !== session.id; });
    // pick the most-recent completed session per exercise
    var latestSess = {};
    rows.forEach(function (r) {
      var t = r.workout_sessions.completed_at || '';
      if (!latestSess[r.exercise] || t > latestSess[r.exercise]) latestSess[r.exercise] = t;
    });
    names.forEach(function (n) {
      var picked = rows.filter(function (r) { return r.exercise === n && (r.workout_sessions.completed_at || '') === latestSess[n]; })
        .sort(function (a, b) { return a.set_index - b.set_index; });
      if (picked.length) out[n] = picked.map(fmtSet).join(', ');
    });
    return out;
  }

  function renderEmpty() {
    document.getElementById('content').innerHTML =
      '<div class="msg">No workout queued right now.<br><br>Tell your coach you’re ready to lift and what equipment you’ve got — a session will show up here.</div>';
  }

  // ---------- draft autosave (survives an accidental refresh mid-workout) ----------
  function draftKey() { return 'workout_draft_' + (session && session.id); }
  function fmtDur(min) { if (min < 60) return min + ' min'; var h = Math.floor(min / 60), m = min % 60; return h + 'h' + (m ? ' ' + m + 'm' : ''); }
  function saveDraft() {
    if (!session) return;
    var prev = {}; try { prev = JSON.parse(localStorage.getItem(draftKey()) || '{}'); } catch (e) {}
    // stamp the workout start on the first entry; keep it stable across refreshes
    var d = { sets: {}, bw: '', notes: '', startedAt: prev.startedAt || new Date().toISOString() };
    document.querySelectorAll('input[data-id]').forEach(function (el) {
      var id = el.getAttribute('data-id'), k = el.getAttribute('data-k');
      if (!d.sets[id]) d.sets[id] = {};
      d.sets[id][k] = el.value;
    });
    var bw = document.getElementById('bw'); if (bw) d.bw = bw.value;
    var sn = document.getElementById('snotes'); if (sn) d.notes = sn.value;
    try { localStorage.setItem(draftKey(), JSON.stringify(d)); } catch (e) {}
  }
  function restoreDraft() {
    // drop drafts from older sessions so they don't accumulate
    try {
      for (var i = localStorage.length - 1; i >= 0; i--) {
        var key = localStorage.key(i);
        if (key && key.indexOf('workout_draft_') === 0 && key !== draftKey()) localStorage.removeItem(key);
      }
    } catch (e) {}
    var raw; try { raw = localStorage.getItem(draftKey()); } catch (e) { return; }
    if (!raw) return;
    var d; try { d = JSON.parse(raw); } catch (e) { return; }
    document.querySelectorAll('input[data-id]').forEach(function (el) {
      var id = el.getAttribute('data-id'), k = el.getAttribute('data-k');
      if (d.sets && d.sets[id] && d.sets[id][k] != null && d.sets[id][k] !== '') el.value = d.sets[id][k];
    });
    var bw = document.getElementById('bw'); if (bw && d.bw) bw.value = d.bw;
    var sn = document.getElementById('snotes'); if (sn && d.notes) sn.value = d.notes;
  }
  function clearDraft() { try { localStorage.removeItem(draftKey()); } catch (e) {} }

  // ---------- render ----------
  function render(lastByExercise) {
    var head = 'Session for <b>' + session.session_date + '</b> · <b>' + session.day_type + '</b>';
    if (session.equipment) head += ' · ' + session.equipment;
    document.getElementById('session-head').innerHTML = head;

    var groups = {}; var order = [];
    sets.forEach(function (s) {
      if (!groups[s.exercise_order]) { groups[s.exercise_order] = { name: s.exercise, note: s.exercise_note, rest: s.rest_seconds, sets: [] }; order.push(s.exercise_order); }
      groups[s.exercise_order].sets.push(s);
    });
    order.sort(function (a, b) { return a - b; });

    var c = document.getElementById('content'); c.innerHTML = '';
    order.forEach(function (ord) {
      var g = groups[ord];
      var box = document.createElement('div'); box.className = 'exercise';
      var h = '<h2>' + g.name + '</h2>';
      var repRange = g.sets[0].target_reps ? (g.sets.length + ' × ' + g.sets[0].target_reps + ' reps') : (g.sets.length + ' sets');
      var rest = g.rest ? (' · rest ' + (g.rest >= 60 ? (g.rest/60) + ' min' : g.rest + 's')) : '';
      h += '<div class="ex-meta">' + repRange + rest + '</div>';
      if (g.note) h += '<div class="ex-note">→ ' + g.note + '</div>';
      if (lastByExercise[g.name]) h += '<div class="ex-last">Last time: <b>' + lastByExercise[g.name] + '</b></div>';
      var slug = DEMOS[g.name.toLowerCase().trim()];
      if (slug) h += '<button class="how" type="button">▶ How to do it</button>' +
        '<div class="demo" style="display:none"><img alt="' + g.name + ' demo"><div class="demo-cap">Public-domain demo · free-exercise-db</div></div>';
      box.innerHTML = h;
      if (slug) wireDemo(box, slug);

      g.sets.forEach(function (s) {
        var row = document.createElement('div'); row.className = 'set-row';
        var tgt = (s.target_weight === 0 || s.target_weight) ? s.target_weight : '';
        var tnote = s.target_note ? (' – ' + s.target_note) : '';
        row.innerHTML =
          '<div class="set-lbl">Set ' + s.set_index + '</div>' +
          '<div class="field"><span>reps' + tnote + '</span><input type="number" inputmode="numeric" data-id="' + s.id + '" data-k="reps" placeholder="' + (s.target_reps || '') + '"></div>' +
          '<div class="field"><span>lbs</span><input type="number" inputmode="decimal" data-id="' + s.id + '" data-k="weight" value="' + tgt + '"></div>' +
          '<button class="rest-btn" data-rest="' + (g.rest || 90) + '">Rest</button>';
        row.querySelector('.rest-btn').addEventListener('click', function () { startRest(parseInt(this.getAttribute('data-rest'), 10)); });
        box.appendChild(row);
      });
      c.appendChild(box);
    });

    document.getElementById('extras-slot').innerHTML =
      '<div class="session-extras">' +
      '<label>Bodyweight (lbs, optional)</label><input id="bw" type="number" inputmode="decimal" placeholder="track the bulk">' +
      '<label>How did it feel? (optional)</label><textarea id="snotes" placeholder="notes for your coach"></textarea>' +
      '</div>';

    restoreDraft();
    document.getElementById('content').addEventListener('input', saveDraft);
    document.getElementById('extras-slot').addEventListener('input', saveDraft);

    document.getElementById('submit').style.display = 'block';
  }

  // ---------- submit ----------
  window.submitSession = async function () {
    var btn = document.getElementById('submit');
    btn.disabled = true; btn.textContent = 'Saving…';
    try {
      var startedAt = null;
      try { startedAt = (JSON.parse(localStorage.getItem(draftKey()) || '{}')).startedAt || null; } catch (e) {}
      var endISO = new Date().toISOString();
      var inputs = document.querySelectorAll('input[data-id]');
      var byId = {};
      inputs.forEach(function (el) {
        var id = el.getAttribute('data-id'), k = el.getAttribute('data-k');
        byId[id] = byId[id] || {};
        byId[id][k === 'reps' ? 'actual_reps' : 'actual_weight'] = num(el.value);
      });
      for (var id in byId) {
        var r = await sb.from('workout_sets').update(byId[id]).eq('id', id);
        if (r.error) throw r.error;
      }
      var bw = num(document.getElementById('bw').value);
      var notes = document.getElementById('snotes').value.trim() || null;
      var upd = await sb.from('workout_sessions').update({
        status: 'completed', completed_at: endISO, started_at: startedAt,
        session_date: todayISO(), bodyweight: bw, notes: notes
      }).eq('id', session.id);
      if (upd.error) throw upd.error;
      clearDraft();

      var durMsg = '';
      if (startedAt) {
        var mins = Math.round((new Date(endISO) - new Date(startedAt)) / 60000);
        if (mins > 0 && mins < 600) durMsg = '<br><br>⏱ ' + fmtDur(mins) + ' in the gym';
      }
      document.getElementById('content').innerHTML = '<div class="msg">✅ Logged. Nice work.' + durMsg + '<br><br>Your coach will read these numbers and program the next session.</div>';
      document.getElementById('extras-slot').innerHTML = '';
      document.getElementById('session-head').innerHTML = '';
      btn.style.display = 'none';
      window.scrollTo(0, 0);
    } catch (e) {
      alert('Save failed: ' + (e.message || e));
      btn.disabled = false; btn.textContent = 'Save workout';
    }
  };

  // Re-check for a queued workout when the page is restored from the mobile
  // back-forward cache (otherwise a tab opened earlier stays stale).
  window.addEventListener('pageshow', function (e) { if (e.persisted) location.reload(); });

  load();
})();
</script>
</body>
