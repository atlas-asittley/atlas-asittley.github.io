<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Check-in</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root { --bg:#1a1a2e; --card:#16213e; --border:#0f3460; --green:#16c79a; --red:#e94560; --amber:#f0a500; --text:#eee; --dim:#8a97b1; }
  body { background:var(--bg); color:var(--text); font-family:'Courier New',monospace; padding:16px 14px 60px; max-width:640px; margin:0 auto; -webkit-text-size-adjust:100%; }
  header { display:flex; align-items:baseline; justify-content:space-between; margin-bottom:12px; }
  h1 { font-size:24px; color:var(--green); }
  .back { color:var(--dim); text-decoration:none; font-size:13px; }
  nav { display:flex; gap:8px; margin-bottom:18px; }
  nav a { flex:1; text-align:center; padding:9px; border:1px solid var(--border); border-radius:8px; text-decoration:none; color:var(--dim); font-size:13px; }
  nav a.active { background:var(--card); color:var(--green); border-color:var(--green); }

  .card { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:14px; margin-bottom:14px; }
  .card h2 { font-size:15px; color:var(--green); margin-bottom:4px; }
  .card .sub { font-size:11px; color:var(--dim); margin-bottom:10px; }
  p { font-size:13px; line-height:1.55; }
  .dim { color:var(--dim); }

  .metric { margin:10px 0; }
  .metric > .lbl { font-size:12px; color:var(--dim); margin-bottom:4px; }
  .scale { display:flex; gap:3px; }
  .scale button { flex:1; min-width:0; background:var(--bg); border:1px solid var(--border); color:var(--dim); border-radius:5px; padding:9px 0; font-family:inherit; font-size:13px; }
  .scale button.sel { background:var(--green); color:#04231b; border-color:var(--green); font-weight:bold; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chips button { background:var(--bg); border:1px solid var(--border); color:var(--text); border-radius:14px; padding:7px 11px; font-family:inherit; font-size:12.5px; }
  .chips button.sel { background:var(--green); color:#04231b; border-color:var(--green); font-weight:bold; }
  label { display:block; font-size:12px; color:var(--dim); margin:12px 0 4px; }
  input[type=number], textarea { background:var(--bg); border:1px solid var(--border); color:var(--text); border-radius:6px; padding:9px 8px; font-family:inherit; font-size:16px; width:100%; }
  input:focus, textarea:focus { outline:none; border-color:var(--green); }
  textarea { min-height:44px; resize:vertical; }

  button.save { width:100%; margin-top:12px; background:var(--green); color:#04231b; border:none; border-radius:8px; padding:13px; font-size:15px; font-weight:bold; font-family:inherit; }
  button.save.sec { background:transparent; color:var(--green); border:1px solid var(--green); }
  button.save:disabled { opacity:.6; }
  .saved { text-align:center; font-size:13px; margin-top:10px; min-height:16px; }
  .due-tag { display:inline-block; font-size:10px; text-transform:uppercase; letter-spacing:.5px; color:var(--amber); border:1px solid var(--amber); border-radius:4px; padding:1px 5px; margin-left:6px; }

  .recent { font-size:12px; }
  .recent .r { display:flex; justify-content:space-between; gap:8px; border-bottom:1px solid var(--border); padding:6px 0; }
  .recent .r:last-child { border-bottom:none; }
  .recent .t { color:var(--dim); white-space:nowrap; }
  .recent .v b { color:var(--red); } .recent .v i { color:var(--amber); font-style:normal; } .recent .v s { color:var(--green); text-decoration:none; }
  .recent .a { color:var(--dim); font-size:11px; }

  /* Same rest-timer bar as the workout page (index.html), for the 1-min gap between
     the two consecutive BP readings. */
  #rest-bar {
    position: fixed; left:0; right:0; top:0; background:var(--red); color:#fff;
    text-align:center; padding:12px; font-size:20px; font-weight:bold; display:none; z-index:10;
  }
  #rest-bar.done { background:var(--green); color:var(--bg); }
  #rest-bar small { display:block; font-size:11px; font-weight:normal; opacity:.85; }
  #rest-bar .stop { position:absolute; right:14px; top:50%; transform:translateY(-50%); font-size:13px; text-decoration:underline; cursor:pointer; }
  .rest-btn {
    background:var(--border); color:var(--text); border:none; border-radius:6px;
    padding:9px 12px; font-family:inherit; font-size:12px; cursor:pointer; white-space:nowrap; margin-top:4px;
  }
  .rest-btn:active { background:var(--green); color:var(--bg); }
</style>
</head>
<body>

<div id="rest-bar"><span id="rest-txt"></span><small id="rest-lbl">rest timer</small><span class="stop" onclick="stopRest()">stop</span></div>

<header>
  <h1>📋 Check-in</h1>
  <a class="back" href="https://atlas-asittley.github.io/">← Atlas</a>
</header>

<nav>
  <a href="./">Workout</a>
  <a href="./diet.html">Diet</a>
  <a href="./history.html">History</a>
  <a class="active" href="./checkin.html">Check-in</a>
</nav>

<!-- momentary pain logger (always available) -->
<div class="card">
  <h2>🩹 How does it feel right now?</h2>
  <div class="sub">Log this a few times a day — and whenever it flares. Takes ~10 seconds. The timing is the point.</div>
  <div id="momentary"></div>
</div>

<!-- blood pressure, 722 protocol — self-hides when the slot is done or the 7 days are complete -->
<div id="bp-host"></div>

<!-- daily + coach-queued items (only when due) -->
<div class="card" id="due-card">
  <div id="due-host"><p class="dim">loading…</p></div>
</div>

<!-- blood pressure history -->
<div class="card" id="bp-hist-card" style="display:none">
  <h2>🩺 Blood pressure log</h2>
  <div id="bp-hist"></div>
</div>

<!-- recent logs -->
<div class="card">
  <h2>Recent logs</h2>
  <div id="recent"><span class="dim">loading…</span></div>
</div>

<script>
(function () {
  var URL = 'https://igaulapupbtdcqqjobhs.supabase.co';
  var KEY = 'sb_publishable_7yi3BNg-J-K5nralw5JSww_c71Pge6e';
  var sb = window.supabase ? window.supabase.createClient(URL, KEY, { auth: { persistSession: false, autoRefreshToken: false } }) : null;

  function pad(n) { return String(n).padStart(2, '0'); }
  function nowLocal() { var d = new Date(); return { iso: d.toISOString(), date: d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()), time: pad(d.getHours()) + ':' + pad(d.getMinutes()), hour: d.getHours() }; }
  function todayISO() { return nowLocal().date; }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  var ACTIVITIES = ['Just woke', 'Sitting <1h', 'Sitting 1–3h', 'Sitting 3h+', 'Standing', 'Walking', 'Driving', 'After workout', 'Lifting', 'Lying down', 'Other'];

  // ---- generic single-select group (delegated) ----
  function groupHtml(gid, opts, cls) {
    return '<div class="' + cls + '" data-group="' + gid + '" data-val="">' +
      opts.map(function (o) { return '<button type="button" data-v="' + esc(String(o)) + '">' + esc(String(o)) + '</button>'; }).join('') + '</div>';
  }
  function gval(gid) { var el = document.querySelector('[data-group="' + gid + '"]'); return el ? (el.getAttribute('data-val') || null) : null; }
  document.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('[data-group] button') : null;
    if (!b) return;
    var g = b.parentNode;
    Array.prototype.forEach.call(g.children, function (x) { x.classList.remove('sel'); });
    b.classList.add('sel'); g.setAttribute('data-val', b.getAttribute('data-v'));
  });

  // ---- momentary logger ----
  function renderMomentary() {
    var h = '';
    h += '<div class="metric"><div class="lbl">Belt line — low back, under the pelvic rim, all the way around — 0 none, 10 worst</div>' + scale('m-back') + '</div>';
    h += '<div class="metric"><div class="lbl">Right side band — hip up to mid-back, between spine and side — 0–10</div>' + scale('m-rband') + '</div>';
    h += '<div class="metric"><div class="lbl">Left hip (pinch) — 0–10</div>' + scale('m-lhip') + '</div>';
    h += '<div class="metric"><div class="lbl">Right hip — 0–10</div>' + scale('m-rhip') + '</div>';
    h += '<label>What were you just doing?</label>' + groupHtml('m-act', ACTIVITIES, 'chips');
    h += '<label>Stress right now (optional)</label>' + groupHtml('m-stress', ['Low', 'Med', 'High'], 'chips');
    h += '<label>Note (optional)</label><textarea id="m-note" placeholder="e.g. worse after driving; eased when I stood up"></textarea>';
    h += '<button class="save" id="log-now" type="button">Log it</button><div class="saved" id="m-saved"></div>';
    document.getElementById('momentary').innerHTML = h;
    document.getElementById('log-now').addEventListener('click', logNow);
  }
  function scale(gid) {
    var opts = []; for (var i = 0; i <= 10; i++) opts.push(i);
    return groupHtml(gid, opts, 'scale');
  }
  function numOr(gid) { var v = gval(gid); return v == null || v === '' ? null : parseInt(v, 10); }

  async function logNow() {
    var btn = document.getElementById('log-now'), saved = document.getElementById('m-saved');
    var back = numOr('m-back'), l = numOr('m-lhip'), r = numOr('m-rhip'), rb = numOr('m-rband');
    if (back == null && l == null && r == null && rb == null) { saved.style.color = 'var(--amber)'; saved.textContent = 'Tap at least one pain number.'; return; }
    if (!sb) { saved.textContent = 'No connection.'; return; }
    btn.disabled = true; btn.textContent = 'Logging…';
    var t = nowLocal();
    var row = { logged_at: t.iso, log_date: t.date, local_time: t.time, hour: t.hour, back: back, r_band: rb, l_hip: l, r_hip: r, activity: gval('m-act'), stress: gval('m-stress'), note: (document.getElementById('m-note').value.trim() || null) };
    var res = await sb.from('workout_symptom_log').insert(row);
    btn.disabled = false; btn.textContent = 'Log it';
    if (res.error) { saved.style.color = 'var(--red)'; saved.textContent = 'Failed: ' + res.error.message; return; }
    saved.style.color = 'var(--green)'; saved.textContent = '✅ Logged at ' + t.time;
    renderMomentary(); // clear for next time
    setTimeout(function () { var s = document.getElementById('m-saved'); if (s) { s.style.color = 'var(--green)'; s.textContent = '✅ Logged at ' + t.time; } }, 0);
    loadRecent();
  }

  // ---- daily (weight + sleep) + coach-queued ----
  var pending = [];
  async function loadDue() {
    var host = document.getElementById('due-host');
    if (!sb) { host.innerHTML = '<p class="dim">No connection.</p>'; return; }
    var today = todayISO();
    var bw = await sb.from('workout_bodyweight').select('id').eq('log_date', today).limit(1);
    var dl = await sb.from('workout_daily_log').select('id').eq('log_date', today).limit(1);
    var cq = await sb.from('workout_checkins').select('*').eq('status', 'pending').order('sort', { ascending: true }).order('created_at', { ascending: true });
    var weightDue = !(bw.data && bw.data.length);
    var sleepDue = !(dl.data && dl.data.length);
    pending = (cq.data || []).filter(function (r) { return !r.due_date || r.due_date <= today; });

    var parts = [];
    if (weightDue || sleepDue) {
      var d = '<h2>☀️ Morning check <span class="due-tag">due</span></h2><div class="sub">Once a day.</div>';
      if (weightDue) d += '<label>Weight (lbs)</label><input id="d-weight" type="number" inputmode="decimal" placeholder="e.g. 222.0">';
      if (sleepDue) d += '<label>Sleep last night</label>' + groupHtml('d-sleep', ['Poor', 'OK', 'Good'], 'chips');
      parts.push(d);
    }
    pending.forEach(function (r) { parts.push(renderCheckin(r)); });

    if (!parts.length) { host.innerHTML = '<h2>✅ Nothing else due</h2><div class="sub">Morning check done and no coach questions waiting. Keep logging how it feels above.</div>'; return; }
    host.innerHTML = parts.join('<div style="height:8px"></div>') + '<button class="save sec" id="save-due" type="button">Submit</button><div class="saved" id="d-saved"></div>';
    document.getElementById('save-due').addEventListener('click', submitDue);
  }

  function renderCheckin(r) {
    var id = 'q-' + r.id, body;
    if (r.input_type === 'measurements') {
      body = '<div class="sub">Morning, fasted, minimal clothing — same way every time. Arm &amp; thigh = LEFT side. Also snap your 3 photos (front / side / back) and send them to your coach.</div>' +
        '<label>Waist (relaxed, narrowest)</label><input id="meas-waist" type="number" inputmode="decimal" placeholder="inches">' +
        '<label>Shoulders (widest)</label><input id="meas-shoulders" type="number" inputmode="decimal" placeholder="inches">' +
        '<label>Chest (fullest)</label><input id="meas-chest" type="number" inputmode="decimal" placeholder="inches">' +
        '<label>Arm — LEFT, flexed</label><input id="meas-arm" type="number" inputmode="decimal" placeholder="inches">' +
        '<label>Thigh — LEFT, largest</label><input id="meas-thigh" type="number" inputmode="decimal" placeholder="inches">';
    }
    else if (r.input_type === 'choice') body = groupHtml(id, (r.choices || '').split('|').filter(Boolean), 'chips');
    else if (r.input_type === 'text') body = '<textarea id="' + id + '" placeholder="your answer"></textarea>';
    else body = '<input id="' + id + '" type="number" inputmode="decimal" placeholder="' + (r.input_type === 'scale' ? '0–10' : 'number') + '">';
    return '<div data-cid="' + r.id + '" data-type="' + esc(r.input_type) + '" data-gid="' + id + '"><h2>❓ ' + esc(r.prompt) + '</h2>' + body + '</div>';
  }

  async function submitDue() {
    var btn = document.getElementById('save-due'), saved = document.getElementById('d-saved');
    btn.disabled = true; btn.textContent = 'Saving…';
    var ops = [], did = 0, t = nowLocal();
    var wEl = document.getElementById('d-weight');
    if (wEl && wEl.value !== '') { ops.push(sb.from('workout_bodyweight').insert({ weight: parseFloat(wEl.value), log_date: t.date, note: 'morning' })); did++; }
    if (gval('d-sleep')) { ops.push(sb.from('workout_daily_log').insert({ log_date: t.date, sleep: gval('d-sleep') })); did++; }
    Array.prototype.forEach.call(document.querySelectorAll('[data-cid]'), function (el) {
      var cid = el.getAttribute('data-cid'), type = el.getAttribute('data-type'), gid = el.getAttribute('data-gid');
      if (type === 'measurements') {
        var mv = function (mid) { var e = document.getElementById(mid); return e && e.value !== '' ? parseFloat(e.value) : null; };
        var mw = mv('meas-waist'), msh = mv('meas-shoulders'), mch = mv('meas-chest'), mar = mv('meas-arm'), mth = mv('meas-thigh');
        if (mw != null || msh != null || mch != null || mar != null || mth != null) {
          ops.push(sb.from('workout_measurements').insert({ log_date: t.date, waist: mw, shoulders: msh, chest: mch, arm: mar, thigh: mth, note: 'via check-in' }));
          ops.push(sb.from('workout_checkins').update({ status: 'done', done_at: t.iso, response_text: 'measured' }).eq('id', cid));
          did++;
        }
        return;
      }
      var txt = null, n2 = null;
      if (type === 'choice') txt = gval(gid);
      else if (type === 'text') { var tx = document.getElementById(gid); txt = tx && tx.value.trim() ? tx.value.trim() : null; }
      else { var ni = document.getElementById(gid); n2 = ni && ni.value !== '' ? parseFloat(ni.value) : null; }
      if (txt != null || n2 != null) { ops.push(sb.from('workout_checkins').update({ status: 'done', done_at: t.iso, response_num: n2, response_text: txt }).eq('id', cid)); did++; }
    });
    if (!did) { btn.disabled = false; btn.textContent = 'Submit'; saved.style.color = 'var(--amber)'; saved.textContent = 'Fill in at least one field.'; return; }
    var results = await Promise.all(ops); var err = null;
    results.forEach(function (r) { if (r && r.error) err = r.error.message; });
    if (err) { btn.disabled = false; btn.textContent = 'Submit'; saved.style.color = 'var(--red)'; saved.textContent = 'Failed: ' + err; return; }
    saved.style.color = 'var(--green)'; saved.textContent = '✅ Saved.';
    setTimeout(loadDue, 700);
  }

  // ---- recent momentary logs ----
  async function loadRecent() {
    var el = document.getElementById('recent');
    if (!sb) { el.innerHTML = '<span class="dim">—</span>'; return; }
    var q = await sb.from('workout_symptom_log').select('log_date,local_time,back,r_band,l_hip,r_hip,activity').order('logged_at', { ascending: false }).limit(12);
    var rows = q.data || [];
    if (!rows.length) { el.innerHTML = '<span class="dim">No logs yet — tap out your first one above.</span>'; return; }
    var today = todayISO(), todayCount = rows.filter(function (r) { return r.log_date === today; }).length;
    var h = '<div class="sub">' + todayCount + ' log(s) today · showing last ' + rows.length + '</div><div class="recent">';
    rows.forEach(function (r) {
      var v = (r.back == null ? '–' : r.back) + '/' + (r.l_hip == null ? '–' : r.l_hip) + '/' + (r.r_hip == null ? '–' : r.r_hip);
      h += '<div class="r"><span class="t">' + (r.log_date === today ? 'today ' : r.log_date.slice(5) + ' ') + (r.local_time || '') + '</span>' +
        '<span class="v"><b>' + (r.back == null ? '–' : r.back) + '</b>/<u>' + (r.r_band == null ? '–' : r.r_band) + '</u>/<i>' + (r.l_hip == null ? '–' : r.l_hip) + '</i>/<s>' + (r.r_hip == null ? '–' : r.r_hip) + '</s></span>' +
        '<span class="a">' + (r.activity ? esc(r.activity) : '') + '</span></div>';
    });
    h += '</div><div class="sub" style="margin-top:6px">belt line / R-band / <span style="color:var(--amber)">Lhip</span> / <span style="color:var(--green)">Rhip</span></div>';
    el.innerHTML = h;
  }

  // ---- blood pressure (722 protocol: 7 days, 2 morning + 2 evening) ----
  // Hides itself when this slot is already logged, or once 7 distinct days exist.
  async function loadBP() {
    var host = document.getElementById('bp-host');
    if (!sb) { host.innerHTML = ''; return; }
    var q = await sb.from('workout_bp_log').select('log_date,slot');
    if (q.error) { host.innerHTML = ''; return; }
    var rows = q.data || [];
    var days = {}; rows.forEach(function (r) { days[r.log_date] = 1; });
    var nDays = Object.keys(days).length;
    if (nDays >= 7) { host.innerHTML = ''; return; }           // protocol complete
    var t = nowLocal();
    var slot = t.hour < 12 ? 'morning' : 'evening';
    var doneThisSlot = rows.filter(function (r) { return r.log_date === t.date && r.slot === slot; }).length;
    if (doneThisSlot >= 2) { host.innerHTML = ''; return; }    // already done

    var dayNum = (days[t.date] ? nDays : nDays + 1);
    // Drew moved to MORNING dosing on 2026-10-08, so the morning reading is now the pre-dose trough.
    var pre = slot === 'morning'
      ? 'Take this <b>BEFORE the benazepril</b> — it is the trough reading and the one the GP needs. No coffee in the 30 min before.'
      : 'Evening reading — about 12h after your morning dose, so this one shows the drug working.';
    host.innerHTML =
      '<div class="card">' +
      '<h2>🩺 Blood pressure — day ' + dayNum + ' of 7 · ' + slot + '</h2>' +
      '<div class="sub">' + pre + '<br>Sit 5 min first · back supported · feet flat · bladder empty · <b>arm on a table at heart level</b> · do not talk during. Two readings a minute apart.</div>' +
      '<div class="metric"><div class="lbl">Reading 1</div>' +
        '<div style="display:flex;gap:8px"><input id="bp1s" type="number" inputmode="numeric" placeholder="systolic"><input id="bp1d" type="number" inputmode="numeric" placeholder="diastolic"></div></div>' +
      '<div class="metric"><div class="lbl">Reading 2 — one minute later</div>' +
        '<button class="rest-btn" id="bp-timer" type="button">⏱ Start 1:00 — then reading 2</button>' +
        '<div style="display:flex;gap:8px"><input id="bp2s" type="number" inputmode="numeric" placeholder="systolic"><input id="bp2d" type="number" inputmode="numeric" placeholder="diastolic"></div></div>' +
      '<label>Pulse (optional, either reading)</label><input id="bppulse" type="number" inputmode="numeric" placeholder="bpm">' +
      '<button class="save" id="bp-save" type="button">Log blood pressure</button><div class="saved" id="bp-saved"></div>' +
      '</div>';
    document.getElementById('bp-save').addEventListener('click', function () { saveBP(slot); });
    document.getElementById('bp-timer').addEventListener('click', function () {
      startRest(60, 'stay seated — then reading 2');
    });
  }

  // ---------- 1-minute timer for the second consecutive reading ----------
  var restInt = null;
  window.stopRest = function () {
    if (restInt) clearInterval(restInt);
    restInt = null;
    document.getElementById('rest-bar').style.display = 'none';
  };
  function beep() {
    try {
      var ctx = new (window.AudioContext || window.webkitAudioContext)();
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination); o.frequency.value = 880; o.type = 'sine';
      g.gain.setValueAtTime(0.4, ctx.currentTime); o.start();
      o.stop(ctx.currentTime + 0.35); g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
    } catch (e) {}
    if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
  }
  function startRest(seconds, label) {
    if (!seconds || seconds < 1) seconds = 60;
    if (restInt) clearInterval(restInt);
    var bar = document.getElementById('rest-bar'),
        txt = document.getElementById('rest-txt'),
        lbl = document.getElementById('rest-lbl');
    bar.className = ''; bar.style.display = 'block';
    if (lbl) lbl.textContent = label || 'rest timer';
    // wall-clock deadline, so a locked screen can't stall the count
    var until = Date.now() + seconds * 1000;
    function paint() {
      var left = Math.max(0, Math.round((until - Date.now()) / 1000));
      if (left <= 0) {
        clearInterval(restInt); restInt = null;
        txt.textContent = 'Take reading 2';
        bar.className = 'done'; beep();
        return;
      }
      var m = Math.floor(left / 60), sec = left % 60;
      txt.textContent = m + ':' + String(sec).padStart(2, '0');
    }
    paint();
    restInt = setInterval(paint, 250);
  }

  async function saveBP(slot) {
    var btn = document.getElementById('bp-save'), msg = document.getElementById('bp-saved');
    var n = function (id) { var v = document.getElementById(id).value; return v === '' ? null : parseInt(v, 10); };
    var a = [n('bp1s'), n('bp1d')], b = [n('bp2s'), n('bp2d')], pulse = n('bppulse');
    var rows = [], t = nowLocal();
    if (a[0] && a[1]) rows.push({ log_date: t.date, slot: slot, reading_index: 1, systolic: a[0], diastolic: a[1], pulse: pulse, before_meds: slot === 'morning' });
    if (b[0] && b[1]) rows.push({ log_date: t.date, slot: slot, reading_index: 2, systolic: b[0], diastolic: b[1], pulse: null, before_meds: slot === 'morning' });
    if (!rows.length) { msg.style.display = 'block'; msg.style.color = 'var(--amber)'; msg.textContent = 'Enter at least one full reading (both numbers).'; return; }
    btn.disabled = true; btn.textContent = 'Saving…';
    var res = await sb.from('workout_bp_log').insert(rows);
    btn.disabled = false; btn.textContent = 'Log blood pressure';
    if (res.error) { msg.style.display = 'block'; msg.style.color = 'var(--red)'; msg.textContent = 'Failed: ' + res.error.message; return; }
    msg.style.display = 'block'; msg.style.color = 'var(--green)'; msg.textContent = '✅ Logged ' + rows.length + ' reading' + (rows.length > 1 ? 's' : '');
    setTimeout(function () { loadBP(); loadBPHistory(); loadRecent(); }, 700);
  }

  // ---- blood pressure history: every reading, plus the running days 2-7 average ----
  async function loadBPHistory() {
    var card = document.getElementById('bp-hist-card'), el = document.getElementById('bp-hist');
    if (!sb) return;
    var q = await sb.from('workout_bp_log').select('log_date,slot,reading_index,systolic,diastolic,pulse')
      .order('log_date', { ascending: true }).order('slot', { ascending: true }).order('reading_index', { ascending: true });
    if (q.error) return;
    var rows = q.data || [];
    if (!rows.length) return;
    card.style.display = '';

    var dayList = []; rows.forEach(function (r) { if (dayList.indexOf(r.log_date) < 0) dayList.push(r.log_date); });
    var day1 = dayList[0];

    // group by day+slot so each line is one sitting
    var groups = {}, order = [];
    rows.forEach(function (r) {
      var k = r.log_date + '|' + r.slot;
      if (!groups[k]) { groups[k] = []; order.push(k); }
      groups[k].push(r);
    });

    var h = '<div class="sub">Day ' + dayList.length + ' of 7. <b>Day 1 is excluded from the average</b> — first-day readings run high, so every guideline drops them.</div><div class="recent">';
    order.forEach(function (k) {
      var parts = k.split('|'), d = parts[0], slot = parts[1], g = groups[k];
      var excl = (d === day1);
      h += '<div class="r" style="' + (excl ? 'opacity:.55' : '') + '">' +
        '<span class="t">' + d.slice(5) + ' ' + slot.slice(0, 3) + (excl ? ' (day 1)' : '') + '</span>' +
        '<span class="v">' + g.map(function (r) { return '<b>' + r.systolic + '</b>/' + r.diastolic; }).join(' · ') + '</span>' +
        '<span class="a">' + (g[0].pulse ? g[0].pulse + ' bpm' : '') + '</span></div>';
    });
    h += '</div>';

    var counted = rows.filter(function (r) { return r.log_date !== day1; });
    if (counted.length) {
      var ms = counted.reduce(function (a, r) { return a + r.systolic; }, 0) / counted.length;
      var md = counted.reduce(function (a, r) { return a + r.diastolic; }, 0) / counted.length;
      h += '<div class="sub" style="margin-top:8px"><b>Average so far (day 1 excluded):</b> ' +
           ms.toFixed(0) + '/' + md.toFixed(0) + ' — from ' + counted.length + ' reading' + (counted.length > 1 ? 's' : '') + '.</div>';
    } else {
      h += '<div class="sub" style="margin-top:8px">No counting readings yet — everything so far is day 1.</div>';
    }
    el.innerHTML = h;
  }

  renderMomentary();
  loadBP();
  loadBPHistory();
  loadDue();
  loadRecent();
})();
</script>
</body>
</html>
