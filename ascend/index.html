<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12100e">
<title>Ascend</title>
<style>
:root{
  --bg:#12100e; --panel:#1c1917; --panel2:#26221e; --line:#332e28;
  --text:#f5efe6; --muted:#a1968a; --amber:#e8a34b; --amber-dim:#8a6330;
  --good:#7fb069; --safe-b: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font:15px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased; overscroll-behavior:none;
}
#app{display:none; flex-direction:column; height:100dvh; max-width:560px; margin:0 auto}

/* ---------- header ---------- */
header{padding:14px 18px 8px; text-align:center; flex:0 0 auto}
.wordmark{
  font-size:12px; letter-spacing:.42em; text-indent:.42em;
  color:var(--amber); font-weight:600; text-transform:uppercase;
}
.quip{margin-top:6px; font-size:14px; color:var(--muted); min-height:2.6em; padding:0 6px}

/* ---------- views ---------- */
main{flex:1 1 auto; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:0 14px}
.view{display:none}
.view.active{display:block}

/* ---------- avatar ---------- */
.stage{display:flex; justify-content:center; padding:4px 0 10px}
.avatar-svg{width:100%; max-width:330px; height:auto; max-height:46dvh; display:block}
.skin{fill:url(#skin); stroke:#4a2510; stroke-width:2; stroke-linejoin:round}
.limb{stroke:url(#skin); fill:none; stroke-linecap:round; stroke-linejoin:round}
.limb-out{stroke:#4a2510; fill:none; stroke-linecap:round; stroke-linejoin:round}
.detail path{stroke:rgba(86,42,18,.5); stroke-width:2.5; fill:none; stroke-linecap:round}
.detail .shade{fill:rgba(120,62,26,.3); stroke:rgba(86,42,18,.4); stroke-width:2}
.aura-grace{fill:url(#graceGrad)}
.aura-ember{fill:url(#emberGrad)}
.aura-radiance{fill:url(#radGrad)}
.g-band{fill:#c4462f}
.g-metal{stroke:#b9b3a8; fill:none; stroke-linecap:round}
.g-gold{fill:#e8c15b; stroke:#a8842c; stroke-width:2}
.g-gem{fill:#5aa9d6; stroke:#2c6b8f; stroke-width:1.5}
.g-cloth{fill:#d8d2c6}
.g-fur{fill:#6f5c46; stroke:#4d3f30; stroke-width:2}
.g-cape{fill:#7b2d3a; stroke:#521e27; stroke-width:2}
.g-chalk{fill:rgba(255,255,255,.3)}
.g-plate{stroke:#9aa2a8; fill:none; stroke-linecap:round}
.g-tank{fill:#2f4f6b; opacity:.92}
.g-brace{fill:#3b3630; stroke:#57503f; stroke-width:2}
.g-mantle{fill:#4a3f6b; stroke:#2f2745; stroke-width:2}

/* ---------- bars ---------- */
.bars{display:grid; gap:9px; padding:4px 2px 14px}
.bar-row{display:grid; grid-template-columns:78px 1fr 40px; align-items:center; gap:10px}
.bar-label{font-size:12px; color:var(--muted); letter-spacing:.06em; text-transform:uppercase}
.bar-track{height:9px; background:var(--panel2); border-radius:99px; overflow:hidden}
.bar-fill{height:100%; border-radius:99px; background:linear-gradient(90deg,var(--amber-dim),var(--amber)); transition:width .8s cubic-bezier(.2,.7,.2,1)}
.bar-pct{font-size:12px; color:var(--muted); text-align:right; font-variant-numeric:tabular-nums}

.frame-strip{
  display:flex; justify-content:space-around; gap:8px; padding:12px 6px;
  background:var(--panel); border:1px solid var(--line); border-radius:14px; margin-bottom:16px;
}
.frame-cell{text-align:center; flex:1}
.frame-val{font-size:17px; font-weight:600; font-variant-numeric:tabular-nums}
.frame-key{font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; margin-top:2px}
.frame-sub{font-size:10px; color:var(--amber-dim); margin-top:1px}

/* ---------- cards ---------- */
.card{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:12px}
.card.beaten{border-color:var(--good)}
.card-top{display:flex; justify-content:space-between; align-items:baseline; gap:10px}
.boss-name{font-size:17px; font-weight:600}
.boss-domain{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.08em}
.boss-blurb{font-size:13px; color:var(--muted); margin:8px 0 12px}
.boss-target{font-size:13px; color:var(--text)}
.boss-meta{display:flex; justify-content:space-between; font-size:12px; color:var(--muted); margin-top:8px}
.boss-reward{font-size:11px; color:var(--amber-dim); margin-top:8px}
.tag-beaten{font-size:11px; color:var(--good); font-weight:600; letter-spacing:.06em}

/* ---------- gear ---------- */
.slot-title{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.12em; margin:16px 0 8px}
.chips{display:flex; flex-wrap:wrap; gap:8px}
.chip{
  border:1px solid var(--line); background:var(--panel); color:var(--text);
  border-radius:99px; padding:9px 14px; font-size:13px; cursor:pointer;
  font-family:inherit; transition:all .15s;
}
.chip[data-on="1"]{border-color:var(--amber); background:var(--amber); color:#1a1410; font-weight:600}
.chip[disabled]{opacity:.42; cursor:default}
.chip small{display:block; font-size:10px; color:var(--muted); font-weight:400}
.chip[data-on="1"] small{color:#5a4326}

/* ---------- tabs ---------- */
nav{
  flex:0 0 auto; display:grid; grid-template-columns:repeat(3,1fr);
  border-top:1px solid var(--line); background:var(--panel);
  padding-bottom:var(--safe-b);
}
nav button{
  background:none; border:0; color:var(--muted); font:inherit; font-size:12px;
  padding:14px 0; cursor:pointer; letter-spacing:.1em; text-transform:uppercase;
}
nav button[aria-selected="true"]{color:var(--amber); box-shadow:inset 0 2px 0 var(--amber)}

.note{font-size:12px; color:var(--muted); text-align:center; padding:10px 0 24px}

/* ---------- sign-in gate ---------- */
#gate{
  display:none; flex-direction:column; justify-content:center; align-items:center;
  height:100dvh; max-width:560px; margin:0 auto; padding:24px; text-align:center;
}
#gate.show{display:flex}
#gate .wordmark{font-size:14px}
.gate-sub{color:var(--muted); font-size:13px; margin:10px 0 28px; max-width:300px}
#gate form{width:100%; max-width:320px; display:grid; gap:10px}
#gate input{
  width:100%; background:var(--panel2); border:1px solid var(--line); color:var(--text);
  border-radius:10px; padding:13px 14px; font:inherit; font-size:16px;
}
#gate input:focus{outline:none; border-color:var(--amber)}
.gate-err{color:#e0705f; font-size:13px; min-height:1.2em}
.signout{
  background:none; border:1px solid var(--line); color:var(--muted);
  border-radius:10px; padding:10px 16px; font:inherit; font-size:13px;
  cursor:pointer; display:block; margin:4px auto 28px;
}
.btn{
  background:var(--amber); color:#1a1410; border:0; border-radius:10px;
  padding:11px 16px; font:inherit; font-weight:600; cursor:pointer; margin-top:10px; width:100%;
}
.btn.ghost{background:none; border:1px solid var(--line); color:var(--muted); font-weight:400}
#app.show{display:flex}
</style>
</head>
<body>
<div id="gate">
  <div class="wordmark">Ascend</div>
  <div class="gate-sub">Drew's progress. Sign in to see it.</div>
  <form id="login-form">
    <input id="login-email" type="email" placeholder="Email" autocomplete="username" required>
    <input id="login-password" type="password" placeholder="Password" autocomplete="current-password" required>
    <button class="btn" id="login-submit" type="submit">Sign in</button>
    <div class="gate-err" id="login-error"></div>
  </form>
</div>

<div id="app">
  <header>
    <div class="wordmark">Ascend</div>
    <div class="quip" id="quip">Reading your numbers…</div>
  </header>

  <main>
    <section class="view active" id="view-avatar">
      <div class="stage" id="stage"></div>
      <div class="bars" id="bars"></div>
      <div class="frame-strip" id="frame"></div>
      <div class="note" id="freshness"></div>
    </section>

    <section class="view" id="view-bosses"></section>
    <section class="view" id="view-gear"></section>
  </main>

  <nav>
    <button data-view="avatar" aria-selected="true">Avatar</button>
    <button data-view="bosses" aria-selected="false">Bosses</button>
    <button data-view="gear"   aria-selected="false">Gear</button>
  </nav>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="data.js"></script>
<script src="stats.js"></script>
<script src="bosses.js"></script>
<script src="gear.js"></script>
<script src="quips.js"></script>
<script src="avatar.js"></script>
<script>
/* ============================================================
   Ascend — app wiring
   ============================================================ */
let STATE = null;

/* ---------------- sign-in gate ----------------
   This is Drew's own body data, and other people have accounts on the
   shared Supabase project — so "any signed-in user" isn't good enough.
   Gated to his account id (a UUID, so no email sits in public source).

   Honest limit: this is a front door, not a vault. The workout_* tables
   still allow public read, exactly like the city builder's do, so the
   anon key can reach them outside this page. Tightening that means
   changing RLS on tables the workout tracker owns — a separate call. */
const OWNER_ID = '1db6581c-1495-453b-b5ce-a371823c64d5';

const auth = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY).auth;

function showGate(msg) {
  document.getElementById('gate').classList.add('show');
  document.getElementById('app').classList.remove('show');
  document.getElementById('login-error').textContent = msg || '';
}

async function enter(session) {
  if (!session || !session.user) return showGate();
  if (session.user.id !== OWNER_ID) {
    await auth.signOut();
    clearSnapshot();
    return showGate("That account isn't Drew's.");
  }
  setAccessToken(session.access_token);
  document.getElementById('gate').classList.remove('show');
  document.getElementById('app').classList.add('show');
  boot();
}

async function signOut() {
  await auth.signOut();
  clearSnapshot();
  setAccessToken(null);
  STATE = null;
  showGate();
}

document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('login-submit');
  const err = document.getElementById('login-error');
  err.textContent = '';
  btn.disabled = true; btn.textContent = 'Signing in…';
  try {
    const { data, error } = await auth.signInWithPassword({
      email: document.getElementById('login-email').value.trim(),
      password: document.getElementById('login-password').value
    });
    if (error) err.textContent = error.message;
    else await enter(data.session);
  } catch (ex) {
    err.textContent = ex.message || 'Sign-in failed.';
  }
  btn.disabled = false; btn.textContent = 'Sign in';
});

auth.getSession()
  .then(r => enter(r.data && r.data.session))
  .catch(() => showGate());

/* Supabase rotates the access token about hourly. Without this, a page
   left open overnight would quietly start failing its reads. */
auth.onAuthStateChange((event, session) => {
  if (event === 'TOKEN_REFRESHED' && session) setAccessToken(session.access_token);
  else if (event === 'SIGNED_OUT') { setAccessToken(null); STATE = null; showGate(); }
});

/* If the session check stalls, don't leave him staring at a blank screen. */
setTimeout(() => {
  const app = document.getElementById('app'), gate = document.getElementById('gate');
  if (!app.classList.contains('show') && !gate.classList.contains('show')) showGate();
}, 4000);

async function boot() {
  let snap;
  try {
    snap = await fetchSnapshot();
  } catch (e) {
    snap = cachedSnapshot();
    if (!snap) {
      document.getElementById('quip').textContent =
        "Can't reach your training log right now. It'll be here when the connection is.";
      return;
    }
  }
  const stats = computeStats(snap);
  const bosses = evaluateBosses(stats, snap);
  const gear = evaluateGear(stats, bosses);
  STATE = { snap, stats, bosses, gear, equipped: reconcile(loadEquipped(), gear) };
  render();
}

/* Never leave something equipped that isn't actually unlocked. */
function reconcile(eq, gear) {
  const ok = new Set(gear.filter(g => g.unlocked).map(g => g.id));
  for (const slot of SLOTS) if (eq[slot] && !ok.has(eq[slot])) eq[slot] = null;
  if (!eq.aura && ok.has('grace')) eq.aura = 'grace';
  return eq;
}

function render() {
  renderHome();
  renderBosses();
  renderGear();
}

/* ---------------- home ---------------- */
function renderHome() {
  const { stats, bosses, snap, equipped } = STATE;
  document.getElementById('quip').textContent = pickQuip(stats, bosses, snap);
  document.getElementById('stage').innerHTML = renderAvatar(stats, equipped);

  const order = ['might', 'width', 'legs', 'resilience'];
  document.getElementById('bars').innerHTML = order.map(k => {
    const b = stats.bars[k];
    return `<div class="bar-row">
      <div class="bar-label">${b.label}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${(b.value * 100).toFixed(1)}%"></div></div>
      <div class="bar-pct">${Math.round(b.value * 100)}</div>
    </div>`;
  }).join('');

  const f = stats.frame;
  const vTrend = f.vFirst ? (f.vRatio - f.vFirst) : 0;
  const arrow = Math.abs(vTrend) < 0.005 ? '' : (vTrend > 0 ? '▲' : '▼');
  document.getElementById('frame').innerHTML = `
    <div class="frame-cell"><div class="frame-val">${f.weight ?? '—'}</div><div class="frame-key">lb</div></div>
    <div class="frame-cell"><div class="frame-val">${f.shoulders ?? '—'}"</div><div class="frame-key">Shoulders</div></div>
    <div class="frame-cell"><div class="frame-val">${f.waist ?? '—'}"</div><div class="frame-key">Waist</div></div>
    <div class="frame-cell">
      <div class="frame-val">${f.vRatio ? f.vRatio.toFixed(2) : '—'}</div>
      <div class="frame-key">V-ratio</div>
      <div class="frame-sub">${arrow} goal ${f.vGoal.toFixed(2)}</div>
    </div>`;

  const c = stats.consistency;
  document.getElementById('freshness').textContent =
    `${c.totalSessions} sessions logged · ${c.last28} in the last 4 weeks · ` +
    (c.daysSinceLast === 0 ? 'trained today' : `${c.daysSinceLast} day${c.daysSinceLast === 1 ? '' : 's'} since the last one`);
}

/* ---------------- bosses ---------------- */
function renderBosses() {
  const { bosses } = STATE;
  const next = bosses.filter(b => !b.beaten).sort((a, b) => b.p - a.p)[0];

  document.getElementById('view-bosses').innerHTML = bosses.map(b => `
    <div class="card ${b.beaten ? 'beaten' : ''}">
      <div class="card-top">
        <div>
          <div class="boss-name">${b.name}</div>
          <div class="boss-domain">${b.domain}</div>
        </div>
        ${b.beaten ? '<div class="tag-beaten">BEATEN</div>'
                   : (b === next ? '<div class="boss-domain" style="color:var(--amber)">CLOSEST</div>' : '')}
      </div>
      <div class="boss-blurb">${b.blurb}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${(b.p * 100).toFixed(1)}%"></div></div>
      <div class="boss-meta"><span>${b.now}</span><span>${b.need}</span></div>
      <div class="boss-target" style="margin-top:8px">${b.target}</div>
      <div class="boss-reward">Unlocks: ${b.reward}</div>
      ${b.selfMark ? `<button class="btn ${b.beaten ? 'ghost' : ''}" data-mark="${b.id}">
          ${b.beaten ? 'Undo' : b.markPrompt}</button>` : ''}
    </div>`).join('') +
    `<div class="note">These are your own next targets from the training plan.
     They fall in the gym, not in here.</div>`;

  document.querySelectorAll('[data-mark]').forEach(btn => {
    btn.onclick = () => {
      const id = btn.dataset.mark;
      setSelfMark(id, !selfMarked()[id]);
      refresh();
    };
  });
}

/* ---------------- gear ---------------- */
function renderGear() {
  const { gear, equipped } = STATE;
  const titles = { head: 'Head', back: 'Back', torso: 'Torso', hands: 'Hands', aura: 'Aura' };

  document.getElementById('view-gear').innerHTML = SLOTS.map(slot => {
    const items = gear.filter(g => g.slot === slot);
    return `<div class="slot-title">${titles[slot]}</div>
      <div class="chips">
        ${items.map(g => `
          <button class="chip" data-id="${g.id}" data-slot="${slot}"
                  data-on="${equipped[slot] === g.id ? 1 : 0}" ${g.unlocked ? '' : 'disabled'}>
            ${g.unlocked ? g.name : 'Locked'}
            <small>${g.unlocked ? (equipped[slot] === g.id ? 'worn' : 'tap to wear') : g.how}</small>
          </button>`).join('')}
      </div>`;
  }).join('') +
  `<div class="note">Gear is the only thing this game gives you.
   Strength is real life's to give.</div>
   <button class="signout" id="signout">Sign out</button>`;

  document.getElementById('signout').onclick = signOut;

  document.querySelectorAll('.chip:not([disabled])').forEach(chip => {
    chip.onclick = () => {
      const { id, slot } = chip.dataset;
      STATE.equipped[slot] = STATE.equipped[slot] === id ? null : id;
      saveEquipped(STATE.equipped);
      renderHome();
      renderGear();
    };
  });
}

function refresh() {
  const { snap } = STATE;
  const stats = computeStats(snap);
  const bosses = evaluateBosses(stats, snap);
  const gear = evaluateGear(stats, bosses);
  STATE = { snap, stats, bosses, gear, equipped: reconcile(STATE.equipped, gear) };
  render();
}

/* ---------------- tabs ---------------- */
function showView(name) {
  if (!document.getElementById('view-' + name)) name = 'avatar';
  document.querySelectorAll('nav button').forEach(b =>
    b.setAttribute('aria-selected', b.dataset.view === name));
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-' + name).classList.add('active');
  document.querySelector('main').scrollTop = 0;
  history.replaceState(null, '', '#' + name);
}
document.querySelectorAll('nav button').forEach(btn => {
  btn.onclick = () => showView(btn.dataset.view);
});
showView((location.hash || '#avatar').slice(1));
</script>
</body>
</html>
